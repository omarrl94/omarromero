a cuando alguien las salta y sabe responder rápido para limitar el daño."}],challenges:[{type:"classify",title:"¿Qué se ha roto?",prompt:"Clasifica cada incidente según el principio de la tríada CIA que afecta principalmente.",categories:[{id:"c",label:"Confidencialidad"},{id:"i",label:"Integridad"},{id:"a",label:"Disponibilidad"}],items:[{text:"Un portátil sin cifrar con datos de clientes se pierde en el tren",cat:"c",explain:"Cualquiera podría leer los datos."},{text:"Un ransomware cifra el servidor de ficheros",cat:"a",explain:"Los ficheros dejan de estar accesibles (y a menudo también hay robo de datos)."},{text:"Alguien modifica el precio de los productos en la tienda online",cat:"i",explain:"Los datos han sido alterados sin autorización."},{text:"El cable de fibra de la oficina se corta durante una obra",cat:"a",explain:"La disponibilidad también se rompe sin atacantes."},{text:"Una contraseña se envía por correo sin cifrar y alguien la intercepta",cat:"c",explain:"Se ha expuesto información secreta."}]},{type:"classify",title:"Capas de defensa",prompt:"¿Cada control sirve sobre todo para prevenir, para detectar o para responder/recuperar?",categories:[{id:"p",label:"Prevenir"},{id:"d",label:"Detectar"},{id:"r",label:"Responder / recuperar"}],items:[{text:"Autenticación multifactor (MFA)",cat:"p",explain:"Impide el acceso aunque roben la contraseña."},{text:"Alertas del SIEM por inicios de sesión anómalos",cat:"d",explain:"Avisan cuando algo raro ocurre."},{text:"Copias de seguridad desconectadas y probadas",cat:"r",explain:"Permiten recuperarse de un ransomware."},{text:"Aplicar parches de seguridad",cat:"p",explain:"Cierra la puerta antes de que la usen."},{text:"Plan de respuesta a incidentes",cat:"r",explain:"Define quién hace qué cuando ocurre algo."},{text:"Revisión diaria de registros (logs)",cat:"d",explain:"Permite descubrir actividad sospechosa."}]}],learned:["Clasificar incidentes según la tríada CIA","Defensa en profundidad","Prevenir · Detectar · Responder"],tip:"Las copias de seguridad que nunca se han restaurado no son copias: son esperanzas."},ik={id:"m1-moneda",module:"m1",teams:["purple"],title:"Las dos caras de la moneda",story:"El director te presenta a los dos equipos: Rojo quiere demostrar que puede entrar; Azul, que puede impedirlo. Tu trabajo es que colaboren para que la empresa mejore. Empiezas aprendiendo el idioma común: MITRE ATT&CK.",lesson:[{title:"El equipo morado",text:"No siempre es un equipo aparte: es una forma de trabajar. Rojo ejecuta (con permiso) una técnica concreta, Azul comprueba si la detecta y entre todos corrigen lo que falle. Se repite hasta cubrir las técnicas más probables."},{title:"MITRE ATT&CK",text:"Catálogo público de tácticas (el «para qué»: acceso inicial, persistencia, escalada de privilegios, exfiltración…) y técnicas (el «cómo») observadas en ataques reales. Permite decir «detectamos la técnica T1110 (fuerza bruta)» y que todo el mundo lo entienda."}],challenges:[{type:"classify",title:"Ataque ↔ defensa",prompt:"Empareja cada técnica del adversario con el control defensivo que mejor la frena.",categories:[{id:"mfa",label:"MFA"},{id:"patch",label:"Parches al día"},{id:"aware",label:"Concienciación"},{id:"backup",label:"Copias de seguridad"}],items:[{text:"Robo de contraseñas mediante una web falsa",cat:"mfa",explain:"Con MFA, la contraseña robada no basta."},{text:"Aprovechar una vulnerabilidad conocida de un servidor",cat:"patch",explain:"Si está parcheado, la vulnerabilidad ya no existe."},{text:"Correo que suplanta al director pidiendo una transferencia urgente",cat:"aware",explain:"La formación enseña a verificar por otro canal."},{text:"Cifrado de los datos de la empresa para pedir un rescate",cat:"backup",explain:"Con copias desconectadas se recupera sin pagar."}]},{type:"classify",title:"Tácticas de ATT&CK",prompt:"¿A qué táctica (el «para qué») corresponde cada acción del adversario?",categories:[{id:"init",label:"Acceso inicial"},{id:"pers",label:"Persistencia"},{id:"priv",label:"Escalada de privilegios"},{id:"exfil",label:"Exfiltración"}],items:[{text:"Entrar con un correo de phishing con un adjunto malicioso",cat:"init",explain:"Es la forma de entrar por primera vez."},{text:"Crear una tarea programada que se ejecuta en cada arranque",cat:"pers",explain:"Garantiza que el acceso sobreviva a un reinicio."},{text:"Pasar de un usuario normal a administrador",cat:"priv",explain:"Ganar más permisos de los que se tenían."},{text:"Enviar ficheros robados a un servidor externo",cat:"exfil",explain:"Sacar información de la organización."}]}],learned:["Qué es un ejercicio morado","Tácticas y técnicas de MITRE ATT&CK","Relacionar cada técnica con su control"],tip:"El éxito de un ejercicio morado se mide en detecciones nuevas, no en «cuántas veces entró Rojo»."},$u={"/home/analista/.ssh/id_ed25519":{content:`-----BEGIN OPENSSH PRIVATE KEY-----

 │└┬┘└┬┘└┬┘
 │ │  │  └ otros: solo leer
 │ │  └ grupo: solo leer
 │ └ dueño: leer y escribir
 └ fichero`},{title:"Números",text:"Cada permiso vale un número: r=4, w=2, x=1. Se suman por grupo: rw- = 6, r-- = 4, rwx = 7. Así, 600 = solo el dueño lee y escribe; 755 = el dueño todo, los demás leer y ejecutar.",code:"$ chmod 600 secreto.txt   # -rw-------"},{title:"Mínimo privilegio",text:"Cada usuario y cada programa debe tener únicamente los permisos imprescindibles. Una clave privada legible por todos o un script de root que cualquiera puede modificar son puertas abiertas."}],challenges:[{type:"terminal",title:"Revisión de permisos",prompt:"Revisa los permisos de tu clave SSH privada y corrígelos: solo tú debes poder leerla y escribirla.",scenario:{files:$u},objectives:[{id:"ls",text:"Lista con detalle la carpeta ~/.ssh",how:"ls -l ~/.ssh",check:$("ls",e=>e.path==="/home/analista/.ssh"&&e.flags.includes("l"))},{id:"perm",text:"¿Qué permisos (en números) tiene ahora la clave privada id_ed25519?",answer:["666"],placeholder:"NNN"},{id:"fix",text:"Déjala con permisos 600",how:"chmod 600 ~/.ssh/id_ed25519",check:Na("/home/analista/.ssh/id_ed25519","600")}],solution:["ls -l ~/.ssh","chmod 600 ~/.ssh/id_ed25519"],hints:["rw- vale 4+2 = 6. Mira los tres grupos de la clave privada.","Usa chmod con tres cifras: dueño, grupo y otros."]},{type:"quiz",title:"Comprueba lo aprendido",questions:[{q:"¿Qué significa -rwxr-x--- ?",options:["Dueño todo; grupo leer y ejecutar; otros nada","Todos pueden ejecutar","Solo root puede leerlo"],correct:0,explain:"rwx (7) para el dueño, r-x (5) para el grupo y --- (0) para el resto: 750."},{q:"Un script lo ejecuta root cada noche y tiene permisos 777. ¿Por qué es grave?",options:["No es grave, solo ocupa espacio","Cualquier usuario podría modificarlo y su contenido se ejecutaría como root","Porque se ejecuta muy despacio"],correct:1,explain:"Si cualquiera puede escribirlo, cualquiera puede decidir qué hará root esta noche."}]}],learned:["Leer permisos con ls -l","Notación octal: r=4, w=2, x=1","chmod y el principio de mínimo privilegio"],tip:{red:"Un fichero 777 ejecutado por root es un hallazgo de severidad alta en cualquier informe.",blue:"Revisa periódicamente los ficheros que cualquiera puede escribir: find / -perm -o+w -type f",purple:"Convierte cada permiso peligroso en una comprobación automática que se ejecute cada día."}},ck={id:"m2-config",module:"m2",teams:["red"],title:"Configuraciones que delatan",story:"El cliente te pasa (dentro del alcance) varios fragmentos de configuración de sus servidores para una revisión. Tu trabajo es detectar qué decisiones abren la puerta a un atacante que ya hubiera entrado con un usuario sin privilegios.",lesson:[{title:"Revisión de configuración",text:"Una parte importante de una auditoría no consiste en «atacar», sino en leer configuraciones con mirada crítica: ¿qué pasaría si un usuario cualquiera hiciera esto? Cada respuesta inquietante es un hallazgo."},{title:"sudo",text:"El fichero sudoers decide quién puede ejecutar qué como administrador. Conceder demasiado (o sin contraseña) convierte cualquier cuenta robada en una cuenta de administrador."}],challenges:[{type:"code",title:"Revisión de /etc/sudoers",prompt:"Selecciona la línea que supone el mayor riesgo.",lang:"sudoers",code:["Defaults   env_reset",'Defaults   secure_path="/usr/sbin:/usr/bin:/sbin:/bin"',"root       ALL=(ALL:ALL) ALL","%admin     ALL=(ALL) ALL","becario    ALL=(ALL) NOPASSWD: ALL","backup     ALL=(root) /usr/bin/rsync"],bad:[4],question:"¿Por qué es peligrosa?",options:[{text:"Cualquiera que consiga la sesión del becario es administrador al instante, sin necesidad de contraseña",correct:!0,explain:"Exacto: robar una cuenta poco vigilada da control total del sistema."},{text:"Porque el becario no puede usar sudo",correct:!1,explain:"Al contrario: puede hacerlo todo y sin contraseña."},{text:"Porque ralentiza el servidor",correct:!1,explain:"No es un problema de rendimiento, sino de privilegios."}]},{type:"classify",title:"Clasifica los hallazgos",prompt:"Asigna a cada configuración la severidad que le darías en el informe.",categories:[{id:"alta",label:"Alta"},{id:"media",label:"Media"},{id:"baja",label:"Baja"}],items:[{text:"Script que ejecuta root cada noche con permisos 777",cat:"alta",explain:"Cualquier usuario puede hacer que root ejecute lo que quiera."},{text:"Clave SSH privada con permisos 644 en el /home de un administrador",cat:"alta",explain:"Cualquier usuario local puede copiarla y suplantar al administrador."},{text:"El banner de SSH muestra la versión exacta del software",cat:"baja",explain:"Facilita el reconocimiento, pero por sí solo no da acceso."},{text:"Las contraseñas caducan cada 5 años",cat:"media",explain:"Mejor una política basada en contraseñas robustas + MFA y cambio si hay sospecha."}]}],learned:["Leer configuraciones con mentalidad de atacante","Riesgos de sudo mal configurado","Asignar severidad a un hallazgo"],tip:"Cada hallazgo de tu informe debe incluir la evidencia, el impacto y una recomendación concreta."},uk={id:"m2-bastionado",module:"m2",teams:["blue"],title:"Bastionado básico",story:"Una auditoría externa ha avisado de que el script de copias nocturnas tiene permisos peligrosos. Te toca corregirlo antes de que alguien lo aproveche.",lesson:[{title:"Buscar ficheros peligrosos",text:"find permite buscar por permisos. Con -perm 777 encuentras ficheros que cualquiera puede leer, escribir y ejecutar.",code:"$ find /opt -perm 777"},{title:"Corregir",text:"Un script que ejecuta root debe pertenecer a root y no ser escribible por nadie más: 700 o 755 según si otros necesitan leerlo."}],challenges:[{type:"terminal",title:"Cierra la puerta",prompt:"Localiza el script con permisos 777 dentro de /opt y déjalo con permisos 700. Tu usuario tiene sudo.",scenario:{files:$u},objectives:[{id:"find",text:"Busca en /opt los ficheros con permisos 777",how:"find /opt -perm 777",check:$("find",e=>e.base==="/opt"&&/-perm\s+-?777/.test(e.args))},{id:"cual",text:"¿Qué fichero has encontrado? (ruta completa)",answer:["/opt/copias/backup.sh"],placeholder:"/ruta/al/fichero"},{id:"fix",text:"Déjalo con permisos 700",how:"El dueño es root: sudo chmod 700 /opt/copias/backup.sh",check:Na("/opt/copias/backup.sh","700")}],solution:["find /opt -perm 777","sudo chmod 700 /opt/copias/backup.sh"],hints:["find /opt -perm 777","El fichero es de root: sin sudo, chmod dará «Operación no permitida»."]}],learned:["Buscar permisos peligrosos con find","Corregir con chmod y sudo","Por qué los scripts de root no deben ser escribibles"],tip:"Automatiza esta revisión: un cron que busque ficheros escribibles por todos y avise al SOC."},dk={id:"m2-control",module:"m2",teams:["purple"],title:"Del hallazgo al control",story:"Rojo informa: «un script de root es escribible por todos». Azul pregunta: «¿y cómo nos habríamos enterado?». Tu trabajo: corregirlo y proponer cómo detectarlo la próxima vez.",lesson:[{title:"El ciclo morado",text:"1) Rojo demuestra el hallazgo. 2) Azul comprueba si lo habría detectado. 3) Se corrige. 4) Se crea una detección para que, si vuelve a aparecer, salte una alerta."}],challenges:[{type:"terminal",title:"Corrige y comprueba",prompt:"Confirma el hallazgo de Rojo, corrígelo (permisos 700) y protege también tu clave SSH (600).",scenario:{files:$u},objectives:[{id:"find",text:"Confirma el hallazgo con find en /opt",how:"find /opt -perm 777",check:$("find",e=>e.base==="/opt")},{id:"fix",text:"backup.sh con permisos 700",how:"sudo chmod 700 /opt/copias/backup.sh",check:Na("/opt/copias/backup.sh","700")},{id:"key",text:"Tu clave privada con permisos 600",how:"chmod 600 ~/.ssh/id_ed25519",check:Na("/home/analista/.ssh/id_ed25519","600")}],solution:["find /opt -perm 777","sudo chmod 700 /opt/copias/backup.sh","chmod 600 ~/.ssh/id_ed25519"],hints:["Recuerda: rw------- es 600 y rwx------ es 700."]},{type:"quiz",title:"¿Cómo lo detectamos?",questions:[{q:"¿Qué detección encaja mejor con este hallazgo?",options:["Alerta si un fichero ejecutado por root cambia de contenido o de permisos (monitorizac
