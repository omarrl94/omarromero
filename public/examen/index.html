<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Examen · FP José Ramón Otero</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="topbar"></div>
<header class="appbar"><div class="appbar-in" id="head"></div></header>
<div class="wrap">
  <p class="loading" id="loading">Cargando…</p>

  <section id="intro" hidden>
    <a href="/panel/" class="back" data-volver>← Volver al módulo</a>
    <h1 id="titulo"></h1>
    <p class="sub" id="subtitulo"></p>
    <div class="card">
      <div class="meta" id="chips"></div>
      <div class="note" style="margin-top:16px">Al entregar verás tu nota y <b>recibirás automáticamente un correo</b> en <b id="miEmail"></b> con tus respuestas y la corrección. <span id="txtHerr"></span> <span id="txtIntentos">Solo se puede entregar <b>una vez</b>.</span> Las preguntas abiertas se corrigen de forma automática por conceptos clave: es una estimación que revisa el profesor.</div>
      <div class="examwarn" id="avisoModo"></div>
      <div class="msg bad" id="introErr" hidden></div>
      <div class="actions"><button class="btn" id="start">Comenzar el examen</button></div>
    </div>
  </section>

  <form id="quiz" hidden novalidate></form>
  <section id="result" hidden></section>
  <section id="locked" hidden></section>
</div>

<script src="/assets/app.js"></script>
<script src="/assets/herramientas.js"></script>
<script>
const params = new URLSearchParams(location.search);
const examId = params.get("id") || "";
const urlModulo = (ex) => ex.trabajo ? `/trabajo/?id=${encodeURIComponent(ex.trabajo)}` : ex.cicloId ? `/panel/?ciclo=${encodeURIComponent(ex.cicloId)}&modulo=${encodeURIComponent(ex.moduloId)}` : "/panel/";
let EX = null, YO = null, PAYLOAD = null;

/* ── Modo examen ──
 * Modo seguro (lo activa el profesor): si el alumno cambia de pestaña, minimiza o
 * sale de la ventana, el examen se entrega solo con lo que haya respondido.
 * Sin modo seguro: el examen sigue abierto, pero la salida queda registrada.
 */
let examOn = false;
function startExam() { examOn = true; document.body.classList.add("exam"); iniciarHerramientas(EX, YO?.email); }
function stopExam() { examOn = false; document.body.classList.remove("exam"); }
const marcado = (name) => { const s = $(`input[name="${name}"]:checked`); return s ? +s.value : -1; };
const respuestasActuales = () => ({
  id: examId,
  mc: EX.mc.map((_, i) => marcado(`mc${i}`)),
  conf: EX.mc.map((_, i) => (EX.confianza ? marcado(`conf${i}`) : -1)),
  open: EX.open.map((_, i) => $(`#op${i}`).value),
  num: EX.num.map((q, i) => q.campos.map((c, j) => (c.tipo === "opcion" ? Number($(`#nm${i}_${j}`).value) : $(`#nm${i}_${j}`).value))),
});
function avisarSalida(motivo) {
  fetch("/api/examen/incidencia", { method: "POST", keepalive: true, credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: examId, motivo }) }).catch(() => {});
}
function lockTest(motivo) {
  if (!examOn) return;
  if (!EX.seguridad) { avisarSalida(motivo); return; } // examen libre: solo se registra
  stopExam(); cerrarHerramientas();
  PAYLOAD = { ...respuestasActuales(), salida: motivo };
  $("#intro").hidden = true; $("#quiz").hidden = true;
  const l = $("#locked"); l.hidden = false;
  l.innerHTML = `<div class="card" style="border-left:6px solid var(--bad)">
    <h1 style="color:var(--bad)">Examen finalizado</h1>
    <p class="sub">${esc(motivo)}. Este examen está en <b>modo seguro</b>, así que se ha entregado automáticamente con las respuestas que tenías.</p>
    <p class="muted" id="estadoFin">Entregando…</p></div>`;
  window.scrollTo({ top: 0 });
  // keepalive: la entrega sale aunque el alumno cierre la pestaña (límite ~64 KB).
  const cuerpo = JSON.stringify(PAYLOAD);
  fetch("/api/examen/entregar", { method: "POST", keepalive: cuerpo.length < 60000, credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: cuerpo })
    .then(async (r) => ({ r, d: await r.json().catch(() => ({})) }))
    .then(({ r, d }) => {
      if (r.ok) { l.hidden = true; mostrarResultado(d, `<div class="msg bad"><b>Examen finalizado automáticamente</b> al salir de la ventana: ${esc(motivo)}.</div>`); return; }
      if (r.status === 409) { location.replace(`?id=${encodeURIComponent(examId)}&ver=1`); return; }
      $("#estadoFin").textContent = `No se ha podido entregar (${d.error || r.status}). Avisa a tu profesor.`;
    })
    .catch(() => { $("#estadoFin").textContent = "No se ha podido entregar por un problema de conexión. Avisa a tu profesor."; });
}
document.addEventListener("visibilitychange", () => { if (examOn && document.hidden) lockTest("Has cambiado de pestaña o minimizado la ventana"); });
window.addEventListener("blur", () => { if (examOn) lockTest("Has salido de la ventana del examen"); });
window.addEventListener("beforeunload", (e) => { if (examOn) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("contextmenu", (e) => { if (examOn) e.preventDefault(); });
["copy", "cut", "selectstart"].forEach((ev) => document.addEventListener(ev, (e) => { if (examOn && !/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); }));
document.addEventListener("keydown", (e) => {
  if (!examOn) return;
  const k = (e.key || "").toLowerCase();
  if (e.key === "PrintScreen") { try { navigator.clipboard && navigator.clipboard.writeText(""); } catch (_) {} }
  if (e.key === "F12" || (e.ctrlKey && e.shiftKey && ["i", "j", "c", "s"].includes(k)) || (e.ctrlKey && ["p", "u", "s"].includes(k))) e.preventDefault();
});

/* ── Carga ── */
async function init() {
  YO = await cabecera();
  if (params.get("ver")) return verEntrega();
  try { EX = await api(`/api/examen?id=${encodeURIComponent(examId)}`); }
  catch (e) {
    if (e.status === 409) { history.replaceState(null, "", `?id=${encodeURIComponent(examId)}&ver=1`); return verEntrega(); }
    throw e;
  }
  document.title = `${EX.titulo} · FP José Ramón Otero`;
  if (EX.ciclo) $(".tag").textContent = EX.ciclo;
  $("#titulo").textContent = EX.titulo; $("#subtitulo").textContent = EX.subtitulo || EX.modulo || "";
  $("#miEmail").textContent = YO.email;
  $("#txtIntentos").innerHTML = textoIntentos(EX.intentosAlumno, EX.calificacion);
  if (EX.bloqueado) {
    $("#start").disabled = true; $("#start").textContent = "Esperando al profesor";
    $("#avisoModo").insertAdjacentHTML("beforebegin", `<div class="msg bad">🔒 Ya empezaste este examen en modo seguro${EX.enCurso?.n ? ` (llevabas ${EX.enCurso.n} respondidas, están guardadas)` : ""}. Si se te cerró por error, <b>pide a tu profesor que te deje reanudarlo</b> y vuelve a cargar esta página.</div>`);
  } else if (EX.enCurso || EX.reanudar) {
    $("#start").textContent = EX.enCurso ? "Continuar el examen" : "Reanudar el examen";
    $("#avisoModo").insertAdjacentHTML("beforebegin", `<div class="msg ok">↺ ${EX.reanudar ? "Tu profesor te ha permitido <b>reanudar</b> este examen. " : ""}${EX.enCurso ? `Tienes respuestas guardadas${EX.enCurso.n != null ? ` (${EX.enCurso.n} respondidas)` : ""}: al continuar, seguirás donde lo dejaste.` : ""}</div>`);
  }
  const herr = [EX.herramientas?.calculadora !== false && "una calculadora científica", EX.herramientas?.notas !== false && "un bloc de notas"].filter(Boolean);
  $("#txtHerr").innerHTML = herr.length ? ` Durante el examen tendrás <b>a la derecha</b> ${herr.join(" y ")}; usarlos no cuenta como salir de la página.` : "";
  $("#avisoModo").innerHTML = EX.seguridad
    ? `<b>🔒 Modo seguro:</b> si cambias de pestaña, minimizas, abres otra aplicación o sales de la ventana, <b>el examen se entregará automáticamente</b> con lo que lleves respondido${EX.intentosAlumno?.quedan === 1 ? " y no podrás repetirlo" : " y contará como un intento"}. Ten preparado todo antes de empezar.`
    : `<b>Modo examen:</b> no salgas de esta página hasta entregar. Si cambias de pestaña o de ventana, quedará registrado para el profesor.`;
  $$("[data-volver]").forEach((a) => (a.href = urlModulo(EX)));
  $("#chips").innerHTML = [EX.modulo && `<span class="chip gray">${esc(EX.modulo)}</span>`,
    EX.mc.length && `<span class="chip">${EX.mc.length} preguntas tipo test${EX.confianza ? " con confianza" : ""}</span>`,
    EX.open.length && `<span class="chip v">${EX.open.length} preguntas abiertas</span>`,
    EX.num.length && `<span class="chip s">${EX.num.length} apartados de ejercicios</span>`,
    EX.herramientas?.calculadora !== false && `<span class="chip gray">🧮 Calculadora científica</span>`,
    EX.herramientas?.notas !== false && `<span class="chip gray">📝 Bloc de notas</span>`,
    `<span class="chip s">Nota automática /10</span>`].filter(Boolean).join("");
  buildQuiz();
  $("#loading").hidden = true; $("#intro").hidden = false;
}

/** «Tienes 3 intentos (te quedan 2); cuenta la mejor nota.» */
function textoIntentos(ia, calif) {
  if (!ia) return "";
  const cuenta = calif === "ultima" ? "cuenta la nota del <b>último</b>" : "cuenta la <b>mejor</b> nota";
  if (ia.permitidos === 1) return "Solo se puede entregar <b>una vez</b>.";
  if (ia.permitidos == null) return `Puedes hacerlo <b>las veces que quieras</b>; ${cuenta}.`;
  return ia.quedan === 1 && ia.hechos ? `Es tu <b>último intento</b> (de ${ia.permitidos}); ${cuenta}.`
    : `Tienes <b>${ia.quedan} ${ia.quedan === 1 ? "intento" : "intentos"}</b>${ia.hechos ? ` más (de ${ia.permitidos})` : ""}; ${cuenta}.`;
}

/** Aviso con los intentos hechos y, si quedan, el botón para repetir. */
function avisoIntentos(d) {
  const lista = d.intentos || [];
  const quedan = d.quedan === null ? "sin límite" : d.quedan;
  if (lista.length <= 1 && !d.quedan && d.quedan !== null) return "";
  const vig = lista.find((x) => x.vigente);
  const cuenta = d.calificacion === "ultima" ? "el último" : "el de mejor nota";
  const filas = lista.length > 1 ? `<div class="meta" style="margin-top:8px">${lista.map((x) => `<span class="chip ${x.vigente ? "ok" : "gray"}" title="${esc(x.fechaTexto || "")}">Intento ${x.n}: ${fmt(x.nota)}${x.vigente ? " · cuenta" : ""}</span>`).join("")}</div>` : "";
  const txt = lista.length > 1
    ? `Llevas <b>${lista.length} intentos</b>. Para la nota cuenta ${cuenta}${vig ? ` (intento ${vig.n}: <b>${fmt(vig.nota)}</b>)` : ""}.`
    : `Has hecho <b>1 intento</b>.`;
  const rep = d.quedan === null || d.quedan > 0
    ? `<div class="actions" style="margin-top:10px"><a class="btn" href="?id=${encodeURIComponent(examId)}">Volver a intentarlo</a><span class="muted" style="font-size:13.5px">Te ${d.quedan === 1 ? "queda 1 intento" : `quedan ${quedan === "sin límite" ? "intentos sin límite" : quedan + " intentos"}`}</span></div>` : "";
  return `<div class="note" style="margin:14px 0">${txt}${filas}${rep}</div>`;
}

async function verEntrega() {
  const d = await api(`/api/entrega?id=${encodeURIComponent(examId)}`);
  document.title = `${d.examen.titulo} · Resultado`;
  if (d.examen.ciclo) $(".tag").textContent = d.examen.ciclo;
  $("#loading").hidden = true;
  const r = $("#result"); r.hidden = false;
  r.insertAdjacentHTML("beforebegin", `<a href="${urlModulo(d.examen)}" class="back">← Volver a ${esc(d.examen.modulo || "mis exámenes")}</a><h1>${esc(d.examen.titulo)}</h1><p class="sub">${esc(d.examen.subtitulo || "")}</p>`);
  pintarEntrega(r, d, avisoIntentos(d));
}

function buildQuiz() {
  const f = $("#quiz"); const T = titulosPartes(EX); const cab = cabeceraBloques(EX);
  let h = `<div class="progress"><span id="progTxt"></span><div class="track"><div class="fill" id="progFill"></div></div><span class="muted" id="guardadoTxt" style="font-size:12.5px;white-space:nowrap" title="Tus respuestas se guardan solas mientras haces el examen"></span></div>`;
  const sec = (letra, titulo, color) => `<div class="sec"><span class="n" style="background:var(--${color}-soft);color:var(--${color}-ink)">Parte ${letra}</span><h2>${esc(titulo)}</h2></div>`;
  let parte = 0, n = 0;
  if (EX.mc.length) {
    h += sec("ABC"[parte++], T.mc, "amarillo");
    h += `<p class="hintline" style="margin-top:-4px">Para quitar una respuesta marcada, vuelve a pulsarla.</p>`;
    if (EX.confianza) h += `<div class="note" style="margin:6px 0 12px">Marca la respuesta y <b>tu nivel de confianza</b>. Si aciertas sumas, si fallas restas; sin nivel de confianza la pregunta cuenta como en blanco. La nota de esta parte no baja de 0.
      <table class="tabla-conf"><tr><th>Confianza</th><th>Si aciertas</th><th>Si fallas</th></tr>${EX.confianzaTabla.map((c) =>
        `<tr><td>${esc(c.nombre)}</td><td>+${Math.round(c.acierto * 100)} %</td><td>${Math.round(c.fallo * 100)} %</td></tr>`).join("")}</table></div>`;
    EX.mc.forEach((q, i) => {
      const opts = q.o.map((o, j) => `<label class="opt"><input type="radio" name="mc${i}" value="${j}"><span><b>${LETRAS[j]})</b> ${esc(o)}</span></label>`).join("");
      const conf = EX.confianza ? `<div class="conf">Confianza: ${EX.confianzaTabla.map((c, k) => `<label><input type="radio" name="conf${i}" value="${k}"> ${esc(c.nombre)}</label>`).join("")}</div>` : "";
      h += cab(q) + `<div class="q"><p class="qh"><span class="qi">${++n}.</span><span>${esc(q.t)} ${fmtP(q.puntos)}</span></p>${opts}${conf}</div>`;
    });
  }
  if (EX.open.length) {
    h += sec("ABC"[parte++], T.open, "salmon");
    let last = "";
    EX.open.forEach((q, i) => {
      h += cab(q);
      if (q.act && q.act !== last) h += `<p class="hintline" style="font-weight:700;color:var(--salmon-ink);margin-bottom:-4px">${esc(q.act)}</p>`;
      last = q.act;
      h += `<div class="q"><p class="qh"><span class="qi">${++n}.</span><span>${esc(q.t)} ${fmtP(q.puntos)}</span></p><textarea id="op${i}" maxlength="4000" placeholder="Escribe tu respuesta…"></textarea></div>`;
    });
  }
  if (EX.num.length) {
    h += sec("ABC"[parte++], T.num, "verde");
    h += `<p class="hintline">Escribe solo el resultado final de cada apartado (por ejemplo <b>2,5</b> o <b>1,87·10^21</b>). Puedes usar coma o punto decimal; la unidad ya está indicada.</p>`;
    EX.num.forEach((q, i) => {
      const campos = q.campos.map((c, j) => c.tipo === "opcion"
        ? `<div class="campo"><label for="nm${i}_${j}">${esc(c.etiqueta)}</label><select id="nm${i}_${j}" style="flex:0 1 260px;width:auto"><option value="-1">Elige…</option>${c.opciones.map((o, k) => `<option value="${k}">${esc(o)}</option>`).join("")}</select></div>`
        : `<div class="campo"><label for="nm${i}_${j}">${esc(c.etiqueta)}</label><input type="text" id="nm${i}_${j}" inputmode="decimal" autocomplete="off" maxlength="40"><span class="ud">${esc(c.unidad || "")}</span></div>`).join("");
      h += cab(q) + `<div class="q"><p class="qh"><span>${esc(q.t)} ${fmtP(q.puntos)}</span></p>${campos}</div>`;
    });
  }
  h += `<div class="msg bad" id="sendErr" hidden></div><div class="actions"><button type="submit" class="btn" id="submit">Entregar examen</button><button type="button" class="btn ghost" id="toTop">Volver arriba</button></div>`;
  f.innerHTML = h;
  f.addEventListener("input", progreso);
  f.addEventListener("change", progreso);
  // Las opciones (y la confianza) se pueden desmarcar pulsando otra vez la marcada.
  f.addEventListener("click", (e) => {
    const r = e.target;
    if (!(r instanceof HTMLInputElement) || r.type !== "radio") return;
    if (MARCADAS[r.name] === r.value) { r.checked = false; delete MARCADAS[r.name]; progreso(); cambiado(); }
    else MARCADAS[r.name] = r.value;
  });
  f.addEventListener("input", cambiado);
  f.addEventListener("change", cambiado);
  progreso();
}
const MARCADAS = {};

/** Rellena el examen con respuestas guardadas (al reanudarlo). */
function ponerRespuestas(r) {
  const radio = (name, v) => { const x = $(`input[name="${name}"][value="${v}"]`); if (x) { x.checked = true; MARCADAS[name] = String(v); } };
  (r.mc || []).forEach((v, i) => v >= 0 && radio(`mc${i}`, v));
  (r.conf || []).forEach((v, i) => v >= 0 && radio(`conf${i}`, v));
  (r.open || []).forEach((t, i) => { const x = $(`#op${i}`); if (x && t) x.value = t; });
  (r.num || []).forEach((cs, i) => (cs || []).forEach((v, j) => { const x = $(`#nm${i}_${j}`); if (x && v !== "" && v !== null) x.value = String(v); }));
  progreso();
}

/* ── Guardado automático: si algo falla (se cierra el navegador, se va la luz…),
 *    el profesor puede dejar al alumno reanudar el examen donde lo dejó. ── */
let SUCIO = false, guardando = false, temporizador = null;
function cambiado() {
  if (!examOn) return;
  SUCIO = true;
  clearTimeout(temporizador); temporizador = setTimeout(guardarBorrador, 2000);
}
async function guardarBorrador() {
  if (!examOn || !SUCIO || guardando) return;
  guardando = true; SUCIO = false;
  try {
    const r = await fetch("/api/examen/guardar", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...respuestasActuales(), intento: (EX.intentosAlumno?.hechos || 0) + 1 }) });
    const d = await r.json().catch(() => ({}));
    const t = $("#guardadoTxt");
    if (t) t.textContent = r.ok && d.ok ? `Guardado ${new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" })}` : "Sin guardar";
    if (!r.ok) SUCIO = true;
  } catch { SUCIO = true; }
  finally { guardando = false; }
}
setInterval(() => { if (SUCIO) guardarBorrador(); }, 20000);

/** Respondida = test con respuesta (y confianza si se pide), abierta con texto, ejercicio con todos sus resultados. */
function respondidas() {
  const r = respuestasActuales();
  return r.mc.filter((v, i) => v >= 0 && (!EX.confianza || r.conf[i] >= 0)).length
    + r.open.filter((t) => t.trim()).length
    + r.num.filter((campos) => campos.every((v) => (typeof v === "number" ? v >= 0 : String(v).trim()))).length;
}
function progreso() {
  if (!EX) return;
  const n = respondidas(), t = EX.mc.length + EX.open.length + EX.num.length;
  $("#progTxt").textContent = `${n} de ${t} respondidas`;
  $("#progFill").style.width = `${(100 * n) / t}%`;
}

$("#start").onclick = async () => {
  const b = $("#start"); b.disabled = true; $("#introErr").hidden = true;
  let r;
  try { r = await api("/api/examen/iniciar", { id: examId }); }
  catch (e) { $("#introErr").textContent = e.message; $("#introErr").hidden = false; b.disabled = false; return; }
  b.disabled = false;
  $("#intro").hidden = true; $("#quiz").hidden = false; startExam(); window.scrollTo({ top: 0 });
  if (r.respuestas) {
    ponerRespuestas(r.respuestas);
    $("#quiz").insertAdjacentHTML("afterbegin", `<div class="msg ok" id="avisoReanudar">↺ ${r.reanudado ? "Tu profesor te ha dejado reanudar el examen. " : ""}Se han recuperado las respuestas que tenías guardadas: sigue donde lo dejaste.</div>`);
  }
};

/* ── Entrega: corrige el servidor y envía el correo ── */
function mostrarResultado(d, extra = "") {
  cerrarHerramientas(); // las notas se borran al entregar
  history.replaceState(null, "", `?id=${encodeURIComponent(examId)}&ver=1`);
  $("#quiz").hidden = true; $("#intro").hidden = true;
  const r = $("#result"); r.hidden = false;
  const banner = d.correo.enviado
    ? `<div class="msg ok">✉ Te hemos enviado la corrección a <b>${esc(d.correo.destino)}</b>. Si no la ves en unos minutos, revisa «Correo no deseado».</div>`
    : `<div class="msg bad">✉ ${esc(d.correo.error || "No se ha podido enviar el correo.")} Tu entrega está guardada y puedes consultarla en tu panel.</div>`;
  r.insertAdjacentHTML("beforebegin", `<a href="${urlModulo(EX)}" class="back">← Volver a ${esc(EX.modulo)}</a><h1>${esc(EX.titulo)}</h1><p class="sub">Examen entregado.</p>`);
  pintarEntrega(r, d, extra + banner + avisoIntentos(d));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function entregar() {
  const btn = $("#submit"), err = $("#sendErr");
  const total = EX.mc.length + EX.open.length + EX.num.length, faltan = total - respondidas();
  if (faltan && btn.dataset.confirm !== "1") {
    err.hidden = false; err.textContent = `Te ${faltan === 1 ? "falta 1 pregunta" : `faltan ${faltan} preguntas`} por contestar (o sin nivel de confianza). Pulsa otra vez «Entregar» si quieres entregar igualmente. ${EX.intentosAlumno?.quedan === 1 ? "Recuerda que es tu último intento." : ""}`;
    btn.dataset.confirm = "1"; btn.textContent = "Entregar igualmente"; return;
  }
  PAYLOAD = respuestasActuales();
  btn.disabled = true; btn.textContent = "Entregando…"; err.hidden = true;
  stopExam(); // mientras se entrega, salir de la ventana ya no cuenta
  try {
    mostrarResultado(await api("/api/examen/entregar", PAYLOAD));
  } catch (e) {
    startExam();
    if (e.status === 409) { stopExam(); location.replace(`?id=${encodeURIComponent(examId)}&ver=1`); return; }
    err.hidden = false; err.textContent = `No se ha podido entregar: ${e.message}. Tus respuestas siguen aquí; comprueba la conexión y vuelve a pulsar «Entregar».`;
    btn.disabled = false; btn.textContent = "Entregar examen";
  }
}
$("#quiz").addEventListener("submit", (e) => { e.preventDefault(); entregar(); });
$("#quiz").addEventListener("click", (e) => { if (e.target && e.target.id === "toTop") window.scrollTo({ top: 0, behavior: "smooth" }); });

init().catch((e) => { $("#loading").innerHTML = `<div class="msg bad">${esc(e.message)}</div><a class="btn ghost" href="/panel/">Volver a mis exámenes</a>`; });
</script>
</body>
</html>
