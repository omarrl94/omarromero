<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Trabajo · FP José Ramón Otero</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="topbar"></div>
<header class="appbar"><div class="appbar-in" id="head"></div></header>
<div class="wrap">
  <nav class="crumbs" id="crumbs" aria-label="Ruta"></nav>
  <h1 id="titulo">Trabajo</h1>
  <p class="sub" id="sub"></p>
  <div id="vista"><p class="loading">Cargando…</p></div>
</div>
<script src="/assets/app.js"></script>
<script src="/assets/extraer.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const MAX = 4 * 1024 * 1024;
const kb = (n) => (n >= 1048576 ? `${(n / 1048576).toLocaleString("es-ES", { maximumFractionDigits: 1 })} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);
const fechaLarga = (iso) => new Date(iso).toLocaleString("es-ES", { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
const nota = (n) => (n == null ? "—" : Number(n).toLocaleString("es-ES", { maximumFractionDigits: 2 }));
const ESTADO = {
  pendiente: ["chip", "Pendiente de entregar"], devuelto: ["chip s", "Devuelto para corregir"], entregado: ["chip v", "Entregado · pendiente de revisión"],
  defensa: ["chip s", "Pendiente de la defensa"], calificado: ["chip ok", "Calificado"],
  modificando: ["chip s", "Modificando la entrega · vuelve a entregarla"],
};
let D = null, YO = null;

const base64 = (file) => new Promise((ok, ko) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(",")[1] || "");
  r.onerror = () => ko(new Error("No se ha podido leer el archivo"));
  r.readAsDataURL(file);
});

async function cargar() {
  D = await api(`/api/trabajo?id=${encodeURIComponent(id)}`);
  pintar();
}

function pintar() {
  const t = D.trabajo, e = D.entrega;
  document.title = `${t.titulo} · FP José Ramón Otero`;
  $("#crumbs").innerHTML = `<a href="/panel/?ciclo=${encodeURIComponent(t.cicloId)}&modulo=${encodeURIComponent(t.moduloId)}">${esc(t.modulo)}</a> › <b>Trabajo</b>`;
  $("#titulo").textContent = t.titulo;
  const fuera = t.fechaLimite && Date.now() > Date.parse(t.fechaLimite);
  $("#sub").innerHTML = t.fechaLimite ? `Fecha límite: <b>${esc(fechaLarga(t.fechaLimite))}</b>${fuera ? (t.admiteTarde ? " · <span class='chip s'>Fuera de plazo (se admite con retraso)</span>" : " · <span class='chip bad'>Plazo cerrado</span>") : ""}` : "Sin fecha límite";
  const editable = ["pendiente", "devuelto", "modificando"].includes(e.estado) && !(fuera && !t.admiteTarde) && !YO.staff;
  const [cls, txt] = ESTADO[e.estado] || ESTADO.pendiente;
  const def = e.defensa;
  $("#vista").innerHTML = `
    <div class="card trab-enun">
      <div class="meta" style="margin:0 0 10px"><span class="${cls}">${txt}</span>${e.tarde ? `<span class="chip s">Entregado con retraso</span>` : ""}</div>
      ${t.descripcion ? `<div class="trab-desc">${esc(t.descripcion)}</div>` : t.adjuntos?.length ? "" : `<p class="muted" style="margin:0">El profesor no ha añadido instrucciones.</p>`}
      ${t.adjuntos?.length ? `<div class="trab-adj"><b>📂 Archivos del profesor</b><ul class="trab-arch">${t.adjuntos.map((a) => `<li><a href="/api/trabajo/adjunto?t=${encodeURIComponent(t.id)}&f=${encodeURIComponent(a.id)}">📎 ${esc(a.nombre)}</a><span class="muted">${kb(a.tamano)}</span></li>`).join("")}</ul></div>` : ""}
      <p class="hintline" style="margin-bottom:0">La nota final combina la del <b>trabajo (${t.pesoTrabajo}%)</b> y la de una <b>defensa (${100 - t.pesoTrabajo}%)</b>: unas preguntas personalizadas sobre lo que has entregado, para comprobar que lo has hecho tú. El profesor las prepara con ayuda de la IA a partir del texto de tus archivos, sin tu nombre (<a href="/privacidad/#ia" target="_blank">más información</a>); la nota la pone siempre el profesor.${t.defensaObligatoria ? " <b>Hay que aprobar la defensa</b> (5 o más) para aprobar el trabajo." : ""}</p>
    </div>
    ${e.notaFinal != null ? `<div class="card trab-nota"><div><div class="muted">Nota final</div><div class="nota">${nota(e.notaFinal)}<small> /10</small></div></div>
      <div class="trab-desg">${def?.nota != null ? `<span>Defensa: <b>${nota(def.nota)}</b></span>` : ""}${e.notaTrabajo != null ? `<span>Trabajo: <b>${nota(e.notaTrabajo)}</b></span>` : ""}${e.suspensoPorDefensa ? `<span class="chip bad">Suspenso: la defensa no está aprobada</span>` : ""}</div></div>` : ""}
    ${e.comentarioProfesor ? `<div class="msg info"><b>Comentario del profesor:</b> ${esc(e.comentarioProfesor)}</div>` : ""}
    ${def ? `<div class="card trab-def"><div><h3 style="margin:0 0 4px">🎤 Defensa del trabajo</h3>
        <p class="muted" style="margin:0">${def.hecha ? "Ya has hecho la defensa." : def.reanudar ? "Tu profesor te deja seguir la defensa donde la dejaste, con tus respuestas." : "Tu profesor ha preparado unas preguntas sobre tu trabajo, con ayuda de la IA (que no recibe tu nombre ni tus datos) y revisadas por él. Tienes un solo intento y no puedes salir de la pantalla mientras la haces."}</p></div>
        ${def.hecha ? `<a class="btn ghost" href="/examen/?id=${encodeURIComponent(def.examen)}&ver=1">Ver mi defensa</a>` : `<a class="btn" href="/examen/?id=${encodeURIComponent(def.examen)}">${def.reanudar || def.empezada ? "Continuar la defensa" : "Hacer la defensa"}</a>`}</div>` : ""}
    <h2 style="margin:26px 0 10px">Archivos</h2>
    <ul class="trab-arch" id="archivos">${e.archivos.length ? e.archivos.map((a) => `<li>
        <a href="/api/trabajo/descargar?t=${encodeURIComponent(t.id)}&e=${encodeURIComponent(YO.email)}&f=${encodeURIComponent(a.id)}">📎 ${esc(a.nombre)}</a>
        <span class="muted">${kb(a.tamano)}</span>${editable ? `<button class="btn ghost sm" data-borrar="${esc(a.id)}">Quitar</button>` : ""}</li>`).join("") : `<li class="muted">Todavía no has subido ningún archivo.</li>`}</ul>
    ${editable ? `
      <label class="drop" id="drop"><input type="file" id="archivo" multiple hidden>
        <span id="dropTxt">Arrastra aquí tus archivos o haz clic para elegirlos<br><small>PDF, Word, PowerPoint, Excel, imágenes, código o ZIP · máx. 4 MB cada uno · hasta 6 archivos</small></span></label>
      <p class="hintline">La memoria, mejor en <b>PDF o Word</b>. Si es un programa, sube también el <b>proyecto en ZIP</b> (se quitan solos <code>node_modules</code>, <code>.git</code>, <code>target</code>, <code>build</code>…): el profesor lo abre aquí y la defensa también pregunta por tu código.</p>
      <div class="field" style="margin-top:14px"><label class="flab" for="comentario">Comentario para el profesor (opcional)</label><textarea id="comentario" style="min-height:70px">${esc(e.comentario || "")}</textarea></div>
      <div class="msg bad" id="err" hidden></div>
      ${e.estado === "modificando" ? `<div class="msg info">Estás modificando tu entrega: cambia lo que necesites y pulsa «Volver a entregar» <b>antes de la fecha límite</b>. Mientras tanto, el profesor no puede corregirla.</div>` : ""}
      <div class="actions"><button class="btn" id="entregar" ${e.archivos.length ? "" : "disabled"}>${e.estado === "devuelto" || e.estado === "modificando" ? "Volver a entregar" : "Entregar trabajo"}</button></div>`
    : e.fecha ? `<p class="muted">Entregado el ${esc(new Date(e.fecha).toLocaleString("es-ES", { day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }))}.${e.comentario ? ` Tu comentario: «${esc(e.comentario)}»` : ""}</p>
      ${e.puedeModificar && !YO.staff ? `<div class="actions" style="justify-content:flex-start"><button class="btn ghost" id="modificar">✏️ Modificar la entrega</button></div>
        <p class="hintline">Puedes cambiar los archivos o el comentario hasta la fecha límite, mientras el profesor no haya empezado a corregirlo. Después tendrás que volver a entregarlo.</p><div class="msg bad" id="errMod" hidden></div>` : ""}` : ""}`;
  const mod = $("#modificar");
  if (mod) mod.onclick = async () => {
    if (!confirm("¿Modificar la entrega? Tendrás que volver a entregarla antes de la fecha límite; mientras tanto, el profesor no podrá corregirla.")) return;
    try { await api("/api/trabajo/modificar", { id: t.id }); await cargar(); }
    catch (x) { $("#errMod").textContent = x.message; $("#errMod").hidden = false; }
  };
  if (!editable) return;
  const err = (m) => { $("#err").textContent = m; $("#err").hidden = !m; };
  const input = $("#archivo"), drop = $("#drop");
  input.onchange = () => subir([...input.files]);
  drop.ondragover = (ev) => { ev.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (ev) => { ev.preventDefault(); drop.classList.remove("over"); subir([...ev.dataTransfer.files]); };
  $$("[data-borrar]").forEach((b) => (b.onclick = async () => {
    try { const r = await api("/api/trabajo/archivo/borrar", { id: t.id, archivo: b.dataset.borrar }); D.entrega.archivos = r.archivos; pintar(); } catch (x) { err(x.message); }
  }));
  $("#entregar").onclick = async () => {
    if (!confirm("¿Entregar el trabajo? Después ya no podrás cambiar los archivos (salvo que el profesor te lo devuelva).")) return;
    const b = $("#entregar"); b.disabled = true; b.textContent = "Entregando…";
    try { await api("/api/trabajo/entregar", { id: t.id, comentario: $("#comentario").value }); await cargar(); }
    catch (x) { err(x.message); b.disabled = false; b.textContent = e.estado === "pendiente" ? "Entregar trabajo" : "Volver a entregar"; }
  };

  async function subir(files) {
    err("");
    const txt = $("#dropTxt"), fallos = [];
    const avisos = [];
    for (let f of files) {
      // Proyecto en ZIP: se quitan dependencias y compilados (node_modules, .git, target…).
      if (/\.zip$/i.test(f.name)) {
        txt.textContent = `Revisando el proyecto «${f.name}»…`;
        try { const limpio = await window.limpiarZip(f); if (limpio !== f) { avisos.push(`«${f.name}»: se han quitado ${limpio.quitados} archivos que no hacen falta (dependencias, compilados, .git…): ${kb(f.size)} → ${kb(limpio.size)}.`); f = limpio; } }
        catch { fallos.push(`«${f.name}» no es un ZIP válido.`); continue; }
      }
      if (f.size > MAX) { fallos.push(`«${f.name}» ocupa más de 4 MB${/\.zip$/i.test(f.name) ? " incluso sin dependencias ni compilados: quita imágenes o vídeos grandes del proyecto" : ". Comprímelo o divídelo en varios archivos"}.`); continue; }
      txt.textContent = `Subiendo «${f.name}»…`;
      try {
        const capt = window.CAPTURABLE.test(f.name);
        const [datos, ext] = await Promise.all([base64(f), capt ? window.extraerConCapturas(f) : window.extraerTexto(f).then((texto) => ({ texto, capturas: [] }))]);
        const r = await api("/api/trabajo/archivo", { id: t.id, nombre: f.name, tipo: f.type, datos, texto: ext.texto });
        D.entrega.archivos = r.archivos;
        // Capturas de pantalla (para que la IA las analice en la defensa): en lotes que quepan en una petición.
        if (capt) {
          const id = r.archivos.at(-1).id;
          if (ext.capturas.length) txt.textContent = `Subiendo las capturas de «${f.name}» (${ext.capturas.length})…`;
          await subirCapturas("/api/trabajo/capturas", { id: t.id, archivo: id }, ext.capturas);
          r.archivos.at(-1).capturas = ext.capturas.length;
        }
      } catch (x) { fallos.push(`«${f.name}»: ${x.message}`); }
    }
    const coment = $("#comentario").value;
    pintar();
    if ($("#comentario")) $("#comentario").value = coment;
    if (fallos.length && $("#err")) { $("#err").textContent = fallos.join(" · "); $("#err").hidden = false; }
    if (avisos.length && $("#err")) $("#err").insertAdjacentHTML("afterend", `<div class="msg info">${avisos.map(esc).join("<br>")}</div>`);
  }
}

(async () => {
  YO = await cabecera();
  YO.staff = ["profesor", "admin"].includes(YO.rol) || !!YO.admin;
  if (!id) { $("#vista").innerHTML = `<div class="msg bad">Falta el trabajo.</div>`; return; }
  await cargar();
})().catch((e) => { $("#vista").innerHTML = `<div class="msg bad">${esc(e.message)}</div>`; });
</script>
</body>
</html>
