<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Trabajo · FP José Ramón Otero</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="topbar"></div>
<header class="appbar"><div class="appbar-in" id="head"></div></header>
<div class="wrap">
  <nav class="crumbs" id="crumbs" aria-label="Ruta"></nav>
  <h1 id="titulo">Trabajo</h1>
  <p class="sub" id="sub"></p>
  <div id="vista"><p class="loading">Cargando…</p></div>
</div>
<script src="/assets/app.js"></script>
<script src="/assets/extraer.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const MAX = 4 * 1024 * 1024;
const kb = (n) => (n >= 1048576 ? `${(n / 1048576).toLocaleString("es-ES", { maximumFractionDigits: 1 })} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);
const fechaLarga = (iso) => new Date(iso).toLocaleString("es-ES", { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
const nota = (n) => (n == null ? "—" : Number(n).toLocaleString("es-ES", { maximumFractionDigits: 2 }));
const ESTADO = {
  pendiente: ["chip", "Pendiente de entregar"], devuelto: ["chip s", "Devuelto para corregir"], entregado: ["chip v", "Entregado · pendiente de revisión"],
  defensa: ["chip s", "Pendiente de la defensa"], calificado: ["chip ok", "Calificado"],
};
let D = null, YO = null;

const base64 = (file) => new Promise((ok, ko) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(",")[1] || "");
  r.onerror = () => ko(new Error("No se ha podido leer el archivo"));
  r.readAsDataURL(file);
});

async function cargar() {
  D = await api(`/api/trabajo?id=${encodeURIComponent(id)}`);
  pintar();
}

function pintar() {
  const t = D.trabajo, e = D.entrega;
  document.title = `${t.titulo} · FP José Ramón Otero`;
  $("#crumbs").innerHTML = `<a href="/panel/?ciclo=${encodeURIComponent(t.cicloId)}&modulo=${encodeURIComponent(t.moduloId)}">${esc(t.modulo)}</a> › <b>Trabajo</b>`;
  $("#titulo").textContent = t.titulo;
  const fuera = t.fechaLimite && Date.now() > Date.parse(t.fechaLimite);
  $("#sub").innerHTML = t.fechaLimite ? `Fecha límite: <b>${esc(fechaLarga(t.fechaLimite))}</b>${fuera ? (t.admiteTarde ? " · <span class='chip s'>Fuera de plazo (se admite con retraso)</span>" : " · <span class='chip bad'>Plazo cerrado</span>") : ""}` : "Sin fecha límite";
  const editable = (e.estado === "pendiente" || e.estado === "devuelto") && !(fuera && !t.admiteTarde) && !YO.staff;
  const [cls, txt] = ESTADO[e.estado] || ESTADO.pendiente;
  const def = e.defensa;
  $("#vista").innerHTML = `
    <div class="card trab-enun">
      <div class="meta" style="margin:0 0 10px"><span class="${cls}">${txt}</span>${e.tarde ? `<span class="chip s">Entregado con retraso</span>` : ""}</div>
      ${t.descripcion ? `<div class="trab-desc">${esc(t.descripcion)}</div>` : `<p class="muted" style="margin:0">El profesor no ha añadido instrucciones.</p>`}
      <p class="hintline" style="margin-bottom:0">La nota final combina la del <b>trabajo (${t.pesoTrabajo}%)</b> y la de una <b>defensa (${100 - t.pesoTrabajo}%)</b>: unas preguntas personalizadas sobre lo que has entregado, para comprobar que lo has hecho tú.</p>
    </div>
    ${e.notaFinal != null ? `<div class="card trab-nota"><div><div class="muted">Nota final</div><div class="nota">${nota(e.notaFinal)}<small> /10</small></div></div>
      <div class="trab-desg">${e.notaTrabajo != null ? `<span>Trabajo: <b>${nota(e.notaTrabajo)}</b></span>` : ""}${def?.nota != null ? `<span>Defensa: <b>${nota(def.nota)}</b></span>` : ""}</div></div>` : ""}
    ${e.comentarioProfesor ? `<div class="msg info"><b>Comentario del profesor:</b> ${esc(e.comentarioProfesor)}</div>` : ""}
    ${def ? `<div class="card trab-def"><div><h3 style="margin:0 0 4px">🎤 Defensa del trabajo</h3>
        <p class="muted" style="margin:0">${def.hecha ? "Ya has hecho la defensa." : "Tu profesor ha preparado unas preguntas sobre tu trabajo. Tienes un solo intento y no puedes salir de la pantalla mientras la haces."}</p></div>
        ${def.hecha ? `<a class="btn ghost" href="/examen/?id=${encodeURIComponent(def.examen)}&ver=1">Ver mi defensa</a>` : `<a class="btn" href="/examen/?id=${encodeURIComponent(def.examen)}">Hacer la defensa</a>`}</div>` : ""}
    <h2 style="margin:26px 0 10px">Archivos</h2>
    <ul class="trab-arch" id="archivos">${e.archivos.length ? e.archivos.map((a) => `<li>
        <a href="/api/trabajo/descargar?t=${encodeURIComponent(t.id)}&e=${encodeURIComponent(YO.email)}&f=${encodeURIComponent(a.id)}">📎 ${esc(a.nombre)}</a>
        <span class="muted">${kb(a.tamano)}</span>${editable ? `<button class="btn ghost sm" data-borrar="${esc(a.id)}">Quitar</button>` : ""}</li>`).join("") : `<li class="muted">Todavía no has subido ningún archivo.</li>`}</ul>
    ${editable ? `
      <label class="drop" id="drop"><input type="file" id="archivo" multiple hidden>
        <span id="dropTxt">Arrastra aquí tus archivos o haz clic para elegirlos<br><small>PDF, Word, PowerPoint, Excel, imágenes, código o ZIP · máx. 4 MB cada uno · hasta 6 archivos</small></span></label>
      <p class="hintline">Mejor en <b>PDF o Word</b>: así el profesor puede preparar tu defensa a partir del texto.</p>
      <div class="field" style="margin-top:14px"><label class="flab" for="comentario">Comentario para el profesor (opcional)</label><textarea id="comentario" style="min-height:70px">${esc(e.comentario || "")}</textarea></div>
      <div class="msg bad" id="err" hidden></div>
      <div class="actions"><button class="btn" id="entregar" ${e.archivos.length ? "" : "disabled"}>${e.estado === "devuelto" ? "Volver a entregar" : "Entregar trabajo"}</button></div>`
    : e.fecha ? `<p class="muted">Entregado el ${esc(new Date(e.fecha).toLocaleString("es-ES", { day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }))}.${e.comentario ? ` Tu comentario: «${esc(e.comentario)}»` : ""}</p>` : ""}`;
  if (!editable) return;
  const err = (m) => { $("#err").textContent = m; $("#err").hidden = !m; };
  const input = $("#archivo"), drop = $("#drop");
  input.onchange = () => subir([...input.files]);
  drop.ondragover = (ev) => { ev.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (ev) => { ev.preventDefault(); drop.classList.remove("over"); subir([...ev.dataTransfer.files]); };
  $$("[data-borrar]").forEach((b) => (b.onclick = async () => {
    try { const r = await api("/api/trabajo/archivo/borrar", { id: t.id, archivo: b.dataset.borrar }); D.entrega.archivos = r.archivos; pintar(); } catch (x) { err(x.message); }
  }));
  $("#entregar").onclick = async () => {
    if (!confirm("¿Entregar el trabajo? Después ya no podrás cambiar los archivos (salvo que el profesor te lo devuelva).")) return;
    const b = $("#entregar"); b.disabled = true; b.textContent = "Entregando…";
    try { await api("/api/trabajo/entregar", { id: t.id, comentario: $("#comentario").value }); await cargar(); }
    catch (x) { err(x.message); b.disabled = false; b.textContent = "Entregar trabajo"; }
  };

  async function subir(files) {
    err("");
    const txt = $("#dropTxt"), fallos = [];
    for (const f of files) {
      if (f.size > MAX) { fallos.push(`«${f.name}» ocupa más de 4 MB. Comprímelo o divídelo en varios archivos.`); continue; }
      txt.textContent = `Subiendo «${f.name}»…`;
      try {
        const [datos, texto] = await Promise.all([base64(f), window.extraerTexto(f)]);
        const r = await api("/api/trabajo/archivo", { id: t.id, nombre: f.name, tipo: f.type, datos, texto });
        D.entrega.archivos = r.archivos;
      } catch (x) { fallos.push(`«${f.name}»: ${x.message}`); }
    }
    const coment = $("#comentario").value;
    pintar();
    if ($("#comentario")) $("#comentario").value = coment;
    if (fallos.length && $("#err")) { $("#err").textContent = fallos.join(" · "); $("#err").hidden = false; }
  }
}

(async () => {
  YO = await cabecera();
  YO.staff = ["profesor", "admin"].includes(YO.rol) || !!YO.admin;
  if (!id) { $("#vista").innerHTML = `<div class="msg bad">Falta el trabajo.</div>`; return; }
  await cargar();
})().catch((e) => { $("#vista").innerHTML = `<div class="msg bad">${esc(e.message)}</div>`; });
</script>
</body>
</html>
