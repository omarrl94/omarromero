<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Imprimir examen · FP José Ramón Otero</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
<style>
/* Examen en papel (A4) con la imagen del centro. Solo para el profesorado. */
:root{
  --amarillo:#EFCD2F; --amarillo-soft:#FDF6D8; --amarillo-ink:#6B5708;
  --verde:#A9CABB; --verde-soft:#EAF3EE; --verde-ink:#2D4A3E;
  --salmon:#E39F7D; --salmon-soft:#FBEDE5; --salmon-ink:#7A3F22;
  --grafito:#1F2430; --muted:#5D6573; --linea:#CDD2D9; --ok:#23784A; --ok-soft:#E5F3EB;
}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#E9EBEF;color:var(--grafito);font:14px/1.45 "Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* Barra de opciones (no se imprime) */
.barra{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--linea);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center}
.barra b{font-size:14px}
.barra label{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer}
.barra select,.barra input[type=number]{font:inherit;font-size:13.5px;padding:5px 8px;border:1px solid var(--linea);border-radius:8px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--linea);border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-size:13.5px;font-weight:600;border:none;background:#fff;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--grafito);color:#fff}
.btn{font:inherit;font-weight:700;font-size:14px;border:none;border-radius:9px;padding:8px 16px;background:var(--grafito);color:#fff;cursor:pointer}
.aviso{max-width:210mm;margin:12px auto 0;font-size:13px;color:var(--muted);text-align:center;padding:0 12px}
/* Hoja */
.hoja{width:210mm;min-height:297mm;margin:14px auto 40px;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.12);padding:14mm 15mm 16mm;position:relative}
.marco{width:100%;border-collapse:collapse}
.marco>thead{display:table-header-group}
.marco td{padding:0;vertical-align:top}
.franja{height:4px;margin:0 0 12px;border-radius:2px;background:linear-gradient(90deg,var(--amarillo) 0 33.3%,var(--verde) 33.3% 66.6%,var(--salmon) 66.6% 100%)}
.cab{display:flex;align-items:center;gap:10px;padding-bottom:6px}
.cab svg{width:34px;height:34px;flex:none}
.cab .centro{line-height:1.15}
.cab .centro small{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cab .centro b{font-size:14.5px}
.cab .que{margin-left:auto;text-align:right;line-height:1.3}
.cab .que .tag{display:inline-block;background:var(--amarillo);color:#2B2305;font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:2px 8px;border-radius:5px;text-transform:uppercase}
.cab .que div{font-size:11px;color:var(--muted)}
.vtag{display:inline-block;vertical-align:middle;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--grafito);color:#fff;border-radius:6px;padding:3px 9px;margin-left:6px}
h1{font-size:21px;margin:2px 0 2px;line-height:1.2}
.sub{color:var(--muted);margin:0 0 10px;font-size:13px}
.datos{display:grid;grid-template-columns:2.2fr 1fr 1fr 0.9fr;gap:8px;margin:10px 0 10px}
.datos div{border:1px solid var(--linea);border-radius:7px;padding:5px 8px 18px;font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.datos .nota{background:var(--amarillo-soft);border-color:var(--amarillo)}
.instr{background:#F5F6F8;border-left:4px solid var(--grafito);border-radius:6px;padding:8px 12px;font-size:12px;margin-bottom:6px}
.instr ul{margin:4px 0 0;padding-left:18px}
.sol-banda{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ok);font-weight:800;text-align:center;padding:6px;border-radius:7px;margin:8px 0;letter-spacing:.06em}
.parte{display:flex;align-items:center;gap:10px;margin:16px 0 8px;break-after:avoid}
.parte .n{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.parte h2{font-size:16px;margin:0}
.parte .pts{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.conf{width:100%;border-collapse:collapse;font-size:11.5px;margin:2px 0 8px}
.conf th,.conf td{border:1px solid var(--linea);padding:3px 8px;text-align:center}
.conf th{background:#F5F6F8}
.q{break-inside:avoid;margin:0 0 10px;padding:0 0 8px;border-bottom:1px dashed var(--linea)}
.q:last-child{border-bottom:none}
.qh{display:flex;gap:8px;font-weight:600;margin:0 0 5px}
.qh .num{flex:none;min-width:22px;height:22px;border-radius:6px;background:#F0F2F5;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.qh .p{margin-left:auto;flex:none;font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.opts{list-style:none;margin:0 0 0 30px;padding:0;display:grid;gap:3px}
.opts li{display:flex;gap:8px;align-items:flex-start}
.caja{flex:none;width:13px;height:13px;border:1.5px solid var(--grafito);border-radius:50%;margin-top:3px}
.opts li.ok{font-weight:700;color:var(--ok)}
.opts li.ok .caja{background:var(--ok);border-color:var(--ok)}
.conflinea{margin:5px 0 0 30px;font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.conflinea span{display:inline-flex;gap:5px;align-items:center}
.conflinea .cuad{width:11px;height:11px;border:1.5px solid var(--muted);border-radius:2px}
.lineas{margin:6px 0 0 30px}
.lineas div{border-bottom:1px solid #C9CED6;height:24px}
.modelo{margin:6px 0 0 30px;background:var(--ok-soft);border-left:3px solid var(--ok);border-radius:5px;padding:6px 10px;font-size:12.5px}
.modelo b{color:var(--ok)}
.claves{display:block;margin-top:3px;font-size:11.5px;color:var(--muted)}
.bloque{break-inside:avoid;background:#F7F8FA;border:1px solid var(--linea);border-radius:8px;padding:8px 12px;margin:6px 0 10px}
.bloque h3{margin:0 0 3px;font-size:14px}
.bloque p{margin:0;white-space:pre-wrap;font-size:13px}
.bloque img{display:block;max-width:100%;max-height:85mm;margin:8px auto 0}
.campos{margin:4px 0 0 30px;display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;align-items:center;font-size:13px}
.campo{display:contents}
.campo .val{display:flex;align-items:center;gap:8px}
.campo .hueco{flex:0 0 150px;height:24px;border:1.5px solid var(--grafito);border-radius:5px}
.campo .res{flex:0 1 auto;min-width:150px;padding:2px 10px;border:1.5px solid var(--ok);background:var(--ok-soft);border-radius:5px;font-weight:700;color:var(--ok)}
.campo .op{display:inline-flex;gap:12px;flex-wrap:wrap}
.campo .op span{display:inline-flex;gap:5px;align-items:center}
.campo .op span.ok{font-weight:700;color:var(--ok)}
.campo .op span.ok .caja{background:var(--ok);border-color:var(--ok)}
.resol{margin:5px 0 0 30px;font-size:12px;color:var(--muted);white-space:pre-wrap}
.trabajo{margin:6px 0 0 30px;border:1px dashed var(--linea);border-radius:6px;height:26mm}
.pie{margin-top:14px;padding-top:6px;border-top:1px solid var(--linea);font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between}
@page{size:A4;margin:12mm 13mm 14mm}
@media print{
  body{background:#fff}
  .barra,.aviso{display:none!important}
  .hoja{width:auto;min-height:0;margin:0;box-shadow:none;padding:0}
}
@media screen and (max-width:820px){ .hoja{width:auto;margin:10px;padding:10mm 7mm} .datos{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<div class="barra" id="barra">
  <b>Imprimir examen</b>
  <div class="seg" role="group" aria-label="Versión">
    <button type="button" data-ver="alumno" aria-pressed="true">Versión alumno</button>
    <button type="button" data-ver="sol" aria-pressed="false">Solucionario</button>
  </div>
  <label id="versionWrap" hidden title="Examen aleatorio: cada versión tiene otro orden y otros valores, con su propio solucionario">Versión
    <select id="versionSel"><option value="0">Original</option></select></label>
  <label>Líneas por pregunta abierta <input type="number" id="nLineas" min="0" max="20" value="5" style="width:60px"></label>
  <label><input type="checkbox" id="hueco" checked> Espacio para operaciones</label>
  <button class="btn" type="button" id="imprimir">🖨 Imprimir / guardar PDF</button>
</div>
<p class="aviso">Por si falla Internet: imprime este examen en papel. En «Destino» puedes elegir «Guardar como PDF». Activa «Gráficos de fondo» en el cuadro de impresión para que salgan los colores.</p>
<main class="hoja" id="hoja"><p>Cargando…</p></main>

<script src="/assets/app.js"></script>
<script>
const CONF = [{ nombre: "Muy seguro", a: "+100 %", f: "−100 %" }, { nombre: "Seguro", a: "+70 %", f: "−50 %" }, { nombre: "Poco seguro", a: "+50 %", f: "−30 %" }];
const id = new URLSearchParams(location.search).get("id") || "";
let EX = null, VER = new URLSearchParams(location.search).get("ver") === "sol" ? "sol" : "alumno";
const pts = (q) => q.puntos ?? 1;
const sum = (l) => l.reduce((s, q) => s + pts(q), 0);
const f2 = (n) => fmt(Math.round(n * 100) / 100);
const pP = (n) => `${f2(n)} ${n === 1 ? "punto" : "puntos"}`;

function pintar() {
  const ex = EX, sol = VER === "sol", nL = Math.max(0, Math.min(20, Number($("#nLineas").value) || 0)), hueco = $("#hueco").checked;
  const T = titulosPartes(ex), colores = { mc: "amarillo", open: "salmon", num: "verde" };
  const total = sum(ex.mc) + sum(ex.open) + sum(ex.num || []);
  const parte = (k, letra) => `<div class="parte"><span class="n" style="background:var(--${colores[k]}-soft);color:var(--${colores[k]}-ink)">Parte ${letra}</span><h2>${esc(T[k])}</h2><span class="pts">${pP(sum(k === "num" ? ex.num || [] : ex[k]))}</span></div>`;
  const bloques = (() => { let ultimo = ""; return (q) => {
    if (!q.bloque || q.bloque === ultimo) return ""; ultimo = q.bloque;
    const b = (ex.bloques || []).find((x) => x.id === q.bloque); if (!b) return "";
    return `<div class="bloque">${b.titulo ? `<h3>${esc(b.titulo)}</h3>` : ""}${b.texto ? `<p>${esc(b.texto)}</p>` : ""}${b.imagen ? `<img src="${esc(b.imagen)}" alt="">` : ""}</div>`;
  }; })();
  const letraV = ex.version ? `Versión ${"ABCDEFGH"[ex.version - 1]}` : "";
  let h = `<h1>${esc(ex.titulo)}${letraV ? ` <span class="vtag">${letraV}</span>` : ""}</h1>${ex.subtitulo ? `<p class="sub">${esc(ex.subtitulo)}</p>` : ""}
    ${sol ? `<div class="sol-banda">SOLUCIONARIO · SOLO PARA EL PROFESORADO</div>` : `
    <div class="datos"><div>Nombre y apellidos</div><div>Grupo</div><div>Fecha</div><div class="nota">Nota</div></div>
    <div class="instr"><b>Instrucciones</b><ul>
      <li>Escribe con bolígrafo azul o negro. Puntuación total: <b>${pP(total)}</b> (la nota se calcula sobre 10).</li>
      ${ex.mc.length ? `<li>Test: marca <b>una sola opción</b> rellenando el círculo.${ex.confianza ? " Marca también tu <b>nivel de confianza</b>: si aciertas sumas y si fallas restas según la tabla; sin nivel de confianza la pregunta cuenta como en blanco." : ""}</li>` : ""}
      ${(ex.num || []).length ? `<li>Ejercicios: escribe el <b>resultado final</b> en el recuadro con su unidad.</li>` : ""}
    </ul></div>`}`;
  let n = 0, letra = 0;
  if (ex.mc.length) {
    h += parte("mc", "ABC"[letra++]);
    if (ex.confianza) h += `<table class="conf"><tr><th>Confianza</th>${CONF.map((c) => `<th>${c.nombre}</th>`).join("")}</tr><tr><td>Si aciertas</td>${CONF.map((c) => `<td>${c.a}</td>`).join("")}</tr><tr><td>Si fallas</td>${CONF.map((c) => `<td>${c.f}</td>`).join("")}</tr></table>`;
    ex.mc.forEach((q) => {
      h += bloques(q) + `<div class="q"><p class="qh"><span class="num">${++n}</span><span>${esc(q.t)}</span><span class="p">${pP(pts(q))}</span></p>
        <ul class="opts">${q.o.map((o, j) => `<li class="${sol && j === q.c ? "ok" : ""}"><span class="caja"></span><span><b>${LETRAS[j]})</b> ${esc(o)}</span></li>`).join("")}</ul>
        ${ex.confianza && !sol ? `<div class="conflinea">Confianza: ${CONF.map((c) => `<span><i class="cuad"></i>${c.nombre}</span>`).join("")}</div>` : ""}
        ${sol && q.exp ? `<div class="modelo">${esc(q.exp)}</div>` : ""}</div>`;
    });
  }
  if (ex.open.length) {
    h += parte("open", "ABC"[letra++]);
    ex.open.forEach((q) => {
      h += bloques(q) + `<div class="q"><p class="qh"><span class="num">${++n}</span><span>${q.act ? `<span style="color:var(--muted);font-weight:500">${esc(q.act)} · </span>` : ""}${esc(q.t)}</span><span class="p">${pP(pts(q))}</span></p>
        ${sol ? `<div class="modelo"><b>Respuesta modelo:</b> ${esc(q.exp || "—")}<span class="claves">Conceptos clave: ${q.groups.map((g, i) => `${esc(g[0])}${q.pesos ? ` (${f2(q.pesos[i])} p)` : ""}`).join(" · ")}</span></div>`
          : `<div class="lineas">${"<div></div>".repeat(nL)}</div>`}</div>`;
    });
  }
  if ((ex.num || []).length) {
    h += parte("num", "ABC"[letra++]);
    ex.num.forEach((q) => {
      const campos = q.campos.map((c) => {
        if (c.tipo === "opcion") return `<div class="campo"><span class="lab">${esc(c.etiqueta)}</span><span class="val op">${c.opciones.map((o, k) => `<span class="${sol && k === c.correcta ? "ok" : ""}"><i class="caja"></i>${esc(o)}</span>`).join("")}</span></div>`;
        return `<div class="campo"><span class="lab">${esc(c.etiqueta)}</span><span class="val">${sol ? `<span class="res">${esc(fmtV(c.valor))} ${esc(c.unidad || "")}</span>` : `<span class="hueco"></span><span>${esc(c.unidad || "")}</span>`}</span></div>`;
      }).join("");
      h += bloques(q) + `<div class="q"><p class="qh"><span class="num">${++n}</span><span>${esc(q.t)}</span><span class="p">${pP(pts(q))}</span></p>
        <div class="campos">${campos}</div>
        ${sol && q.exp ? `<div class="resol">Resolución: ${esc(q.exp)}</div>` : !sol && hueco ? `<div class="trabajo"></div>` : ""}</div>`;
    });
  }
  h += `<footer class="pie"><span>FP José Ramón Otero · ${esc(ex.ciclo || "")} · ${esc(ex.modulo || "")}</span><span>${sol ? "Solucionario" : "Examen"} · ${pP(total)}</span></footer>`;
  // La cabecera va en un <thead>: el navegador la repite arriba de cada página impresa,
  // así el logo del centro sale en la esquina superior izquierda de todas las hojas.
  $("#hoja").innerHTML = `<table class="marco"><thead><tr><td>
      <header class="cab">${LOGO}<div class="centro"><small>Formación Profesional</small><b>José Ramón Otero</b></div>
        <div class="que"><span class="tag">${esc(ex.ciclo || "")}</span><div>${esc(ex.modulo || "")} · ${esc(ex.titulo)}${ex.version ? ` · Versión ${"ABCDEFGH"[ex.version - 1]}` : ""}${sol ? " · Solucionario" : ""}</div></div></header>
      <div class="franja"></div></td></tr></thead>
    <tbody><tr><td>${h}</td></tr></tbody></table>`;
  document.title = `${ex.titulo}${sol ? " · Solucionario" : ""} · FP José Ramón Otero`;
}

$$("[data-ver]").forEach((b) => (b.onclick = () => {
  VER = b.dataset.ver; $$("[data-ver]").forEach((x) => x.setAttribute("aria-pressed", x === b)); pintar();
}));
$("#nLineas").oninput = pintar; $("#hueco").onchange = pintar;
$("#imprimir").onclick = () => window.print();

(async () => {
  // Solo profesorado y administración (el servidor tampoco da los datos a nadie más).
  const { usuario } = await api("/api/cuenta/yo");
  if (usuario.rol !== "profesor") {
    document.body.innerHTML = `<p style="text-align:center;margin:60px 16px;font:16px system-ui">El examen imprimible solo está disponible para el profesorado. <a href="/panel/">Volver</a></p>`;
    return;
  }
  // Siempre se pide la versión (la 0 es el original con sus valores puestos).
  const N = Number(new URLSearchParams(location.search).get("v")) || 0;
  EX = await api(`/api/profesor/examen/version?id=${encodeURIComponent(id)}&n=${N}`);
  const a = EX.aleatorio || {};
  if (a.preguntas || a.opciones || a.valores) {
    $("#versionWrap").hidden = false;
    $("#versionSel").innerHTML = `<option value="0">Original</option>` + "ABCDEFGH".split("").map((l, i) => `<option value="${i + 1}">Versión ${l}</option>`).join("");
    $("#versionSel").value = String(N);
    $("#versionSel").onchange = async () => {
      const n = Number($("#versionSel").value);
      history.replaceState(null, "", `?id=${encodeURIComponent(id)}${n ? `&v=${n}` : ""}${VER === "sol" ? "&ver=sol" : ""}`);
      EX = await api(`/api/profesor/examen/version?id=${encodeURIComponent(id)}&n=${n}`); pintar();
    };
  }
  $$("[data-ver]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.ver === VER));
  pintar();
})().catch((e) => { $("#hoja").innerHTML = `<p style="color:#B8382B">${esc(e.message)}</p>`; });
</script>
</body>
</html>
