<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // iPhone/iPad amplían la página al tocar un campo con letra pequeña (el editor usa 13 px).
      // Con maximum-scale=1 iOS deja de hacerlo, pero sigue permitiendo hacer zoom con dos dedos.
      if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover');
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CodeForge Medio" />
    <meta name="theme-color" content="#05060a" />
    <meta name="description" content="CodeForge Medio — aprende a programar jugando, desde cero, con Python, JavaScript y Java." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>CodeForge Medio · Aprende a programar jugando</title>
  </head>
  <body class="bg-void-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
