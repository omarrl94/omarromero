# Integración continua: lint, tipos, unitarias, datos, build, bundle y E2E (móvil y escritorio).
name: CI

on:
  push:
    branches: [conecta-ffe]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
