# Prueba puntual: ¿pueden los ejecutores de GitHub conectar al puerto 25 de los servidores de correo?
# (Necesario para comprobar que un buzón existe sin enviar ningún mensaje.)
name: Probar SMTP

on:
  push:
    branches: [conecta-ffe]
    paths:
      - .github/workflows/probar-smtp.yml
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Puerto 25
        run: |
          for h in gmail-smtp-in.l.google.com sothis-tech.mail.protection.outlook.com aspmx.l.google.com; do
            timeout 10 bash -c "exec 3<>/dev/tcp/$h/25 && head -c 200 <&3" && echo " -> $h ABIERTO" || echo "$h CERRADO"
          done
