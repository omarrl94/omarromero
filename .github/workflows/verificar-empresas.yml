# Verifica las empresas candidatas contra sus webs oficiales (con Internet) y guarda el
# resultado en la rama. Se ejecuta al cambiar las candidatas o el verificador, a mano
# (Actions → «Verificar empresas» → Run workflow) y el día 1 de cada mes.
name: Verificar empresas

on:
  push:
    branches: [conecta-ffe]
    paths:
      - data/empresas.candidatas.json
      - data/retiradas.json
      - data/revision-manual.json
      - data/correos-rebotados.json
      - scripts/verificar-empresas.ts
      - scripts/lib/**
      - .github/workflows/verificar-empresas.yml
  workflow_dispatch:
    inputs:
      solo:
        description: 'Ids de empresas separados por comas (vacío = todas)'
        required: false
        default: ''
  schedule:
    - cron: '23 5 1 * *'

permissions:
  contents: write

concurrency:
  group: verificar-empresas
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conecta-ffe

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar Chromium (para comprobar los formularios como los ve una persona)
        run: npx playwright install --with-deps chromium

      - name: Verificar empresas (web, correo en la fuente, MX, buzón y formulario real)
        env:
          SOLO: ${{ github.event.inputs.solo }}
        run: npm run verificar:empresas -- --concurrencia=8 --smtp --navegador ${SOLO:+--solo=$SOLO}

      - name: Validar datos
        run: npm run validar:datos

      - name: Auditoría de 10 empresas al azar
        run: npm run auditar:muestra
        continue-on-error: true

      - name: Comprobar enlaces
        run: npm run comprobar:enlaces
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: informes-verificacion
          path: |
            data/empresas.json
            data/informe-verificacion.json
            docs/INFORME-VERIFICACION.md
            docs/AUDITORIA-CONTACTOS.md
            docs/AUDITORIA-MUESTRA.md
            docs/COMPROBACION-ENLACES.md

      - name: Guardar resultados en la rama
        run: |
          git config user.name "verificador-conecta-ffe"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/empresas.json data/informe-verificacion.json docs/INFORME-VERIFICACION.md docs/AUDITORIA-CONTACTOS.md docs/AUDITORIA-MUESTRA.md docs/COMPROBACION-ENLACES.md
          if git diff --cached --quiet; then
            echo "Sin cambios en el directorio."
          else
            git commit -m "Verificación automática de empresas ($(date -u +%F))"
            # Si la rama ha avanzado mientras se verificaba, se integra antes de subir.
            for intento in 1 2 3; do
              git pull --rebase origin conecta-ffe && git push origin HEAD:conecta-ffe && exit 0
              sleep $((intento * 5))
            done
            exit 1
          fi
