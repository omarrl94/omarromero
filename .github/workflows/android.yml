# Compila la app de Android de CodeForge en los servidores de GitHub.
#
# Cada vez que se sube código a las ramas de CodeForge (o al pulsar «Run workflow»):
#   · CodeForge-apk-pruebas      → APK para instalar directamente en un móvil y probar.
#   · CodeForge-google-play-aab  → el .aab firmado que se sube a Google Play
#                                  (solo si están configurados los secretos de la llave).
#
# Secretos (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_APP_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID  (sin ellos, la app funciona en modo local)
# Todos los pasos están explicados en GOOGLE-PLAY.md.
name: App Android

on:
  push:
    branches: [codeforge-netlify, codeforge-living-engine]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compilar APK y AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Google Play exige que este número crezca en cada versión subida.
      CF_VERSION_CODE: ${{ github.run_number }}
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar el temario (880 verificaciones)
        run: npm test

      - name: Compilar la web del juego
        run: npm run build

      - name: Copiar la web al proyecto Android
        run: npx cap sync android

      # Con los secretos se usa tu llave de subida. Sin ellos se firma con una llave temporal
      # (solo para comprobar que la compilación de publicación funciona; ese AAB no se guarda).
      - name: Preparar la llave de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/upload-key.jks"
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
            { echo "CF_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"; echo "CF_KEY_ALIAS=$ANDROID_KEY_ALIAS"; echo "CF_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"; } >> "$GITHUB_ENV"
          else
            TMP_PASS="temporal-$(openssl rand -hex 12)"
            echo "::add-mask::$TMP_PASS"
            keytool -genkeypair -storetype PKCS12 -keystore "$KS" -alias temporal -keyalg RSA -keysize 2048 -validity 1 \
              -storepass "$TMP_PASS" -keypass "$TMP_PASS" -dname "CN=Prueba" > /dev/null
            { echo "CF_KEYSTORE_PASSWORD=$TMP_PASS"; echo "CF_KEY_ALIAS=temporal"; echo "CF_KEY_PASSWORD=$TMP_PASS"; } >> "$GITHUB_ENV"
          fi
          echo "CF_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Compilar APK de pruebas
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Compilar AAB y APK firmados para Google Play
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Comprobar la firma
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          jarsigner -verify "$AAB" > /dev/null && echo "AAB firmado correctamente"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256:" | head -2

      - name: Renombrar los archivos
        run: |
          mkdir -p out
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/CodeForge-$V-$CF_VERSION_CODE-pruebas.apk"
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/CodeForge-$V-$CF_VERSION_CODE.aab"
            cp android/app/build/outputs/apk/release/app-release.apk "out/CodeForge-$V-$CF_VERSION_CODE.apk"
          fi
          ls -la out

      - name: Guardar APK de pruebas
        uses: actions/upload-artifact@v5
        with:
          name: CodeForge-apk-pruebas
          path: out/*-pruebas.apk
          retention-days: 30

      - name: Guardar AAB para Google Play
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: CodeForge-google-play-aab
          path: |
            out/*.aab
            out/CodeForge-*[0-9].apk
          retention-days: 90

      - name: Resumen
        run: |
          {
            echo "## CodeForge para Android · versión $(node -p "require('./package.json').version") (código $CF_VERSION_CODE)"
            echo ""
            echo "- APK de pruebas: descárgalo abajo en **Artifacts → CodeForge-apk-pruebas** e instálalo en tu móvil."
            if [ "$HAS_SIGNING_KEY" = "true" ]; then
              echo "- AAB para Google Play: **Artifacts → CodeForge-google-play-aab** (súbelo en Play Console)."
            else
              echo "- ⚠️ No hay llave de firma configurada: falta el AAB para Google Play. Mira GOOGLE-PLAY.md, paso 3."
            fi
            if [ -z "$VITE_FIREBASE_API_KEY" ]; then
              echo "- ⚠️ Sin secretos de Firebase: esta compilación funciona en **modo local** (sin cuentas en la nube ni ranking global)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
