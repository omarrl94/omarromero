    { t: "2. DAM: sqlite_lectura.py", d: "Abre la BBDD en modo solo lectura y solo acepta SELECT.", lang: "Python", code: String.raw`import re, sqlite3
from mcp.server.fastmcp import FastMCP

mcp = FastMCP("sqlite-lectura")
DB = "file:tienda.db?mode=ro"          # la propia conexión es de solo lectura
MAX_FILAS = 200

def conectar():
    return sqlite3.connect(DB, uri=True)

@mcp.tool()
def listar_tablas() -> list[str]:
    """Devuelve los nombres de las tablas de la base de datos."""
    with conectar() as c:
        return [f[0] for f in c.execute("SELECT name FROM sqlite_master WHERE type='table'")]

@mcp.tool()
def describir_tabla(tabla: str) -> list[dict]:
    """Devuelve las columnas (nombre y tipo) de una tabla."""
    if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", tabla):
        raise ValueError("Nombre de tabla no válido")
    with conectar() as c:
        return [{"columna": f[1], "tipo": f[2]} for f in c.execute(f"PRAGMA table_info({tabla})")]

@mcp.tool()
def consultar(sql: str) -> list[dict]:
    """Ejecuta una consulta SELECT (máximo 200 filas)."""
    if not re.match(r"^\s*select\b", sql, re.IGNORECASE) or ";" in sql.strip().rstrip(";"):
        raise ValueError("Solo se permite una única sentencia SELECT")
    with conectar() as c:
        cur = c.execute(sql)
        cols = [d[0] for d in cur.description]
        return [dict(zip(cols, fila)) for fila in cur.fetchmany(MAX_FILAS)]

if __name__ == "__main__":
    mcp.run()   # transporte stdio por defecto` },

GRANT CONNECT ON DATABASE tienda TO claude_ro;

import psutil
from mcp.server.fastmcp import FastMCP

logging.basicConfig(stream=sys.stderr, level=logging.INFO)   # nunca a stdout
mcp = FastMCP("jro-ops")
DB = "file:tienda.db?mode=ro"
SERVICIOS_PERMITIDOS = {"nginx", "tomcat", "postgresql"}
AUDITORIA = "auditoria_mcp.log"

# ---------- Resources ----------
@mcp.resource("metricas://host")
def metricas() -> str:
    """Uso actual de CPU, memoria y disco del servidor."""
    disco = psutil.disk_usage("/")
    return (f"cpu={psutil.cpu_percent(interval=1)}% "
            f"ram={psutil.virtual_memory().percent}% "
            f"disco={disco.percent}%")

@mcp.resource("esquema://{tabla}")
def esquema(tabla: str) -> str:
    """Columnas de una tabla de la base de datos."""
    if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", tabla):
        raise ValueError("Tabla no válida")
    with sqlite3.connect(DB, uri=True) as c:
        return "\n".join(f"{f[1]} {f[2]}" for f in c.execute(f"PRAGMA table_info({tabla})"))

# ---------- Tools ----------
@mcp.tool()
def consulta_segura(sql: str) -> list[dict]:
    """Ejecuta una única sentencia SELECT y devuelve hasta 100 filas."""
    if not re.match(r"^\s*select\b", sql, re.I) or ";" in sql.strip().rstrip(";"):
        raise ValueError("Solo una sentencia SELECT")
    with sqlite3.connect(DB, uri=True) as c:
        cur = c.execute(sql)
        cols = [d[0] for d in cur.description]
        return [dict(zip(cols, f)) for f in cur.fetchmany(100)]

@mcp.tool()
def reiniciar_servicio(nombre: str, confirmacion: str) -> str:
    """Reinicia un servicio permitido. 'confirmacion' debe ser exactamente
    'REINICIAR <nombre>' escrito por el usuario."""
    if nombre not in SERVICIOS_PERMITIDOS:
        raise ValueError(f"Servicio no permitido. Permitidos: {sorted(SERVICIOS_PERMITIDOS)}")
    if confirmacion != f"REINICIAR {nombre}":
        return "Falta la confirmación del usuario. Pídele que escriba: REINICIAR " + nombre
    r = subprocess.run(["sudo", "systemctl", "restart", nombre], capture_output=True, text=True, timeout=60)
    with open(AUDITORIA, "a", encoding="utf-8") as f:
        f.write(f"{datetime.datetime.now().isoformat()} restart {nombre} rc={r.returncode}\n")
    return "Reiniciado correctamente" if r.returncode == 0 else "Error: " + r.stderr

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add("hidden"), 2600);
}

async function copiar(texto) {
  try {
    await navigator.clipboard.writeText(texto);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = texto; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch {}
    ta.remove();
  }
  toast("Copiado al portapapeles");
}

async function hashPassword(pw, salt) {
  const data = new TextEncoder().encode(salt + ":" + pw);
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }
  // Contexto no seguro (sin crypto.subtle): hash simple solo para la demo
  let h = 5381; for (const b of data) h = ((h << 5) + h + b) >>> 0;
  return "djb2-" + h.toString(16);
}

function descargar(nombre, contenido, tipo = "application/json") {
  const blob = new Blob([contenido], { type: tipo });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

}

function contenidoTab(s, u) {
  switch (UI.tab) {
    case "teoria": return tabTeoria(s);
    case "taller": return tabTaller(s);
    case "prompts": return tabPrompts(s);
    case "actividad": return tabActividad(s, u);
    case "faq": return tabFaq(s);
  }
  return "";
}

function tabTeoria(s) {
  return `<div class="space-y-4">${s.teoria.map(t => `

}

function tabTaller(s) {
  return `<ol class="space-y-4">${s.taller.map(p => `

function tabPrompts(s) {

function bloqueActividad(tipo, a, esMio) {
  const cls = { dam: "border-jro-sage", asir: "border-jro-terra" }[tipo];
  const head = { dam: "dam-head", asir: "asir-head" }[tipo];
  const titulo = { dam: "Bloque DAM · Desarrollo de Aplicaciones Multiplataforma", asir: "Bloque ASIR · Administración de Sistemas Informáticos en Red" }[tipo];
  return `<section class="bg-white rounded-xl border-2 ${cls} overflow-hidden">
    <div class="${head} px-5 py-2.5 flex items-center justify-between gap-2">
      <span class="text-sm font-bold text-jro-ink">${titulo}</span>
      ${esMio ? `<span class="rounded-full bg-white/80 px-2 py-0.5 text-[11px] font-bold">Tu ciclo</span>` : ""}
    </div>
    <div class="p-5">
      <h3 class="font-bold text-lg">${esc(a.t)}</h3>
      <p class="mt-1 text-[15px] leading-relaxed">${esc(a.d)}</p>
      <div class="mt-3 text-sm font-semibold">Entregables</div>
      <ul class="mt-1 list-disc pl-5 text-sm space-y-1">${a.entregables.map(e => `<li>${esc(e)}</li>`).join("")}</ul>
    </div>
  </section>`;
}

function tabActividad(s, u) {
  const a = s.actividad;
  let form = "";
  if (u.role === "alumno") {
    const e = entrega(u.id, s.n);
    const bloqueada = e?.estado === "aprobada";
    const input = "mt-1 w-full rounded-lg border border-jro-line bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-jro-gold";
    form = `<div class="mt-5 rounded-lg bg-white/85 border border-jro-line p-4">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h4 class="font-bold">Formulario de entrega para evaluación docente</h4>
        ${badgeEstado(e?.estado)}
      </div>
      ${e ? `<p class="text-xs text-jro-mute mt-1">Última entrega: ${fechaHora(e.ts)}</p>` : ""}
      ${e?.revisadoEn ? `<div class="mt-3 rounded-lg ${e.estado === "aprobada" ? "bg-jro-gold/25 border border-jro-gold" : "bg-jro-terra/25 border border-jro-terra"} px-3 py-2 text-sm">
        <div class="font-semibold">Evaluación del profesor${typeof e.nota === "number" ? ` · Nota: ${e.nota}/10` : ""}</div>
        <div class="mt-1 whitespace-pre-wrap">${esc(e.feedback || "Sin comentarios.")}</div></div>` : ""}
      ${bloqueada ? `<p class="mt-3 text-sm">Actividad aprobada. ¡Buen trabajo!</p>` : `
      <form data-form="entrega" data-n="${s.n}" class="mt-3 grid gap-3" novalidate>
        <label class="block text-sm"><span class="font-medium">Enlace al repositorio o documento (https://…)</span>
          <input name="enlace" class="${input}" value="${esc(e?.enlace || "")}" placeholder="https://github.com/usuario/repositorio"></label>
        <label class="block text-sm"><span class="font-medium">Compañero/a del otro ciclo (bloque de sincronización)</span>
          <input name="pareja" maxlength="80" class="${input}" value="${esc(e?.pareja || "")}" placeholder="Nombre y ciclo"></label>
        <label class="block text-sm"><span class="font-medium">Resumen de lo realizado</span>
          <textarea name="comentario" rows="4" maxlength="3000" class="${input}">${esc(e?.comentario || "")}</textarea></label>
        <label class="flex gap-2 items-start text-sm"><input type="checkbox" name="limpio" class="mt-1 h-4 w-4 accent-[#efcd2f]">
          <span>Confirmo que la entrega no contiene datos personales, contraseñas reales ni logs sin anonimizar.</span></label>
        <div><button class="btn-cta rounded-lg px-5 py-2 text-sm">${e ? "Actualizar entrega" : "Enviar entrega"}</button></div>
      </form>`}
    </div>`;
  } else {
    const lista = DB.submissions.filter(x => x.sesion === s.n);
    form = `<div class="mt-5 rounded-lg bg-white/85 border border-jro-line p-4">
      <h4 class="font-bold">Entregas de esta sesión</h4>
      <p class="text-sm mt-1">${lista.length} entregas · ${lista.filter(x => x.estado === "pendiente").length} pendientes de revisión.</p>
      <button data-action="ir" data-vista="admin" data-admintab="entregas" class="mt-3 btn-cta rounded-lg px-4 py-2 text-sm">Corregir en el Panel docente</button>
    </div>`;
  }
  return `<div class="space-y-5">
    <div class="grid xl:grid-cols-2 gap-5">
      ${bloqueActividad("dam", a.dam, u.ciclo === "DAM")}
      ${bloqueActividad("asir", a.asir, u.ciclo === "ASIR")}
    </div>
    <section class="sync-card rounded-xl overflow-hidden">
      <div class="sync-head px-5 py-2.5 text-sm font-bold text-jro-ink">Bloque Sincronización DAM + ASIR</div>
      <div class="p-5">
        <h3 class="font-bold text-lg">${esc(a.sync.t)}</h3>
        <p class="mt-1 text-[15px] leading-relaxed">${esc(a.sync.d)}</p>
        <div class="mt-3 text-sm font-semibold">Entregables</div>
        <ul class="mt-1 list-disc pl-5 text-sm space-y-1">${a.sync.entregables.map(e => `<li>${esc(e)}</li>`).join("")}</ul>
        ${form}
      </div>
    </section>
  </div>`;
}

function tabFaq(s) {
  return `<div class="space-y-3">${s.faq.map(f => `
    <details class="group bg-white rounded-xl border border-jro-line">
      <summary class="cursor-pointer list-none px-5 py-4 font-semibold flex items-center justify-between gap-3">
        <span>${esc(f.q)}</span><span class="text-jro-mute group-open:rotate-45 transition text-xl leading-none">+</span>
      </summary>
      <div class="px-5 pb-4 prose-jro text-[15px]">${f.a}</div>
    </details>`).join("")}</div>`;
}

function exportarDatos() {
  const u = usuario();
  const { pwHash, salt, ...perfil } = u;
  const datos = {
    exportadoEn: new Date().toISOString(),
    responsable: "Centro de Formación Profesional José Ramón Otero (" + ADMIN_EMAIL + ")",
    perfil,
    progreso: DB.progress[u.id] || {},
    entregas: DB.submissions.filter(s => s.userId === u.id),
    titulos: DB.diplomas.filter(d => d.userId === u.id)
  };
  descargar(`mis-datos-${u.email}.json`, JSON.stringify(datos, null, 2));
}

function eliminarUsuario(id) {
  DB.users = DB.users.filter(u => u.id !== id);
  delete DB.progress[id];
  DB.submissions = DB.submissions.filter(s => s.userId !== id);
  DB.diplomas = DB.diplomas.filter(d => d.userId !== id);
  guardar();
}

function filtroCicloHTML() {
  return `<div class="flex flex-wrap gap-2 mb-4">${["todos", "DAM", "ASIR"].map(c =>
    `<button data-action="filtrociclo" data-c="${c}" class="rounded-full px-3 py-1 text-sm border ${UI.filtroCiclo === c ? "bg-jro-ink text-white border-jro-ink" : "bg-white border-jro-line"}">${c === "todos" ? "Todos" : c}</button>`).join("")}</div>`;
}

const alumnosFiltrados = () => alumnos().filter(a => UI.filtroCiclo === "todos" || a.ciclo === UI.filtroCiclo);

    <tbody>${lista.map(a => {
      const pct = Math.round(completadas(a.id) / 12 * 100);
      const ent = DB.submissions.filter(s => s.userId === a.id);

        <td class="py-2 pr-3"><div class="font-semibold">${esc(a.nombre)}</div><div class="text-xs text-jro-mute">${esc(a.email)}</div></td>

  return `<div class="overflow-x-auto"><table class="w-full text-sm">
    <thead><tr class="text-left text-jro-mute"><th class="py-2 pr-3">Usuario</th><th class="py-2 pr-3">Rol</th><th class="py-2 pr-3">Alta</th><th class="py-2">Acciones</th></tr></thead>
    <tbody>${DB.users.map(u => `<tr class="border-t border-jro-line">
      <td class="py-2 pr-3"><div class="font-semibold">${esc(u.nombre)}</div><div class="text-xs text-jro-mute">${esc(u.email)}</div></td>
      <td class="py-2 pr-3">${u.role === "admin" ? "Superadmin" : `${badgeCiclo(u.ciclo)} ${esc(u.curso)}`}</td>
      <td class="py-2 pr-3 text-xs">${fecha(u.createdAt)}</td>
      <td class="py-2">${u.role === "admin" ? "—" : `<div class="flex flex-wrap gap-1">
        <button data-action="resetpw" data-id="${u.id}" class="rounded-lg px-2.5 py-1 text-xs border border-jro-line bg-white">Restablecer contraseña</button>
        <button data-action="borrarusuario" data-id="${u.id}" class="rounded-lg px-2.5 py-1 text-xs border border-jro-terra bg-white">Eliminar</button></div>`}</td>
    </tr>`).join("")}</tbody></table></div>
    <p class="mt-4 text-xs text-jro-mute">Restablecer contraseña deja la cuenta sin clave: el alumno establece una nueva en su siguiente acceso.</p>`;
}

function emitirTitulo(userId) {
  if (!apto(userId) || diplomaDe(userId)) return;
  const anio = new Date().getFullYear();
  const codigo = `JRO-IA-${anio}-${Math.random().toString(16).slice(2, 8).toUpperCase()}`;
  DB.diplomas.push({ id: uid(), userId, codigo, emitidoEn: new Date().toISOString(), emitidoPor: ADMIN_EMAIL, nota: notaMedia(userId) });
  guardar();
  toast("Título emitido y firmado");
}

/* =====================================================================
   VISTA: DIPLOMA (imprimible en A4 apaisado)
   ===================================================================== */
function vistaDiploma() {
  const d = DB.diplomas.find(x => x.id === UI.diplomaId);
  if (!d) { UI.vista = "curso"; return vistaCurso(); }
  const a = DB.users.find(u => u.id === d.userId);
  return `${header()}
  <main class="max-w-6xl mx-auto px-4 py-6">
    <div class="no-print flex flex-wrap gap-2 mb-4">
      <button data-action="imprimir" class="btn-cta rounded-lg px-4 py-2 text-sm">Imprimir / Guardar como PDF</button>
      <button data-action="ir" data-vista="${UI.volverA}" class="rounded-lg px-4 py-2 text-sm border border-jro-line bg-white">Volver</button>
      <span class="text-xs text-jro-mute self-center">En el diálogo de impresión elige "Guardar como PDF", orientación horizontal y activa "Gráficos de fondo".</span>
    </div>
    <div class="overflow-x-auto">
    <div id="diploma-print" class="relative mx-auto bg-white shadow-xl rounded-md" style="width:1123px;height:794px;min-width:1123px">
      <div class="absolute inset-0" style="background:#FAF9F5"></div>
      <div class="absolute" style="inset:22px;border:3px solid #efcd2f"></div>
      <div class="absolute" style="inset:32px;border:1px solid #111111"></div>
      <div class="absolute left-0 top-0 bottom-0" style="width:14px;background:linear-gradient(#a9cabb,#e39f7d)"></div>
      <div class="absolute right-0 top-0 bottom-0" style="width:14px;background:linear-gradient(#e39f7d,#a9cabb)"></div>

      <div class="relative h-full flex flex-col items-center text-center" style="padding:62px 90px 50px">
        <div>${logoSVG(64)}</div>
        <div class="mt-6 text-[13px] font-bold tracking-[0.35em] text-jro-ink">TÍTULO PROPIO DEL CENTRO</div>
        <div class="mt-1 h-[3px] w-24" style="background:#efcd2f"></div>
        <p class="mt-6 text-[17px]">Formación Profesional José Ramón Otero certifica que</p>
        <div class="mt-3 text-[44px] font-extrabold leading-tight">${esc(a.nombre)}</div>
        <p class="mt-3 text-[16px] max-w-[820px] leading-relaxed">alumno/a de ${esc(a.curso)} curso del Ciclo Formativo de Grado Superior en <b>${esc(CICLOS[a.ciclo])}</b> (${esc(a.ciclo)}), ha superado con aprovechamiento el curso</p>
        <div class="mt-3 text-[24px] font-bold leading-snug max-w-[860px]">${esc(CURSO)}</div>
        <p class="mt-3 text-[15px]">con una duración de ${HORAS_CURSO} horas lectivas (12 sesiones) y la superación del Proyecto Final Integrador DAM + ASIR${typeof d.nota === "number" ? `, con una calificación media de <b>${d.nota}</b>` : ""}.</p>
        <div class="mt-4 flex gap-2 text-[11px] font-semibold">
          <span class="rounded-full px-3 py-1" style="background:#a9cabb">Skills y Claude Code</span>
          <span class="rounded-full px-3 py-1" style="background:#efcd2f">Servidores MCP</span>
          <span class="rounded-full px-3 py-1" style="background:#e39f7d">Ciberseguridad en LLMs</span>
        </div>

        <div class="mt-auto w-full flex items-end justify-between">
          <div class="text-left text-[12px] leading-relaxed">
            <div>Expedido el ${fecha(d.emitidoEn)}</div>
            <div>Código de verificación: <span class="mono font-semibold">${esc(d.codigo)}</span></div>
          </div>
          <div class="flex items-center justify-center rounded-full text-center" style="width:112px;height:112px;background:#efcd2f;border:4px double #111111">
            <div class="leading-tight"><div class="text-[11px] font-bold">CFP</div><div class="text-[15px] font-extrabold">JRO</div><div class="text-[10px] font-bold">IA · CLAUDE</div><div class="text-[10px]">${new Date(d.emitidoEn).getFullYear()}</div></div>
          </div>
          <div class="text-center text-[12px]">
            <div class="mb-1 text-[22px]" style="font-family:'Brush Script MT','Segoe Script',cursive">${esc(ADMIN_NOMBRE)}</div>
            <div class="border-t border-jro-ink pt-1 w-56">${esc(ADMIN_NOMBRE)}<br>Docente y Tutor responsable del curso</div>
          </div>
        </div>
      </div>
    </div>
    </div>
  </main>`;
}

/* =====================================================================
   MODALES
   ===================================================================== */
function abrirModal(titulo, cuerpo, acciones = "") {
  $("#modal-root").innerHTML = `<div class="fixed inset-0 z-40 bg-black/40 flex items-center justify-center p-4" data-action="cerrarmodal-fondo">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] overflow-y-auto shadow-xl" role="dialog" aria-modal="true">
      <div class="flex items-center justify-between px-5 py-3 border-b border-jro-line sticky top-0 bg-white">
        <h2 class="font-bold">${titulo}</h2>
        <button data-action="cerrarmodal" class="text-2xl leading-none text-jro-mute" aria-label="Cerrar">×</button>
      </div>
      <div class="p-5">${cuerpo}</div>
      ${acciones ? `<div class="px-5 pb-5 flex flex-wrap justify-end gap-2">${acciones}</div>` : ""}
    </div>
  </div>`;
}
function cerrarModal() { $("#modal-root").innerHTML = ""; }

function confirmar(titulo, texto, palabra, onOk) {
  abrirModal(titulo, `<p class="text-sm">${texto}</p>
    <label class="block mt-4 text-sm">Escribe <b>${palabra}</b> para confirmar
      <input id="confirm-input" class="mt-1 w-full rounded-lg border border-jro-line px-3 py-2"></label>`,
    `<button data-action="cerrarmodal" class="rounded-lg px-4 py-2 text-sm border border-jro-line">Cancelar</button>
     <button id="confirm-ok" class="rounded-lg px-4 py-2 text-sm font-semibold border-2 border-jro-terra bg-jro-terra">Confirmar</button>`);
  $("#confirm-ok").onclick = () => {
    if ($("#confirm-input").value.trim() !== palabra) { toast(`Escribe ${palabra} para confirmar`); return; }
    cerrarModal(); onOk();
  };
}

/* =====================================================================
   RENDER Y EVENTOS
   ===================================================================== */
function render() {
  const app = $("#app");
  if (!usuario()) { UI.userId = null; app.innerHTML = vistaAuth(); return; }
  if (UI.vista === "admin" && !esAdmin()) UI.vista = "curso";
  app.innerHTML = { curso: vistaCurso, perfil: vistaPerfil, admin: vistaAdmin, diploma: vistaDiploma }[UI.vista]();
}

function entrar(id) {
  UI.userId = id; recordarSesion(id);
  UI.vista = "curso"; UI.tab = "teoria";
  render(); window.scrollTo(0, 0);
}

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "cerrarmodal-fondo" && ev.target !== el) return;
  switch (a) {
    case "authtab": UI.authTab = el.dataset.tab; render(); break;
    case "demo": entrar(el.dataset.id); toast("Sesión de demostración iniciada"); break;
    case "salir": UI.userId = null; recordarSesion(null); UI.authTab = "login"; render(); break;
    case "privacidad": modalPrivacidad(); break;
    case "cerrarmodal": case "cerrarmodal-fondo": cerrarModal(); break;
    case "ir":
      UI.vista = el.dataset.vista;
      if (el.dataset.admintab) { UI.adminTab = el.dataset.admintab; UI.filtroEstado = "pendiente"; }
      render(); window.scrollTo(0, 0); break;
    case "sesion": UI.sesion = Number(el.dataset.n); UI.tab = "teoria"; render(); window.scrollTo(0, 0); break;
    case "tab": UI.tab = el.dataset.tab; render(); break;
    case "copiar": copiar($("#" + el.dataset.target).textContent); break;
    case "completar": {
      const u = usuario(), n = el.dataset.n;
      DB.progress[u.id] = DB.progress[u.id] || {};
      if (DB.progress[u.id][n]) delete DB.progress[u.id][n]; else DB.progress[u.id][n] = new Date().toISOString();
      guardar(); render(); break;
    }
    case "admintab": UI.adminTab = el.dataset.tab; render(); break;
    case "filtrociclo": UI.filtroCiclo = el.dataset.c; render(); break;
    case "filtroestado": UI.filtroEstado = el.dataset.e; render(); break;
    case "emitir": emitirTitulo(el.dataset.id); render(); break;
    case "revocar":
      confirmar("Revocar título", "El título dejará de ser válido y el alumno no podrá descargarlo.", "REVOCAR", () => {
        DB.diplomas = DB.diplomas.filter(d => d.id !== el.dataset.id); guardar(); render(); toast("Título revocado");
      }); break;
    case "verdiploma": UI.volverA = UI.vista === "diploma" ? UI.volverA : UI.vista; UI.diplomaId = el.dataset.id; UI.vista = "diploma"; render(); window.scrollTo(0, 0); break;
    case "imprimir": window.print(); break;
    case "exportar": exportarDatos(); toast("Datos exportados"); break;
    case "eliminar":
      confirmar("Eliminar mi cuenta", "Se borrarán de forma permanente tu perfil, tu progreso, tus entregas y tus títulos. Descarga antes tus datos si los necesitas.", "ELIMINAR", () => {
        eliminarUsuario(UI.userId); UI.userId = null; recordarSesion(null); render(); toast("Cuenta eliminada");
      }); break;
    case "borrarusuario": {
      const u = DB.users.find(x => x.id === el.dataset.id);
      confirmar("Eliminar usuario", `Se eliminarán todos los datos de ${esc(u.nombre)}.`, "ELIMINAR", () => { eliminarUsuario(u.id); render(); toast("Usuario eliminado"); });
      break;
    }
    case "resetpw": {
      const u = DB.users.find(x => x.id === el.dataset.id);
      u.pwHash = null; guardar(); toast("Contraseña restablecida"); break;
    }
  }
});

document.addEventListener("change", (ev) => {
  if (ev.target.matches("[data-action='selsesion']")) {
    UI.sesion = Number(ev.target.value); UI.tab = "teoria"; render();
  }
});

document.addEventListener("submit", async (ev) => {
  const f = ev.target.closest("form[data-form]");
  if (!f) return;
  ev.preventDefault();
  const datos = Object.fromEntries(new FormData(f).entries());
  const tipo = f.dataset.form;

  if (tipo === "login") {
    const email = (datos.email || "").trim().toLowerCase();
    const u = DB.users.find(x => x.email.toLowerCase() === email);
    if (!u) { toast("No existe ninguna cuenta con ese correo"); return; }
    if (!u.pwHash) {
      if ((datos.password || "").length < 8) { toast("Primer acceso: elige una contraseña de al menos 8 caracteres"); return; }
      u.pwHash = await hashPassword(datos.password, u.salt); guardar();
      toast("Contraseña establecida");
    } else if (await hashPassword(datos.password || "", u.salt) !== u.pwHash) {
      toast("Contraseña incorrecta"); return;
    }
    entrar(u.id);
  }

  if (tipo === "registro") {
    const err = (m) => { const e = $("#reg-error"); e.textContent = m; e.classList.remove("hidden"); };
    const email = (datos.email || "").trim().toLowerCase();
    const nombre = (datos.nombre || "").trim();
    if (nombre.length < 3) return err("Escribe tu nombre y apellidos.");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err("El correo no es válido.");
    if (!email.endsWith(DOMINIO) && (datos.codigo || "").trim() !== CODIGO_AULA) return err(`Usa tu correo ${DOMINIO} o el código de acceso de aula que te ha dado el profesor.`);
    if (DB.users.some(u => u.email.toLowerCase() === email)) return err("Ya existe una cuenta con ese correo.");
    if (!["DAM", "ASIR"].includes(datos.ciclo)) return err("Selecciona tu ciclo.");
    if (!["1º", "2º"].includes(datos.curso)) return err("Selecciona tu curso.");
    if ((datos.password || "").length < 8) return err("La contraseña debe tener al menos 8 caracteres.");
    if (datos.password !== datos.password2) return err("Las contraseñas no coinciden.");
    if (!datos.privacidad) return err("Debes aceptar la Política de Privacidad.");
    if (!datos.iaAct) return err("Debes aceptar el Compromiso de Seguridad y Normativa IA.");
    const ahora = new Date().toISOString();
    const salt = uid();
    const nuevo = { id: uid(), nombre, email, role: "alumno", ciclo: datos.ciclo, curso: datos.curso, salt, pwHash: await hashPassword(datos.password, salt), createdAt: ahora, consents: { privacidad: ahora, iaAct: ahora } };
    DB.users.push(nuevo); guardar();
    toast("Cuenta creada. ¡Bienvenido/a!");
    entrar(nuevo.id);
  }

  if (tipo === "entrega") {
    const n = Number(f.dataset.n);
    const enlace = (datos.enlace || "").trim();
    if (!esURL(enlace)) { toast("Indica un enlace que empiece por https://"); return; }
    if (!datos.limpio) { toast("Confirma que la entrega no contiene datos personales ni secretos"); return; }
    const u = usuario();
    let e = entrega(u.id, n);
    if (!e) { e = { id: uid(), userId: u.id, sesion: n }; DB.submissions.push(e); }
    Object.assign(e, { enlace, pareja: (datos.pareja || "").trim(), comentario: (datos.comentario || "").trim(), ts: new Date().toISOString(), estado: "pendiente" });
    guardar(); render(); toast("Entrega enviada al profesor");
  }

  if (tipo === "evaluar") {
    const s = DB.submissions.find(x => x.id === f.dataset.id);
    const decision = ev.submitter?.value || "revision";
    const nota = datos.nota === "" ? null : Math.max(0, Math.min(10, Number(datos.nota)));
    if (decision === "aprobada" && (nota === null || nota < 5)) { toast("Para aprobar, pon una nota de 5 o más"); return; }
    Object.assign(s, { estado: decision, nota, feedback: (datos.feedback || "").trim(), revisadoEn: new Date().toISOString(), revisadoPor: ADMIN_EMAIL });
    guardar(); render(); toast(decision === "aprobada" ? "Entrega aprobada" : "Se han solicitado cambios");
  }
});

document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") cerrarModal(); });

render();
</script>
