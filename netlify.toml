# ──────────────────────────────────────────────────────────────
# Configuración de despliegue en Netlify
#
# El plugin oficial de Next.js publica la app (estática) en la CDN.
# Recuerda declarar NEXT_PUBLIC_GOOGLE_MAPS_API_KEY en el panel de
# Netlify (Site settings → Environment variables) o con `npm run deploy`,
# que lo hace por ti.
# ──────────────────────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cabeceras de seguridad básicas (no interfieren con Google Maps
# ni con las fuentes de Google).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
