# ──────────────────────────────────────────────────────────────
# Despliegue en Netlify de la plataforma ASIR (carpeta asir-lms/).
#
# `base` hace que Netlify construya dentro de asir-lms/, instale allí las
# dependencias (Prisma, Next.js…) y publique esa app. La base de datos se
# inicializa sola en el primer acceso (asir-lms/src/lib/ensure-db.ts), así que
# el build no necesita conectar con Supabase.
#
# Nota: la app antigua "hipster-bingo" está en la raíz; este sitio ya no la
# construye. Si quisieras desplegar el bingo, hazlo en un sitio aparte sin base.
# ──────────────────────────────────────────────────────────────

[build]
  base = "asir-lms"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
