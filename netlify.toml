# ──────────────────────────────────────────────────────────────
# Rama clasecolaborativaFPOTERO → despliega ColaboraFP (Vite + React)
# La app vive en /colaborafp. (El proyecto Hipster Bingo sigue en su
# propia rama, claude/hipster-bingo-realtime-knkers, con su configuración.)
# ──────────────────────────────────────────────────────────────

[build]
  base = "colaborafp"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify detectó Next.js al crear el proyecto: evitamos que ejecute su plugin
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# SPA routing: todas las rutas del router las resuelve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.googleapis.com; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
