# Despliegue en Netlify.
# Rama de despliegue: circuitossea (el proyecto está en la raíz, sin Base directory).
# Las variables VITE_FIREBASE_* se definen en el panel de Netlify.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Las claves web de Firebase son públicas por diseño y acaban en el JavaScript del navegador:
  # se le dice al escáner de secretos de Netlify que no las trate como filtración.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Necesario para que funcione el inicio de sesión con la ventana emergente de Google
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
