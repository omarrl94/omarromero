# ──────────────────────────────────────────────────────────────
# Rama clasecolaborativaFPOTERO → despliega ColaboraFP (Vite + React)
# La app vive en /colaborafp. (El proyecto Hipster Bingo sigue en su
# propia rama, claude/hipster-bingo-realtime-knkers, con su configuración.)
# ──────────────────────────────────────────────────────────────

[build]
  base = "colaborafp"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify detectó Next.js al crear el proyecto: evitamos que ejecute su plugin
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# SPA routing: todas las rutas del router las resuelve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
