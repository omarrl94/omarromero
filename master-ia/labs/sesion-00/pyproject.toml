[project]
name = "mia-sesion-00"
version = "1.0.0"
description = "Máster IA · FP José Ramón Otero · Sesión 0: entorno, primer modelo y primer LLM"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "openai>=1.50",
    "anthropic>=0.70",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
