# Servidor estático para la plataforma del máster (imagen Docker o servidor del centro).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Cabeceras de seguridad (la CSP con hashes la genera el build en dist/nginx-headers.conf)
    include /etc/nginx/snippets/master-ia-headers.conf;

    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/snippets/master-ia-headers.conf;
    }

    location / {
        try_files $uri /index.html;
    }
}
