"""Sesión 0 · Tu primer modelo de machine learning.

Ciclo completo: datos -> entrenamiento -> evaluación -> inferencia.
Ejecuta: uv run python primer_modelo.py
"""

from sklearn.model_selection import train_test_split
from sklearn.tree import DecisionTreeClassifier, export_text

from datos_sinteticos import generar_alumnado


def entrenar(semilla: int = 42) -> tuple[DecisionTreeClassifier, float, list[str]]:
    X, y, columnas = generar_alumnado(n=1000, semilla=semilla)       # datos + resultado esperado
    X_train, X_test, y_train, y_test = train_test_split(
        X, y, test_size=0.25, random_state=semilla, stratify=y)

    modelo = DecisionTreeClassifier(max_depth=3, random_state=semilla)  # el modelo
    modelo.fit(X_train, y_train)                                       # entrenamiento
    return modelo, modelo.score(X_test, y_test), columnas              # evaluación con datos no vistos


if __name__ == "__main__":
    modelo, exactitud, columnas = entrenar()
    print(f"Exactitud con datos nunca vistos: {exactitud:.1%}")
    print("\nReglas aprendidas (¡no las hemos escrito nosotros!):")
    print(export_text(modelo, feature_names=columnas))

    nueva = [[7.5, 2, 10, 1]]  # nota 7,5 · 2 faltas · 10 h de estudio · trabaja
    print("Alumno nuevo -> ¿promociona?", "sí" if modelo.predict(nueva)[0] == 1 else "no")
    print(f"Probabilidad estimada: {modelo.predict_proba(nueva)[0][1]:.0%}")

import java.net.URI;
import java.net.http.HttpClient;
import java.net.http.HttpRequest;
import java.net.http.HttpResponse;
import java.time.Duration;

/**
 * Sesión 0 · Primera llamada a un LLM local (Ollama) desde Java 21, sin dependencias.
 * Ejecuta: java HolaIA.java "tu pregunta"
 */
public class HolaIA {

    record Peticion(String modelo, String sistema, String pregunta) {
        String json() {
            return """
                {"model": "%s", "stream": false, "messages": [
                  {"role": "system", "content": "%s"},
                  {"role": "user", "content": "%s"}]}
                """.formatted(escapar(modelo), escapar(sistema), escapar(pregunta));
        }
    }

    static String escapar(String s) {
        return s.replace("\\", "\\\\").replace("\"", "\\\"").replace("\n", "\\n");
    }

    /** Extrae el texto de "message.content" de la respuesta de /api/chat (en M3 usaremos Jackson). */
    static String contenido(String json) {
        int clave = json.indexOf("\"content\"");
        if (clave < 0) throw new IllegalStateException("Respuesta inesperada: " + json);
        int i = json.indexOf('"', json.indexOf(':', clave) + 1) + 1;
        var sb = new StringBuilder();
        for (; i < json.length() && json.charAt(i) != '"'; i++) {
            char c = json.charAt(i);
            if (c != '\\') { sb.append(c); continue; }
            char e = json.charAt(++i);
            switch (e) {
                case 'n' -> sb.append('\n');
                case 't' -> sb.append('\t');
                case 'u' -> { sb.append((char) Integer.parseInt(json.substring(i + 1, i + 5), 16)); i += 4; }
                default -> sb.append(e);      // \" \\ \/
            }
        }
        return sb.toString();
    }

    public static void main(String[] args) throws Exception {
        var url = System.getenv().getOrDefault("OLLAMA_URL", "http://localhost:11434") + "/api/chat";
        var modelo = System.getenv().getOrDefault("MODELO_LOCAL", "qwen2.5:1.5b");
        var peticion = new Peticion(modelo, "Eres un tutor de IA. Responde en español en 3 frases.",
                args.length > 0 ? String.join(" ", args) : "¿Qué diferencia hay entre entrenamiento e inferencia?");

        try (var http = HttpClient.newBuilder().connectTimeout(Duration.ofSeconds(5)).build()) {
            var req = HttpRequest.newBuilder(URI.create(url))
                    .timeout(Duration.ofMinutes(2))
                    .header("Content-Type", "application/json")
                    .POST(HttpRequest.BodyPublishers.ofString(peticion.json()))
                    .build();
            long inicio = System.nanoTime();
            var resp = http.send(req, HttpResponse.BodyHandlers.ofString());
            if (resp.statusCode() != 200) {
                System.err.println("Ollama respondió " + resp.statusCode() + ": " + resp.body());
                System.exit(1);
            }
            System.out.println(contenido(resp.body()));
            System.out.printf("%n[%s] %.1f s%n", modelo, (System.nanoTime() - inicio) / 1e9);
        } catch (java.net.ConnectException e) {
            System.err.println("No hay conexión con Ollama en " + url + ". ¿Está arrancado?");
            System.exit(1);
        }
    }
}

import time
import numpy as np

rng = np.random.default_rng(42)
docs = rng.standard_normal((50_000, 384), dtype=np.float32)   # 50k embeddings
consulta = rng.standard_normal(384, dtype=np.float32)


def coseno_bucle(docs, q):
    res = []
    for d in docs:                                   # estilo "Java clásico"
        num = sum(a * b for a, b in zip(d, q))
        den = (sum(a * a for a in d) ** 0.5) * (sum(b * b for b in q) ** 0.5)
        res.append(num / den)
    return res


def coseno_vectorizado(docs, q):
    docs_n = docs / np.linalg.norm(docs, axis=1, keepdims=True)  # broadcasting
    q_n = q / np.linalg.norm(q)
    return docs_n @ q_n                               # un único matmul


t0 = time.perf_counter(); coseno_bucle(docs[:2000], consulta); t1 = time.perf_counter()
sims = coseno_vectorizado(docs, consulta); t2 = time.perf_counter()
print(f"Bucle (2k docs): {t1-t0:.2f}s | Vectorizado (50k docs): {t2-t1:.4f}s")
print("Top-5 documentos:", np.argsort(-sims)[:5])`

BYTES = {"fp32": 4, "bf16": 2, "fp16": 2, "int8": 1, "int4": 0.5}


def vram_gb(params_b: float, dtype: str = "bf16", capas: int = 32, hidden: int = 4096,
            contexto: int = 8192, lote: int = 1, kv_heads_ratio: float = 0.25) -> dict:
    """Pesos + caché KV (2 tensores K y V por capa) + 20 % de sobrecoste de activaciones."""
    pesos = params_b * 1e9 * BYTES[dtype]
    kv = 2 * capas * hidden * kv_heads_ratio * contexto * lote * 2  # caché KV en bf16, con GQA
    total = (pesos + kv) * 1.2
    return {"pesos_gb": round(pesos / 1e9, 1), "kv_gb": round(kv / 1e9, 1), "total_gb": round(total / 1e9, 1)}


for dt in ("bf16", "int8", "int4"):
    print(dt, vram_gb(8, dt))`

public class GestorPrestamos {
    static final int MAX_PRESTAMOS = 3;
    static final Duration PLAZO = Duration.ofDays(15);

    public enum Resultado { OK, PRESTADO, LIMITE, ERROR }   // toString() conserva los textos

    private final List<Prestamo> prestamos = new ArrayList<>();
    private final Clock reloj;

    public GestorPrestamos(Clock reloj) { this.reloj = reloj; }   // testeable: el tiempo se inyecta
    public GestorPrestamos() { this(Clock.systemDefaultZone()); }

    public String prestar(Libro libro, Socio socio) {
        return evaluar(libro, socio).name();
    }

    private Resultado evaluar(Libro libro, Socio socio) {
        if (libro == null || socio == null) return Resultado.ERROR;
        if (libro.estaPrestado()) return Resultado.PRESTADO;
        if (socio.getPrestamos() >= MAX_PRESTAMOS) return Resultado.LIMITE;
        var ahora = Instant.now(reloj);
        prestamos.add(new Prestamo(libro, socio, ahora, ahora.plus(PLAZO)));   // Prestamo es un record
        libro.marcarPrestado();
        socio.incrementarPrestamos();
        return Resultado.OK;
    }
}`

import math
import torch
from torch import nn
from torch.utils.data import DataLoader, random_split
from torch.utils.tensorboard import SummaryWriter
from torchvision import datasets, transforms
from modelo import ClasificadorMLP

torch.manual_seed(42)
device = "cuda" if torch.cuda.is_available() else "mps" if torch.backends.mps.is_available() else "cpu"

tf = transforms.Compose([transforms.ToTensor(), transforms.Normalize((0.1307,), (0.3081,))])
completo = datasets.MNIST("data", train=True, download=True, transform=tf)
train_ds, val_ds = random_split(completo, [54_000, 6_000])
train_dl = DataLoader(train_ds, batch_size=128, shuffle=True, num_workers=2)
val_dl = DataLoader(val_ds, batch_size=512)

modelo = ClasificadorMLP().to(device)
criterio = nn.CrossEntropyLoss(label_smoothing=0.05)
opt = torch.optim.AdamW(modelo.parameters(), lr=3e-3, weight_decay=0.01)
EPOCAS, WARMUP = 15, 200
total_pasos = EPOCAS * len(train_dl)
sched = torch.optim.lr_scheduler.LambdaLR(opt, lambda p: min(1.0, (p + 1) / WARMUP)
                                          * 0.5 * (1 + math.cos(math.pi * p / total_pasos)))
log = SummaryWriter("runs/mlp")
mejor, paciencia = float("inf"), 0

for epoca in range(EPOCAS):
    modelo.train()
    for xb, yb in train_dl:
        xb, yb = xb.to(device), yb.to(device)
        loss = criterio(modelo(xb), yb)
        opt.zero_grad(set_to_none=True)
        loss.backward()
        torch.nn.utils.clip_grad_norm_(modelo.parameters(), 1.0)
        opt.step(); sched.step()

    modelo.eval(); val_loss, aciertos = 0.0, 0
    with torch.inference_mode():
        for xb, yb in val_dl:
            xb, yb = xb.to(device), yb.to(device)
            logits = modelo(xb)
            val_loss += criterio(logits, yb).item() * len(xb)
            aciertos += (logits.argmax(1) == yb).sum().item()
    val_loss /= len(val_ds); acc = aciertos / len(val_ds)
    log.add_scalars("loss", {"val": val_loss, "train": loss.item()}, epoca)
    print(f"época {epoca:02d} | val_loss {val_loss:.4f} | acc {acc:.4f}")

    if val_loss < mejor:
        mejor, paciencia = val_loss, 0
        torch.save(modelo.state_dict(), "mejor_modelo.pt")
    else:
        paciencia += 1
        if paciencia >= 3:
            print("Early stopping"); break`

modelo = modelo.to(device)

opt = torch.optim.AdamW(modelo.fc.parameters(), lr=1e-3)
criterio = nn.CrossEntropyLoss()
mejor = 0.0

    for x, y in train_dl:

    print(f"época {epoca} · exactitud validación {acc:.3f}")

import io
from contextlib import asynccontextmanager
import torch
from fastapi import FastAPI, File, HTTPException, UploadFile
from PIL import Image
from torch import nn
from torchvision.models import resnet18
from datos import tf_eval

estado: dict = {}


@asynccontextmanager
async def lifespan(app: FastAPI):
    ckpt = torch.load("modelo_productos.pt", map_location="cpu")
    m = resnet18()
    m.fc = nn.Linear(m.fc.in_features, len(ckpt["clases"]))
    m.load_state_dict(ckpt["estado"]); m.eval()
    estado.update(modelo=m, clases=ckpt["clases"])
    yield


app = FastAPI(title="Clasificador de productos", version="1.0.0", lifespan=lifespan)


@app.post("/clasificar")
async def clasificar(imagen: UploadFile = File(...)):
    if imagen.content_type not in {"image/jpeg", "image/png", "image/webp"}:
        raise HTTPException(415, "Formato no soportado")
    datos = await imagen.read()
    if len(datos) > 5_000_000:
        raise HTTPException(413, "Imagen demasiado grande (máx. 5 MB)")
    x = tf_eval(Image.open(io.BytesIO(datos)).convert("RGB")).unsqueeze(0)
    with torch.inference_mode():
        prob = torch.softmax(estado["modelo"](x), dim=1)[0]
    top = prob.topk(3)
    return {"predicciones": [{"clase": estado["clases"][i], "probabilidad": round(p.item(), 4)}
                             for p, i in zip(top.values, top.indices)]}


@app.get("/health")
def health():
    return {"ok": "modelo" in estado}`

import json
import anthropic
from fastapi import FastAPI
from pydantic import BaseModel
from sse_starlette.sse import EventSourceResponse

app = FastAPI(title="Pasarela LLM · Máster IA JRO")
claude = anthropic.AsyncAnthropic()


class Peticion(BaseModel):
    mensajes: list[dict]
    esfuerzo: str = "low"


@app.post("/chat")
async def chat(p: Peticion):
    async def eventos():
        async with claude.messages.stream(
            model="claude-opus-5-5",
            max_tokens=64000,
            system="Eres el asistente del Máster de IA del CFP José Ramón Otero.",
            output_config={"effort": p.esfuerzo},
            messages=p.mensajes,
        ) as stream:
            async for texto in stream.text_stream:
                yield {"event": "delta", "data": json.dumps({"t": texto})}
            final = await stream.get_final_message()
            yield {"event": "fin", "data": json.dumps({
                "stop_reason": final.stop_reason,
                "entrada": final.usage.input_tokens, "salida": final.usage.output_tokens})}

    return EventSourceResponse(eventos())`

import psycopg
from pydantic import BaseModel, Field

DSN = "postgresql://lector:lector@localhost:5432/postgres"


class BuscarModulos(BaseModel):
    ciclo: str = Field(pattern="^(DAM|DAW|ASIR|SMR)$")
    curso: int = Field(ge=1, le=2)


class PlazasFct(BaseModel):
    ciclo: str = Field(pattern="^(DAM|DAW|ASIR|SMR)$")
    desde: date


def buscar_modulos(args: BuscarModulos) -> list[dict]:
    with psycopg.connect(DSN, options="-c statement_timeout=3000") as con:

            (args.ciclo, args.curso)).fetchall()
    return [{"codigo": c, "nombre": n, "horas": h} for c, n, h in filas]

import json
import anthropic
from pydantic import ValidationError
from herramientas import TOOLS, EJECUTORES

client = anthropic.Anthropic()


def responder(pregunta: str, max_iter: int = 6) -> str:
    mensajes = [{"role": "user", "content": pregunta}]
    for _ in range(max_iter):
        r = client.messages.create(model="claude-opus-5-5", max_tokens=8000, tools=TOOLS,
                                   system="Responde usando solo datos obtenidos con las herramientas.",
                                   messages=mensajes)
        mensajes.append({"role": "assistant", "content": r.content})
        if r.stop_reason != "tool_use":
            return "".join(b.text for b in r.content if b.type == "text")

        resultados = []
        for b in r.content:
            if b.type != "tool_use":
                continue
            Modelo, funcion = EJECUTORES[b.name]
            try:
                salida = funcion(Modelo.model_validate(b.input))
                resultados.append({"type": "tool_result", "tool_use_id": b.id,
                                   "content": json.dumps(salida, ensure_ascii=False)})
            except (ValidationError, Exception) as e:   # el modelo verá el error y podrá corregir
                resultados.append({"type": "tool_result", "tool_use_id": b.id,
                                   "content": f"Error: {e}", "is_error": True})
        mensajes.append({"role": "user", "content": resultados})   # todos los resultados en un único mensaje
    return "No se pudo completar la consulta en el número máximo de pasos."

import org.springframework.ai.chat.client.ChatClient;
import org.springframework.ai.chat.client.advisor.MessageChatMemoryAdvisor;
import org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor;
import org.springframework.ai.chat.memory.ChatMemory;
import org.springframework.ai.chat.memory.MessageWindowChatMemory;
import org.springframework.stereotype.Service;
import reactor.core.publisher.Flux;

@Service
public class TutorService {

    public TutorService(ChatClient.Builder builder) {

        this.chat = builder
                .defaultSystem("""

                        El alumnado son titulados DAM. Responde en español con ejemplos en Java 21.
                        """)
                .defaultAdvisors(MessageChatMemoryAdvisor.builder(memoria).build(), new SimpleLoggerAdvisor())
                .build();
    }

                .user(pregunta)
                .advisors(a -> a.param(ChatMemory.CONVERSATION_ID, conversacionId))
                .call()
                .content();
    }

        return chat.prompt()
                .user(pregunta)
                .advisors(a -> a.param(ChatMemory.CONVERSATION_ID, conversacionId))
                .stream()
                .content();
    }

import hashlib
import re
from dataclasses import dataclass
from docling.document_converter import DocumentConverter
import tiktoken

enc = tiktoken.get_encoding("o200k_base")


@dataclass
class Fragmento:
    doc: str
    seccion: str
    texto: str
    hash: str


def a_markdown(ruta: str) -> str:
    return DocumentConverter().convert(ruta).document.export_to_markdown()


def trocear(md: str, doc: str, max_tokens: int = 400, solape: int = 50) -> list[Fragmento]:
    fragmentos, seccion = [], "Introducción"
    for bloque in re.split(r"\n(?=#{1,3} )", md):              # 1.º por títulos
        titulo = re.match(r"#{1,3} (.+)", bloque)
        if titulo:
            seccion = titulo.group(1).strip()
        tokens = enc.encode(bloque)
        paso = max_tokens - solape
        for i in range(0, max(len(tokens), 1), paso):          # 2.º ventana con solape
            texto = enc.decode(tokens[i:i + max_tokens]).strip()
            if len(texto) > 40:
                h = hashlib.sha256(texto.encode()).hexdigest()[:16]
                fragmentos.append(Fragmento(doc, seccion, f"[{seccion}] {texto}", h))
    return fragmentos`

import numpy as np
import psycopg
from pgvector.psycopg import register_vector
from sentence_transformers import SentenceTransformer
from ingesta import a_markdown, trocear

modelo = SentenceTransformer("BAAI/bge-m3")            # 1024 dimensiones, multilingüe
con = psycopg.connect("postgresql://postgres:mia@localhost:5432/rag", autocommit=True)
register_vector(con)
con.execute(open("sql/schema.sql").read())


def indexar(ruta: str, ciclo: str):
    frags = trocear(a_markdown(ruta), doc=ruta)
    vecs = modelo.encode([f.texto for f in frags], normalize_embeddings=True, batch_size=32)
    with con.cursor() as cur:
        cur.executemany(
            """INSERT INTO fragmentos (doc, seccion, contenido, hash, ciclo, embedding)
               VALUES (%s, %s, %s, %s, %s, %s) ON CONFLICT (hash) DO NOTHING""",
            [(f.doc, f.seccion, f.texto, f.hash, ciclo, v) for f, v in zip(frags, vecs)])
    print(f"{len(frags)} fragmentos procesados de {ruta}")


def buscar(pregunta: str, ciclo: str | None = None, k: int = 5):
    q = modelo.encode(pregunta, normalize_embeddings=True)
    con.execute("SET hnsw.ef_search = 80")
    return con.execute(
        """SELECT doc, seccion, contenido, 1 - (embedding <=> %s) AS similitud
           FROM fragmentos WHERE (%s::text IS NULL OR ciclo = %s)
           ORDER BY embedding <=> %s LIMIT %s""",
        (q, ciclo, ciclo, q, k)).fetchall()

import re
import unicodedata
from rank_bm25 import BM25Okapi
from sentence_transformers import SentenceTransformer
import numpy as np

STOP = set("de la el en y a los las del un una que con por para se es al lo como su".split())


def normalizar(t: str) -> list[str]:
    t = unicodedata.normalize("NFKD", t.lower()).encode("ascii", "ignore").decode()
    return [w for w in re.findall(r"[a-z0-9/.-]+", t) if w not in STOP]


class Hibrido:
    def __init__(self, fragmentos: list[dict]):
        self.frags = fragmentos
        self.bm25 = BM25Okapi([normalizar(f["texto"]) for f in fragmentos])
        self.emb = SentenceTransformer("BAAI/bge-m3")
        self.mat = self.emb.encode([f["texto"] for f in fragmentos], normalize_embeddings=True)

    def bm25_top(self, q: str, k: int = 50) -> list[int]:
        return list(np.argsort(-self.bm25.get_scores(normalizar(q)))[:k])

    def denso_top(self, q: str, k: int = 50) -> list[int]:
        return list(np.argsort(-(self.mat @ self.emb.encode(q, normalize_embeddings=True)))[:k])

    @staticmethod
    def rrf(*rankings: list[int], k: int = 60) -> list[int]:
        puntos: dict[int, float] = {}
        for ranking in rankings:
            for rango, idx in enumerate(ranking):
                puntos[idx] = puntos.get(idx, 0) + 1 / (k + rango + 1)
        return sorted(puntos, key=puntos.get, reverse=True)

    def buscar(self, q: str, k: int = 50) -> list[int]:
        return self.rrf(self.bm25_top(q, k), self.denso_top(q, k))[:k]`

from sentence_transformers import CrossEncoder

reranker = CrossEncoder("BAAI/bge-reranker-v2-m3", max_length=512)


def reordenar(pregunta: str, candidatos: list[dict], top: int = 6) -> list[dict]:
    puntuaciones = reranker.predict([(pregunta, c["texto"]) for c in candidatos], batch_size=16)
    orden = sorted(zip(candidatos, puntuaciones), key=lambda x: x[1], reverse=True)
    return [dict(c, score=float(s)) for c, s in orden[:top]]`

import re
import anthropic
from recuperadores import Hibrido
from rerank import reordenar

client = anthropic.Anthropic()
SISTEMA = """Respondes preguntas sobre normativa de FP usando SOLO los fragmentos numerados.
Cada afirmación debe terminar con su cita [n]. Si la información no está en los fragmentos,
responde exactamente: "No consta en la documentación disponible." No uses conocimiento externo."""


def responder(h: Hibrido, pregunta: str) -> dict:
    candidatos = [h.frags[i] for i in h.buscar(pregunta, 40)]
    contexto = reordenar(pregunta, candidatos, top=6)
    bloques = "\n\n".join(f"[{i+1}] ({c['doc']} · {c['seccion']})\n{c['texto']}" for i, c in enumerate(contexto))
    r = client.messages.create(
        model="claude-opus-5-5", max_tokens=3000, system=SISTEMA,
        messages=[{"role": "user", "content": f"<fragmentos>\n{bloques}\n</fragmentos>\n\nPregunta: {pregunta}"}],
    )
    texto = r.content[0].text
    citas = {int(n) for n in re.findall(r"\[(\d+)\]", texto)}
    invalidas = sorted(n for n in citas if not 1 <= n <= len(contexto))
    return {"respuesta": texto, "fuentes": [contexto[n - 1] | {"n": n} for n in sorted(citas - set(invalidas))],
            "citas_invalidas": invalidas, "sin_respuesta": texto.startswith("No consta")}`

ALTER TABLE fragmentos ADD COLUMN IF NOT EXISTS tsv tsvector
    GENERATED ALWAYS AS (to_tsvector('spanish', contenido)) STORED;
CREATE INDEX IF NOT EXISTS fragmentos_tsv ON fragmentos USING gin (tsv);

-- :q_texto y :q_vector son parámetros de la aplicación
WITH lexica AS (
    SELECT id, row_number() OVER (ORDER BY ts_rank_cd(tsv, websearch_to_tsquery('spanish', :q_texto)) DESC) AS r
    FROM fragmentos WHERE tsv @@ websearch_to_tsquery('spanish', :q_texto) LIMIT 50
), densa AS (
    SELECT id, row_number() OVER (ORDER BY embedding <=> :q_vector) AS r
    FROM fragmentos ORDER BY embedding <=> :q_vector LIMIT 50
)
SELECT f.id, f.doc, f.seccion, f.contenido,
       COALESCE(1.0 / (60 + l.r), 0) + COALESCE(1.0 / (60 + d.r), 0) AS rrf
FROM fragmentos f
LEFT JOIN lexica l ON l.id = f.id
LEFT JOIN densa d ON d.id = f.id
WHERE l.id IS NOT NULL OR d.id IS NOT NULL
ORDER BY rrf DESC LIMIT 20;`

import json
import sqlite3
import numpy as np
from sentence_transformers import SentenceTransformer

_emb = SentenceTransformer("intfloat/multilingual-e5-small")


class MemoriaLargoPlazo:
    def __init__(self, ruta: str = "memoria.db"):
        self.db = sqlite3.connect(ruta)
        self.db.execute("CREATE TABLE IF NOT EXISTS recuerdos (id INTEGER PRIMARY KEY, usuario TEXT, texto TEXT, vec TEXT, creado TEXT DEFAULT CURRENT_TIMESTAMP)")

    def guardar(self, usuario: str, texto: str) -> str:
        v = _emb.encode("passage: " + texto, normalize_embeddings=True).tolist()
        self.db.execute("INSERT INTO recuerdos (usuario, texto, vec) VALUES (?, ?, ?)", (usuario, texto, json.dumps(v)))
        self.db.commit()
        return "Guardado."

    def buscar(self, usuario: str, consulta: str, k: int = 3) -> list[str]:
        filas = self.db.execute("SELECT texto, vec FROM recuerdos WHERE usuario = ?", (usuario,)).fetchall()
        if not filas:
            return []
        q = _emb.encode("query: " + consulta, normalize_embeddings=True)
        sims = np.array([json.loads(v) for _, v in filas]) @ q
        return [filas[i][0] for i in np.argsort(-sims)[:k] if sims[i] > 0.75]

    def olvidar_usuario(self, usuario: str):          # derecho de supresión
        self.db.execute("DELETE FROM recuerdos WHERE usuario = ?", (usuario,)); self.db.commit()`

import json
import anthropic
from memoria import MemoriaLargoPlazo

client = anthropic.Anthropic()
mem = MemoriaLargoPlazo()

TOOLS = [
    {"name": "recordar", "description": "Busca hechos guardados sobre el alumno (preferencias, dificultades, objetivos).",
     "input_schema": {"type": "object", "properties": {"consulta": {"type": "string"}}, "required": ["consulta"]}},
    {"name": "memorizar", "description": "Guarda un hecho duradero y útil sobre el alumno. No guardes datos sensibles (salud, ideología).",
     "input_schema": {"type": "object", "properties": {"hecho": {"type": "string"}}, "required": ["hecho"]}},
    {"name": "ejecutar_python", "description": "Ejecuta un fragmento de Python en sandbox y devuelve stdout (máx. 10 s).",
     "input_schema": {"type": "object", "properties": {"codigo": {"type": "string"}}, "required": ["codigo"]}},
]


def ejecutar(nombre: str, args: dict, usuario: str) -> str:
    if nombre == "recordar":
        return json.dumps(mem.buscar(usuario, args["consulta"]), ensure_ascii=False) or "[]"
    if nombre == "memorizar":
        return mem.guardar(usuario, args["hecho"])
    if nombre == "ejecutar_python":
        from sandbox import ejecutar_en_docker          # semana 10: contenedor sin red
        return ejecutar_en_docker(args["codigo"])
    return f"Herramienta desconocida: {nombre}"


def agente(usuario: str, objetivo: str, max_pasos: int = 10) -> str:
    mensajes = [{"role": "user", "content": objetivo}]
    for paso in range(max_pasos):
        r = client.messages.create(
            model="claude-opus-5-5", max_tokens=8000, tools=TOOLS,
            system="Eres un tutor de programación con memoria. Consulta la memoria al empezar; "
                   "guarda solo hechos útiles para futuras sesiones. Verifica tus ejemplos ejecutándolos.",
            messages=mensajes)
        mensajes.append({"role": "assistant", "content": r.content})
        print(f"[paso {paso}] stop={r.stop_reason} tokens_salida={r.usage.output_tokens}")
        if r.stop_reason != "tool_use":
            return "".join(b.text for b in r.content if b.type == "text")
        mensajes.append({"role": "user", "content": [
            {"type": "tool_result", "tool_use_id": b.id, "content": ejecutar(b.name, b.input, usuario)}
            for b in r.content if b.type == "tool_use"]})
    return "Límite de pasos alcanzado."`

import anthropic
from pydantic import BaseModel, Field

client = anthropic.Anthropic()


class Paso(BaseModel):
    numero: int
    accion: str
    criterio_exito: str = Field(description="Cómo sabremos que el paso está completado")

import org.springframework.ai.tool.annotation.Tool;

    }

def ejecutar_en_docker(codigo: str, timeout: int = 10) -> str:

import ai.onnxruntime.OnnxTensor
import ai.onnxruntime.OrtEnvironment
import ai.onnxruntime.OrtSession
import android.content.Context
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.withContext
import java.nio.LongBuffer

class ClasificadorDudas(context: Context, private val tokenizer: WordPieceTokenizer) : AutoCloseable {
    private val env = OrtEnvironment.getEnvironment()
    private val sesion: OrtSession = env.createSession(
        context.assets.open("model_int8.onnx").readBytes(),
        OrtSession.SessionOptions().apply { addNnapi() }      // aceleración si está disponible
    )
    private val etiquetas = listOf("Acceso a Datos", "PMDM", "PSP", "Interfaces", "Otros")

    suspend fun clasificar(texto: String): Pair<String, Float> = withContext(Dispatchers.Default) {
        val ids = tokenizer.encode(texto, maxLen = 128)          // LongArray con [CLS] ... [SEP] + padding
        val mascara = LongArray(ids.size) { if (ids[it] != 0L) 1L else 0L }
        val forma = longArrayOf(1, ids.size.toLong())
        OnnxTensor.createTensor(env, LongBuffer.wrap(ids), forma).use { tIds ->
            OnnxTensor.createTensor(env, LongBuffer.wrap(mascara), forma).use { tMask ->
                sesion.run(mapOf("input_ids" to tIds, "attention_mask" to tMask)).use { r ->
                    @Suppress("UNCHECKED_CAST")
                    val logits = (r[0].value as Array<FloatArray>)[0]
                    val exp = logits.map { kotlin.math.exp(it.toDouble()) }
                    val i = logits.indices.maxBy { logits[it] }
                    etiquetas[i] to (exp[i] / exp.sum()).toFloat()
                }
            }
        }
    }

    override fun close() { sesion.close() }
}`

class AsistenteRepository(private val http: OkHttpClient, private val baseUrl: String, private val token: () -> String) {

    fun preguntar(texto: String): Flow<String> = flow {
        val cuerpo = """{"mensajes":[{"role":"user","content":\${JSONObject.quote(texto)}}]}"""
            .toRequestBody("application/json".toMediaType())
        val peticion = Request.Builder()
            .url("$baseUrl/chat")
            .header("Authorization", "Bearer " + token())        // token de TU backend, nunca la clave del proveedor
            .post(cuerpo).build()
        http.newCall(peticion).execute().use { resp ->
            if (!resp.isSuccessful) throw IOException("Error " + resp.code)
            val fuente = resp.body!!.source()
            while (!fuente.exhausted()) {
                val linea = fuente.readUtf8Line() ?: break
                if (linea.startsWith("data:")) {
                    val dato = JSONObject(linea.removePrefix("data:").trim())
                    if (dato.has("t")) emit(dato.getString("t"))
                }
            }
        }
    }.flowOn(Dispatchers.IO)
}`

@app.websocket("/voz")
async def voz(ws: WebSocket):
    await ws.accept()
    historial: list[dict] = []
    try:
        while True:
            audio = await ws.receive_bytes()                     # un turno completo (push-to-talk)
            with tempfile.NamedTemporaryFile(suffix=".webm", delete=False) as f:
                f.write(audio)
            texto = await asyncio.to_thread(transcribir, f.name)
            await ws.send_text(json.dumps({"tipo": "transcripcion", "texto": texto}))
            historial.append({"role": "user", "content": texto})

            async with claude.messages.stream(model="claude-haiku-5-5", max_tokens=600, system=SISTEMA,
                                              output_config={"effort": "low"}, messages=historial) as s:
                async for delta in s.text_stream:

                    *frases, pendiente = FIN_FRASE.split(pendiente)
                    for frase in frases:                         # habla en cuanto hay una frase completa
                        await ws.send_text(json.dumps({"tipo": "texto", "texto": frase}))

            if pendiente.strip():

            historial.append({"role": "assistant", "content": respuesta})
            await ws.send_text(json.dumps({"tipo": "fin"}))

import hashlib
from langfuse import get_client, observe
from recuperadores import Hibrido
from rerank import reordenar
from responder import client, SISTEMA

langfuse = get_client()


def seudonimo(usuario: str) -> str:
    return hashlib.sha256(("sal-jro-" + usuario).encode()).hexdigest()[:12]


@observe(name="recuperacion")
def recuperar(h: Hibrido, pregunta: str):
    return reordenar(pregunta, [h.frags[i] for i in h.buscar(pregunta, 40)], top=6)


@observe(name="generacion", as_type="generation")
def generar(pregunta: str, contexto: list[dict]) -> str:
    bloques = "\n\n".join(f"[{i+1}] {c['texto']}" for i, c in enumerate(contexto))

import java.util.regex.Matcher;
import java.util.regex.Pattern;
import org.springframework.stereotype.Component;

@Component
public class EnmascaradorPii {
    private static final Pattern DNI = Pattern.compile("\\b([XYZ]?\\d{7,8})([A-Z])\\b");
    private static final Pattern EMAIL = Pattern.compile("[\\w.+-]+@[\\w-]+\\.[\\w.]+");
    private static final String LETRAS = "TRWAGMYFPDXBNJZSQVHLCKE";

    public String enmascarar(String texto) {
        Matcher m = DNI.matcher(texto);
        StringBuilder sb = new StringBuilder();
        while (m.find()) {
            String num = m.group(1).replace('X', '0').replace('Y', '1').replace('Z', '2');
            boolean valido = LETRAS.charAt((int) (Long.parseLong(num) % 23)) == m.group(2).charAt(0);
            m.appendReplacement(sb, valido ? "<DNI>" : m.group());
        }
        m.appendTail(sb);
        return EMAIL.matcher(sb.toString()).replaceAll("<EMAIL>");
    }
}

import numpy as np
import pandas as pd
from fairlearn.metrics import MetricFrame, demographic_parity_difference, selection_rate
from sklearn.metrics import accuracy_score, recall_score
from sklearn.model_selection import train_test_split
from xgboost import XGBClassifier

rng = np.random.default_rng(3)
n = 4000
df = pd.DataFrame({
    "nota": rng.normal(6.5, 1.5, n).clip(0, 10),
    "renta_tramo": rng.integers(1, 6, n),
    "turno": rng.choice(["mañana", "tarde"], n, p=[0.7, 0.3]),
})
# Etiquetas históricas sesgadas: al turno de tarde se le concedía menos a igual mérito
merito = 0.9 * (df.nota - 6) - 0.4 * (df.renta_tramo - 3)
df["concedida"] = (merito - 0.6 * (df.turno == "tarde") + rng.normal(0, 0.7, n) > 0).astype(int)

X = pd.get_dummies(df[["nota", "renta_tramo", "turno"]], dtype=float)
X_tr, X_te, y_tr, y_te, g_tr, g_te = train_test_split(X, df.concedida, df.turno, test_size=0.3, random_state=3)
modelo = XGBClassifier(n_estimators=200, max_depth=3).fit(X_tr, y_tr)
pred = modelo.predict(X_te)

mf = MetricFrame(metrics={"exactitud": accuracy_score, "tasa_concesion": selection_rate, "recall": recall_score},
                 y_true=y_te, y_pred=pred, sensitive_features=g_te)
print(mf.by_group.round(3))
print("Diferencia de paridad demográfica:", round(demographic_parity_difference(y_te, pred, sensitive_features=g_te), 3))
# Prueba: quita la variable 'turno' y vuelve a medir. ¿Desaparece el sesgo? ¿Por qué no del todo?`

// HTML: <div id="respuesta" aria-busy="true"></div> <div id="anuncio" aria-live="polite" class="sr-only"></div>
const respuesta = document.querySelector("#respuesta");
const anuncio = document.querySelector("#anuncio");
let pendiente = "";

function alRecibir(trozo) {
  respuesta.textContent += trozo;                 // visible al instante
  pendiente += trozo;
  const fin = pendiente.search(/[.!?]\s/);
  if (fin >= 0) {                                 // al lector de pantalla, frase a frase
    anuncio.textContent = pendiente.slice(0, fin + 1);
    pendiente = pendiente.slice(fin + 2);
  }
}

function alTerminar() {
  if (pendiente.trim()) anuncio.textContent = pendiente;
  respuesta.setAttribute("aria-busy", "false");
}`

import argparse
import json
import statistics
import subprocess
import sys
from pathlib import Path
from sistema import responder            # punto de entrada del Proyecto Final
from jueces import juzgar_fidelidad, juzgar_correccion

p = argparse.ArgumentParser()
p.add_argument("--subset", default="completo")
p.add_argument("--umbral-fidelidad", type=float, default=0.85)
p.add_argument("--comparar-con")
a = p.parse_args()

casos = [json.loads(l) for l in open(f"eval/golden_{a.subset}.jsonl", encoding="utf-8")]
resultados = []
for c in casos:
    r = responder(c["entrada"])
    resultados.append({"id": c["id"], "fidelidad": juzgar_fidelidad(r), "correcta": juzgar_correccion(c, r),
                       "latencia_ms": r.latencia_ms, "coste_usd": r.coste_usd})

resumen = {
    "commit": subprocess.check_output(["git", "rev-parse", "--short", "HEAD"], text=True).strip(),
    "fidelidad": statistics.mean(x["fidelidad"] for x in resultados),
    "exactitud": sum(x["correcta"] for x in resultados) / len(resultados),
    "latencia_p95": sorted(x["latencia_ms"] for x in resultados)[int(len(resultados) * 0.95) - 1],
    "coste_medio": statistics.mean(x["coste_usd"] for x in resultados),
}
Path("eval/historico.jsonl").open("a", encoding="utf-8").write(json.dumps(resumen) + "\n")
print(json.dumps(resumen, indent=2))
sys.exit(0 if resumen["fidelidad"] >= a.umbral_fidelidad else 1)`

  if (!(window.crypto && crypto.subtle)) {

  }
  const salt = saltB64 ? b64ToBytes(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);

  const m = v.match(/^([XYZ]\d{7}|\d{8})([A-Z])$/);
  if (!m) return null;
  const num = m[1].replace('X', '0').replace('Y', '1').replace('Z', '2');

 *    examen de recuperación el 26 de enero).
 *  - Nota final = 70 % media de módulos ponderada por horas + 30 % PFM.
 *    Con 9 o más: «con distinción».
 *  Las calificaciones las pone siempre una persona: la plataforma solo
 *  calcula las medias (art. 22 RGPD y Reglamento de IA, Anexo III.3).
 * ===================================================================== */

/** Última entrega calificada de un alumno en una sesión (las nuevas versiones sustituyen a las anteriores). */
function ultimaEntrega(email, n, tipo) {
  const lista = db.entregas.filter(e => e.email === email && e.sesion === n && (!tipo || e.tipo === tipo));
  return lista.sort((a, b) => b.fecha.localeCompare(a.fecha))[0] || null;
}
function ultimaCalificada(email, n, tipo) {
  return db.entregas.filter(e => e.email === email && e.sesion === n && (!tipo || e.tipo === tipo) && e.estado === 'evaluada')
    .sort((a, b) => b.fecha.localeCompare(a.fecha))[0] || null;
}

/** Sesiones cuya entrega semanal cuenta en el 10 % de un módulo (la acogida cuenta en M1). */
function sesionesSemanalesDe(m) {
  return SESIONES.filter(s => s.actividad.tipo === 'semanal' && (moduloDe(s.n) === m || (m.id === 'M1' && moduloDe(s.n).id === 'ACO')));
}
function sesionProyectoDe(m) { return sesionesDe(m).find(s => s.actividad.tipo === 'proyecto'); }

/**
 * Calcula la nota de un módulo. Devuelve { estado, nota, proyecto, examen, entregas, motivo }.
 * estado: 'pendiente' | 'aprobado' | 'suspenso'
 */
function notaModulo(u, m) {
  const ev = (u.evaluacion.modulos || {})[m.id] || {};
  const sp = sesionProyectoDe(m);
  const proy = sp ? ultimaCalificada(u.email, sp.n, 'proyecto') : null;
  const proyPendiente = sp && ultimaEntrega(u.email, sp.n, 'proyecto') && !proy;

  const semanales = sesionesSemanalesDe(m);
  let sinCalificar = false;
  const notasSemanales = semanales.map(s => {
    const cal = ultimaCalificada(u.email, s.n, 'semanal');
    if (!cal && ultimaEntrega(u.email, s.n, 'semanal')) sinCalificar = true;
    return cal ? cal.nota : 0;                         // no entregada = 0
  });
  const entregas = semanales.length ? notasSemanales.reduce((a, b) => a + b, 0) / semanales.length : null;

  const examenes = [ev.examen, ev.recuperacion].filter(v => v != null && v !== '');
  const examen = examenes.length ? Math.max(...examenes.map(Number)) : null;

  const r = { proyecto: proy ? proy.nota : null, examen, entregas, recuperacion: ev.recuperacion != null && ev.recuperacion !== '' };
  if (r.proyecto == null || examen == null || sinCalificar || proyPendiente) {
    return Object.assign(r, { estado: 'pendiente', nota: null, motivo: proyPendiente || sinCalificar ? 'Entregas por calificar' : (r.proyecto == null ? 'Falta el proyecto' : 'Falta el examen') });
  }
  const P = EVALUACION.modulo;
  const nota = Math.round((r.proyecto * P.proyecto + examen * P.examen + entregas * P.entregas) * 100) / 100;
  if (examen < P.minimoExamen) return Object.assign(r, { estado: 'suspenso', nota, motivo: 'Examen inferior a ' + P.minimoExamen });
  return Object.assign(r, { estado: nota >= P.aprobado ? 'aprobado' : 'suspenso', nota, motivo: nota >= P.aprobado ? '' : 'Nota inferior a 5' });
}

/** Media de los módulos ponderada por horas (solo si todos tienen nota). */
function mediaModulos(u) {
  let suma = 0, horas = 0;
  for (const m of MODULOS_EVALUABLES) {
    const r = notaModulo(u, m);
    if (r.nota == null) return null;
    suma += r.nota * m.horas; horas += m.horas;
  }
  return Math.round(suma / horas * 100) / 100;
}

function notaPFM(u) {
  const t = u.evaluacion.tribunal || {};
  let total = 0;
  for (const [clave, , peso] of EVALUACION.tribunalPFM) {
    const v = t[clave];
    if (v == null || v === '' || isNaN(Number(v))) return null;
    total += Number(v) * peso;
  }
  return Math.round(total * 100) / 100;
}

function porcentajeEntregas(u) {
  const entregadas = ACTIVIDADES_SEMANALES.filter(n => db.entregas.some(e => e.email === u.email && e.sesion === n)).length;
  return { entregadas, total: ACTIVIDADES_SEMANALES.length, pct: entregadas / ACTIVIDADES_SEMANALES.length };
}
function seminariosAsistidos(u) {
  return Object.values(u.evaluacion.seminarios || {}).filter(Boolean).length;
}
function jornadasAsistidas(u) {
  return Object.values(u.evaluacion.jornadas || {}).filter(Boolean).length;
}

/** Situación completa frente a los requisitos del título (apartado 10). */
function situacionAcademica(u) {
  const R = EVALUACION.requisitos;
  const modulos = MODULOS_EVALUABLES.map(m => Object.assign({ modulo: m }, notaModulo(u, m)));
  const ent = porcentajeEntregas(u);
  const sem = seminariosAsistidos(u);
  const jor = jornadasAsistidas(u);
  const pfm = notaPFM(u);
  const acta = (u.evaluacion.tribunal || {}).acta || 'pendiente';
  const media = mediaModulos(u);
  const requisitos = [
    { texto: 'Asistir a las tres jornadas presenciales', ok: jor >= R.jornadas, detalle: jor + '/' + R.jornadas },
    { texto: 'Entregar al menos el 80 % de las actividades semanales', ok: ent.pct >= R.entregasPct, detalle: ent.entregadas + '/' + ent.total },
    { texto: 'Superar todos los módulos (M1–M7) y sus exámenes presenciales', ok: modulos.every(r => r.estado === 'aprobado'), detalle: modulos.filter(r => r.estado === 'aprobado').length + '/' + modulos.length },
    { texto: 'Asistir al menos a 4 de los 5 seminarios online', ok: sem >= R.seminarios, detalle: sem + '/' + SEMINARIOS.length },
    { texto: 'Obtener la calificación de apto en el Proyecto Final', ok: acta === 'apto' && pfm != null && pfm >= 5, detalle: acta === 'pendiente' ? 'pendiente' : acta.toUpperCase() + ' · ' + fmtNota(pfm) }
  ];
  const F = EVALUACION.final;
  const notaFinal = media != null && pfm != null ? Math.round((media * F.modulos + pfm * F.pfm) * 100) / 100 : null;
  return {
    modulos, ent, sem, jor, pfm, acta, media, notaFinal, requisitos,
    completo: requisitos.every(r => r.ok),
    distincion: notaFinal != null && notaFinal >= F.distincion
  };
}

async function onLogin(f) {
  const email = f.email.value.trim().toLowerCase();
  const pw = f.password.value;
  const err = $('#login-err');
  err.textContent = '';
  const u = db.users[email];
  if (!u) { err.textContent = 'No existe ninguna cuenta con ese correo. Si quieres matricularte, usa la pestaña Matrícula.'; return; }
  if (esDirector(u) && !u.hash) { ui.authVista = 'setup'; render(); return; }
  if (!pw) { err.textContent = 'Introduce tu contraseña.'; return; }
  try {
    const { hash } = await derivarHash(pw, u.salt);
    if (hash !== u.hash) { err.textContent = 'Contraseña incorrecta.'; return; }
  } catch (e) { err.textContent = e.message; return; }
  if (u.estado === 'rechazado') { err.textContent = 'Tu solicitud no ha sido aceptada. Contacta con ' + ADMIN_EMAIL + '.'; return; }
  setSesionEmail(email);
  registrarAuditoria('Inicio de sesión', email);
  guardar();
  if (!location.hash || location.hash === '#/' || location.hash.indexOf('#/verificar') === 0) ir('inicio'); else render();
}

async function onSetup(f) {
  const err = $('#setup-err');
  const pw = f.password.value, pw2 = f.password2.value;
  if (!passwordValida(pw)) { err.textContent = 'La contraseña no cumple la política de seguridad.'; return; }
  if (pw !== pw2) { err.textContent = 'Las contraseñas no coinciden.'; return; }
  const admin = db.users[ADMIN_EMAIL];
  if (admin.hash) { err.textContent = 'La contraseña de la Dirección ya está configurada.'; return; }
  try { Object.assign(admin, await derivarHash(pw)); } catch (e) { err.textContent = e.message; return; }
  registrarAuditoria('Configuración inicial de la cuenta de Dirección', ADMIN_EMAIL);
  setSesionEmail(ADMIN_EMAIL);
  guardar();
  ui.authVista = 'login';
  toast('Bienvenido, ' + ADMIN_NAME + '. Panel de Dirección activado.');
  ir('direccion/admisiones');
}

async function onRegistro(f) {
  const err = $('#reg-err');
  const fallo = m => { err.textContent = m; err.scrollIntoView({ block: 'center', behavior: 'smooth' }); };
  const nombre = f.nombre.value.trim();
  const dni = normalizarDni(f.dni.value);
  const email = f.email.value.trim().toLowerCase();
  const codigo = f.codigo.value.trim().toUpperCase();
  const plaza = f.plaza.value;
  const via = f.via.value;
  const promocion = f.promocion.value;
  const nacimiento = f.nacimiento.value;
  const pw = f.password.value;

  if (nombre.length < 5 || nombre.split(/\s+/).length < 2) return fallo('Indica nombre y al menos un apellido.');
  if (!dni) return fallo('El DNI o NIE no es válido (revisa la letra).');
  if (Object.values(db.users).some(u => u.dni === dni)) return fallo('Ya existe una matrícula con ese DNI/NIE.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return fallo('El correo electrónico no es válido.');
  if (db.users[email]) return fallo('Ya existe una cuenta con ese correo.');
  if (plaza === 'centro' && !email.endsWith('@jrotero.es')) return fallo('Las plazas del alumnado del centro se solicitan con el correo @jrotero.es.');
  let codigoObj = null;
  if (plaza === 'externo' || !email.endsWith('@jrotero.es')) {
    if (!codigo) return fallo('Las plazas externas necesitan el código de admisión que facilita Secretaría.');
    codigoObj = db.codigos.find(x => x.codigo === codigo && !x.usadoPor && !x.revocado);
    if (!codigoObj) return fallo('El código de admisión no es válido, ya se ha usado o ha sido revocado.');
  }
  if (!promocion) return fallo('Selecciona el año de titulación.');
  if (!nacimiento) return fallo('Indica tu fecha de nacimiento.');
  if (edad(nacimiento) < 18) return fallo('Debes ser mayor de edad para matricularte.');
  if (!f.mayor.checked) return fallo('Debes declarar tu mayoría de edad y tu titulación de acceso.');
  if (!f.oficial.checked) return fallo('Debes confirmar que conoces el carácter de título propio, sin carácter oficial.');
  if (!passwordValida(pw)) return fallo('La contraseña debe tener al menos 10 caracteres, una mayúscula, una minúscula y un número.');
  if (pw !== f.password2.value) return fallo('Las contraseñas no coinciden.');
  if (!f.consentDatos.checked) return fallo('Necesitamos tu consentimiento para tratar tus datos académicos.');
  if (!f.consentEtica.checked) return fallo('Debes aceptar el compromiso ético de uso responsable de la IA.');

  let cred;
  try { cred = await derivarHash(pw); } catch (e) { return fallo(e.message); }
  const ahora = new Date().toISOString();
  const admitidoDirecto = !!codigoObj && via === 'DAM';
  db.users[email] = {
    email, nombre, dni, rol: 'alumno', plaza, via, promocion, centro: f.centro.value.trim(), nacimiento,
    salt: cred.salt, hash: cred.hash, creado: ahora,
    estado: admitidoDirecto ? 'admitido' : 'pendiente',
    admision: codigoObj ? 'codigo:' + codigoObj.codigo : 'dominio',
    consentimientos: {
      datos: { aceptado: true, fecha: ahora, version: 'RGPD-2.0' },
      etica: { aceptado: true, fecha: ahora, version: 'IA-ETICA-2.0' },
      tituloPropio: { aceptado: true, fecha: ahora }
    },
    oposicion: null, limitacion: null, progreso: {}, evaluacion: {}, pfm: null, titulo: null
  };
  if (codigoObj) { codigoObj.usadoPor = email; codigoObj.fechaUso = ahora; }
  registrarAuditoria('Solicitud de matrícula (' + (plaza === 'centro' ? 'alumnado del centro' : 'plaza externa') + ', vía ' + via + ')', email);
  setSesionEmail(email);
  guardar();
  toast(admitidoDirecto ? 'Matrícula confirmada. ¡Bienvenido/a al Máster!' :
    'Solicitud registrada. Mientras se valida, tienes acceso a la acogida y a M1.' + (via !== 'DAM' ? ' Te contactaremos para la entrevista.' : ''));
  ir('inicio');
}

  html += '<a class="side-link' + (actual === 'inicio' ? ' active' : '') + '" href="#/inicio"><span class="snum">⌂</span>Mi panel</a>';

  MODULOS.forEach(m => {

      html += '<div class="pl-2 border-l-2 ml-3" style="border-color:' + colorMod(m) + '">';

        const ok = puedeAcceder(u, s.n);

        html += '<a class="side-link' + (actual === 's' + s.n ? ' active' : '') + (ok ? '' : ' locked') + '" href="#/sesion/' + s.n + '/teoria" title="' + esc(s.titulo) + '">' +
          '<span class="snum">' + (hecho ? '✓' : s.n) + '</span><span class="truncate">' + esc(s.corto) + '</span>' + (ok ? '' : '<span class="ml-auto text-xs">🔒</span>') + '</a>';
      });

    '</div></nav>';
  return html;
}

/* ---------- Calendario: semana actual y próximos hitos ---------- */
function eventosEdicion() {
  const ev = [];
  SEMINARIOS.forEach(s => ev.push({ fecha: s.fecha, tipo: 'Seminario online', texto: s.titulo + ' · jueves 18:00–20:00' }));
  JORNADAS.forEach(j => ev.push({ fecha: j.fecha, tipo: 'Jornada presencial ' + j.id, texto: j.contenido + ' · sábado 9:30–14:30' }));
  ev.push({ fecha: '2029-12-03', tipo: 'Proyecto Final', texto: 'Propuesta y asignación de tutor' });
  ev.push({ fecha: '2029-12-17', tipo: 'Proyecto Final', texto: 'Anteproyecto aprobado' });
  ev.push({ fecha: '2030-01-14', tipo: 'Proyecto Final', texto: 'Revisión intermedia (demo con el tutor)' });
  ev.push({ fecha: '2030-01-23', tipo: 'Proyecto Final', texto: 'Entrega de memoria y producto' });
  return ev.sort((a, b) => a.fecha.localeCompare(b.fecha));
}
function semanaActual() {
  const hoy = hoyIso();
  if (hoy < EDICION.inicio) return { estado: 'antes' };
  if (hoy > EDICION.fin) return { estado: 'despues' };
  let actual = CALENDARIO[0];
  CALENDARIO.forEach(w => { if (w.del <= hoy) actual = w; });
  return { estado: 'durante', semana: actual };
}

  const pct = Math.round(hechas / TOTAL_SESIONES * 100);

  const sig = sesion(siguiente);
  let aviso = '';

    aviso = '<div class="card p-4 mb-5" style="border-left:5px solid #efcd2f"><strong>Matrícula pendiente de validación.</strong> Secretaría está comprobando tus requisitos' + (u.via && u.via !== 'DAM' ? ' y la coordinación te citará para la entrevista' : '') + '. Mientras tanto tienes acceso a la acogida y a M1.</div>';
  }
  if (u.titulo) {
    aviso += '<div class="card p-4 mb-5 flex flex-wrap items-center gap-3" style="border-left:5px solid #efcd2f"><span class="badge-master">Diploma expedido</span><span>Tu diploma nº <strong>' + esc(u.titulo.numero) + '</strong> está disponible.</span><a class="btn btn-primary btn-sm ml-auto" href="#/diploma/' + encodeURIComponent(u.email) + '">Ver diploma</a></div>';

/* ---------- Sesión con la barra de 5 pestañas ---------- */
function vistaSesion(u, n, tab) {
  const s = sesion(n);
  if (!s) return '<div class="p-8">Sesión no encontrada.</div>';
  const m = moduloDe(n);
  if (!puedeAcceder(u, n)) {
    return '<div class="max-w-3xl mx-auto p-8"><div class="card p-8 text-center"><div class="text-4xl">🔒</div><h1 class="text-xl font-extrabold mt-3">Sesión ' + n + ' bloqueada</h1><p class="text-gray-600 mt-2">Tu matrícula está pendiente de validación. Mientras tanto puedes cursar la acogida y M1.</p><a class="btn btn-primary mt-5" href="#/sesion/0/teoria">Ir a la acogida</a></div></div>';
  }
  if (!TABS.some(t => t[0] === tab)) tab = 'teoria';
  const hecho = u.progreso && u.progreso[n];
  const prev = n > 0 ? '<a class="btn btn-ghost btn-sm" href="#/sesion/' + (n - 1) + '/' + tab + '">← Sesión ' + (n - 1) + '</a>' : '';
  const next = n < ULTIMA_SESION ? '<a class="btn btn-ghost btn-sm" href="#/sesion/' + (n + 1) + '/' + tab + '">Sesión ' + (n + 1) + ' →</a>' : '';

  let cuerpo = '';
  if (tab === 'teoria') cuerpo = tabTeoria(s);
  else if (tab === 'taller') cuerpo = tabTaller(s);
  else if (tab === 'prompts') cuerpo = tabPrompts(s);
  else if (tab === 'actividad') cuerpo = tabActividad(u, s);
  else cuerpo = tabFaq(s);

  const tipoAct = { semanal: 'Entrega semanal', proyecto: 'Proyecto del módulo', pfm: 'Hito del Proyecto Final' }[s.actividad.tipo];
  return '<div class="max-w-5xl mx-auto p-4 sm:p-8">' +
    '<div class="card overflow-hidden"><div style="height:8px;background:' + colorMod(m) + '"></div><div class="p-5 sm:p-7">' +
    '<div class="flex flex-wrap items-center gap-2"><span class="chip ' + chipMod(m) + '">' + esc(etiquetaMod(m)) + '</span><span class="chip chip-gold">Sesión ' + n + '</span>' +
    '<span class="chip">Semana ' + esc(s.semana) + ' · ' + esc(s.fechas) + '</span><span class="chip">' + esc(tipoAct) + '</span></div>' +
    '<h1 class="text-2xl sm:text-[1.7rem] font-extrabold leading-tight mt-3">' + esc(s.titulo) + '</h1>' +
    '<p class="text-gray-600 mt-2">' + s.resumen + '</p>' +
    '<div class="flex flex-wrap gap-1.5 mt-4">' + s.stack.map(t => '<span class="chip">' + esc(t) + '</span>').join('') + '</div>' +
    '<div class="flex flex-wrap items-center gap-2 mt-5">' +
    '<button class="btn ' + (hecho ? 'btn-ghost' : 'btn-primary') + ' btn-sm" data-act="toggle-hecho" data-n="' + n + '">' + (hecho ? '✓ Sesión completada (desmarcar)' : 'Marcar sesión como completada') + '</button>' +
    '<span class="ml-auto flex gap-2">' + prev + next + '</span></div>' +
    '</div>' +
    '<div class="px-3 sm:px-5"><div class="tabs" role="tablist" aria-label="Secciones de la sesión">' +
    TABS.map(t => '<a class="tab no-underline" role="tab" aria-selected="' + (t[0] === tab) + '" href="#/sesion/' + n + '/' + t[0] + '">' + t[1] + '</a>').join('') +
    '</div></div></div>' +

function onEntrega(f) {
  const u = usuarioActual();
  const err = $('#entrega-err');
  const repo = f.repo.value.trim();
  const video = f.video ? f.video.value.trim() : '';
  if (!isHttpsUrl(repo)) { err.textContent = 'Introduce una URL https:// válida al repositorio.'; return; }
  if (video && !isHttpsUrl(video)) { err.textContent = 'El enlace del vídeo o del producto debe ser https://.'; return; }
  if (f.dataset.tipo === 'proyecto' && !video) { err.textContent = 'El proyecto del módulo incluye un vídeo de defensa de 5 minutos.'; return; }
  if (!f.limpio.checked) { err.textContent = 'Debes confirmar la declaración de autoría, uso de IA, secretos y datos personales.'; return; }
  const n = Number(f.dataset.n);
  db.entregas.push({
    id: uid(), email: u.email, sesion: n, tipo: f.dataset.tipo, hito: f.hito ? f.hito.value : null,
    repo, video: video || null, commit: f.commit.value.trim(), notas: f.notas.value.trim(),
    fecha: new Date().toISOString(), estado: 'pendiente', nota: null, feedback: ''
  });
  registrarAuditoria('Entrega de la sesión ' + n + (f.hito ? ' (' + f.hito.value + ')' : ''), u.email);
  guardar();
  toast('Entrega registrada. Tu tutor la corregirá.');
  render();
}

function expedienteDe(email) {
  const u = db.users[email];
  const copia = Object.assign({}, u);
  delete copia.hash; delete copia.salt;
  return {
    responsable: CENTRO, contacto: ADMIN_EMAIL, exportado: new Date().toISOString(),
    formato: 'JSON (art. 20 RGPD - portabilidad)', programa: TITULO_MASTER + ' · ' + MENCION_LEGAL,
    alumno: copia,
    situacion: u.rol === 'director' ? null : situacionAcademica(u),
    entregas: db.entregas.filter(e => e.email === email),
    titulo: db.titulos.filter(t => t.email === email),
    auditoria: db.audit.filter(a => a.email === email)
  };
}

function onPFM(f) {
  const u = usuarioActual();
  const err = $('#pfm-err');
  const repo = f.repo.value.trim();
  if (f.titulo.value.trim().length < 8) { err.textContent = 'El título es demasiado corto.'; return; }
  if (repo && !isHttpsUrl(repo)) { err.textContent = 'El repositorio debe ser una URL https://.'; return; }
  const pareja = f.pareja.value.trim().toLowerCase();
  if (pareja && pareja === u.email) { err.textContent = 'El correo de tu pareja no puede ser el tuyo.'; return; }
  u.pfm = { titulo: f.titulo.value.trim(), empresa: f.empresa.value.trim(), pareja, repo, resumen: f.resumen.value.trim(), actualizado: new Date().toISOString() };
  registrarAuditoria('Datos del Proyecto Final actualizados', u.email);
  guardar(); toast('Datos del Proyecto Final guardados.'); render();
}

    (filas ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Solicitante</th><th>Titulación de acceso</th><th>Plaza</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>' + filas + '</tbody></table></div>' : '<p class="text-sm text-gray-500">Todavía no hay solicitudes.</p>') + '</div>' +
    '<div class="card p-5"><h2 class="font-extrabold text-lg">Códigos de admisión</h2><p class="text-sm text-gray-600">Para plazas externas (tras la reserva o el pago) y para correos que no son @jrotero.es. Un código con vía DAM matricula directamente; las otras vías quedan pendientes de entrevista. Cada código se usa una vez.</p>' +

function dirSeguimiento() {
  const lista = alumnos();
  if (!lista.length) return sinAlumnos();
  const filas = lista.map(a => {
    const sit = situacionAcademica(a);
    let celdas = '';
    SESIONES.forEach(s => {
      const ok = a.progreso && a.progreso[s.n];
      const entregada = db.entregas.some(e => e.email === a.email && e.sesion === s.n);
      celdas += '<span title="Sesión ' + s.n + (entregada ? ' · entregada' : '') + '" style="display:inline-block;width:9px;height:14px;margin-right:1px;border-radius:2px;background:' + (ok ? colorMod(moduloDe(s.n)) : '#ece9df') + ';' + (entregada ? 'box-shadow:inset 0 -3px 0 #111' : '') + '"></span>';
    });
    return '<tr><td>' + celdaAlumno(a) + '</td><td><span class="chip">' + esc(a.estado) + '</span></td>' +
      '<td class="whitespace-nowrap">' + celdas + '<div class="text-xs text-gray-500 mt-1">' + progresoDe(a) + '/' + TOTAL_SESIONES + ' sesiones · entregas ' + sit.ent.entregadas + '/' + sit.ent.total + '</div></td>' +
      '<td>' + sit.modulos.filter(r => r.estado === 'aprobado').length + '/7</td><td>' + sit.jor + '/3 · ' + sit.sem + '/5</td><td><strong>' + fmtNota(sit.notaFinal) + '</strong></td></tr>';
  }).join('');
  return '<div class="card p-5"><h2 class="font-extrabold text-lg mb-1">Seguimiento del grupo</h2><p class="text-sm text-gray-600 mb-3">Barra: sesiones completadas (color) y entregadas (línea inferior). Detecta a tiempo a quien se retrasa.</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Alumno/a</th><th>Estado</th><th>Sesiones 0 → ' + ULTIMA_SESION + '</th><th>Módulos</th><th>Jornadas · Seminarios</th><th>Nota final</th></tr></thead><tbody>' + filas + '</tbody></table></div></div>';
}

async function codigoVerificacion(partes) {
  return (await sha256Hex(partes.join('|'))).slice(0, 16).toUpperCase().match(/.{4}/g).join('-');
}

async function emitirTitulo(email) {
  const a = db.users[email];
  const sit = a && situacionAcademica(a);
  if (!a || a.titulo || !sit.completo || sit.notaFinal == null) { toast('No se cumplen los requisitos para expedir el diploma.', 'bad'); return; }
  const año = new Date().getFullYear();
  const secuencia = db.titulos.filter(x => x.numero.indexOf('MIA-JRO-' + año) === 0).length + 1;
  const numero = 'MIA-JRO-' + año + '-' + String(secuencia).padStart(4, '0');
  const fecha = new Date().toISOString();
  const verificacion = await codigoVerificacion([numero, a.dni, sit.notaFinal, fecha]);
  const modulosSup = sit.modulos.map(r => ({ cod: r.modulo.cod, nombre: r.modulo.nombre, horas: r.modulo.horas, nota: r.nota }));
  a.titulo = { numero, fecha, nota: sit.notaFinal, distincion: sit.distincion, verificacion, media: sit.media, pfm: sit.pfm, modulos: modulosSup, pfmTitulo: (a.pfm || {}).titulo || '' };
  db.titulos.push({ numero, email, nombre: a.nombre, dni: a.dni, fecha, nota: sit.notaFinal, distincion: sit.distincion, verificacion, edicion: EDICION.periodo });
  registrarAuditoria('Expedición del diploma ' + numero, email);
  guardar();
  toast('Diploma ' + numero + ' expedido e inscrito en el libro de registro.');
  ir('diploma/' + encodeURIComponent(email));
}

async function emitirCertificado(email) {
  const a = db.users[email];
  if (!a || a.titulo) return;
  const sit = situacionAcademica(a);
  const aprobados = sit.modulos.filter(r => r.estado === 'aprobado');
  if (!aprobados.length) { toast('No hay módulos superados.', 'bad'); return; }
  const fecha = new Date().toISOString();
  const numero = 'CAP-JRO-' + new Date().getFullYear() + '-' + String(db.certificados.length + 1).padStart(4, '0');
  a.certificado = { numero, fecha, verificacion: await codigoVerificacion([numero, a.dni, fecha]),
    modulos: aprobados.map(r => ({ cod: r.modulo.cod, nombre: r.modulo.nombre, horas: r.modulo.horas, nota: r.nota, contenidos: r.modulo.contenidos })) };
  db.certificados.push({ numero, email, nombre: a.nombre, dni: a.dni, fecha, verificacion: a.certificado.verificacion, horas: aprobados.reduce((s, r) => s + r.modulo.horas, 0) });
  registrarAuditoria('Certificado de aprovechamiento ' + numero, email);
  guardar();
  ir('certificado/' + encodeURIComponent(email));
}

function render() {
  const u = usuarioActual();
  const app = $('#app');
  const r = ruta();
  if (r[0] === 'verificar') { app.innerHTML = vistaVerificar(r[1]); return; }   // pública, sin sesión
  if (!u) {
    if (ui.authVista === 'setup' && db.users[ADMIN_EMAIL].hash) ui.authVista = 'login';
    app.innerHTML = vistaAuth();
    return;
  }
  let actual = r[0] || 'inicio';
  let contenido = '';
  if (actual === 'sesion') {
    const num = parseInt(r[1], 10);
    const n = Math.min(ULTIMA_SESION, Math.max(0, isNaN(num) ? 0 : num));
    contenido = vistaSesion(u, n, r[2] || 'teoria');
    actual = 's' + n;
  } else if (actual === 'perfil') contenido = vistaPerfil(u);
  else if (actual === 'programa') contenido = vistaPrograma();
  else if (actual === 'direccion') contenido = vistaDireccion(u, r[1]);
  else if (actual === 'diploma') contenido = vistaDiploma(u, r[1]);
  else if (actual === 'certificado') contenido = vistaCertificado(u, r[1]);
  else { actual = 'inicio'; contenido = vistaInicio(u); }

  app.innerHTML = cabecera(u) + '<div class="layout">' + barraLateral(u, actual) + '<main id="main" class="min-w-0">' + contenido +
    '<footer class="max-w-5xl mx-auto px-4 sm:px-8 pb-10 pt-4 text-xs text-gray-500 flex flex-wrap gap-x-4 gap-y-1 no-print"><span>© ' + new Date().getFullYear() + ' ' + CENTRO + '</span>' +
    '<span>' + MENCION_LEGAL + '</span><button class="underline" data-act="segunda-capa">Protección de datos</button><a class="underline" href="#/verificar">Verificar un diploma</a><span>Contacto: ' + ADMIN_EMAIL + '</span></footer></main></div>';
  resaltar();
}

const acciones = {
  'auth-vista': el => { ui.authVista = el.dataset.v; render(); },
  'segunda-capa': () => modalSegundaCapa(),
  'cerrar-modal': () => cerrarModal(),
  'cerrar-modal-fondo': (el, e) => { if (e.target === el) cerrarModal(); },
  'logout': () => {
    const u = usuarioActual();
    if (u) { registrarAuditoria('Cierre de sesión', u.email); guardar(); }
    setSesionEmail(null); ui.authVista = 'login'; location.hash = ''; render();
  },
  'toggle-side': () => { ui.sideAbierta = !ui.sideAbierta; const s = $('.sidebar'); if (s) s.classList.toggle('open', ui.sideAbierta); },
  'toggle-mod': el => {
    const id = el.dataset.m;
    if (ui.modsCerrados.has(id)) ui.modsCerrados.delete(id); else ui.modsCerrados.add(id);
    const scroll = $('.sidebar') ? $('.sidebar').scrollTop : 0;
    render();
    if ($('.sidebar')) $('.sidebar').scrollTop = scroll;
  },
  'copiar': el => copiarTexto(codigoPorId[el.dataset.id], el),
  'copiar-texto': el => copiarTexto(el.dataset.texto, el),
  'toggle-hecho': el => {
    const u = usuarioActual(); const n = Number(el.dataset.n);
    u.progreso = u.progreso || {};
    if (u.progreso[n]) delete u.progreso[n]; else u.progreso[n] = new Date().toISOString();
    guardar(); render();
    if (u.progreso[n]) toast('Sesión ' + n + ' completada. ' + progresoDe(u) + '/' + TOTAL_SESIONES);
  },
  'exportar-expediente': () => {
    const u = usuarioActual();
    registrarAuditoria('Derecho de acceso/portabilidad: exportación JSON', u.email); guardar();
    descargar('expediente-master-ia-' + u.email.replace(/[^a-z0-9]/gi, '_') + '.json', JSON.stringify(expedienteDe(u.email), null, 2));
    toast('Expediente exportado en formato JSON.');
  },
  'suprimir': () => modalSupresion(usuarioActual()),
  'toggle-derecho': el => {
    const u = usuarioActual(); const d = el.dataset.d;
    u[d] = u[d] ? null : new Date().toISOString();
    registrarAuditoria((d === 'oposicion' ? 'Derecho de oposición ' : 'Limitación del tratamiento ') + (u[d] ? 'ejercido' : 'retirado'), u.email);
    guardar(); render();
  },
  'admitir': el => cambiarEstado(el.dataset.email, 'admitido'),
  'rechazar': el => cambiarEstado(el.dataset.email, 'rechazado'),
  'revocar-codigo': el => {
    const x = db.codigos.find(k => k.codigo === el.dataset.codigo);
    if (x) { x.revocado = new Date().toISOString(); registrarAuditoria('Revocación del código ' + x.codigo, ADMIN_EMAIL); guardar(); render(); }
  },
  'filtro-entregas': el => { ui.filtroEntregas = el.dataset.f; render(); },
  'emitir-titulo': el => {
    const a = db.users[el.dataset.email];
    const sit = situacionAcademica(a);
    abrirModal('<h2 class="text-xl font-extrabold">Expedir diploma</h2><p class="text-sm mt-2">Se expedirá el diploma del ' + TITULO_MASTER + ' a <strong>' + esc(a.nombre) + '</strong> (DNI/NIE ' + esc(a.dni) + ') con nota final <strong>' + fmtNota(sit.notaFinal) + '</strong>' + (sit.distincion ? ' <strong>con distinción</strong>' : '') + '. Quedará anotado en el libro de registro de títulos propios y se cerrará el acta del Proyecto Final.</p>' +
      '<p class="text-sm mt-2">Comprueba que nombre y DNI/NIE son correctos: aparecerán en el diploma.</p>' +
      '<div class="flex justify-end gap-2 mt-5"><button class="btn btn-ghost" data-act="cerrar-modal">Cancelar</button><button class="btn btn-primary" data-act="confirmar-titulo" data-email="' + esc(a.email) + '">★ Expedir diploma</button></div>');
  },
  'confirmar-titulo': el => { cerrarModal(); emitirTitulo(el.dataset.email); },
  'emitir-certificado': el => emitirCertificado(el.dataset.email),
  'imprimir': () => window.print(),
  'exportar-db': () => {
    registrarAuditoria('Exportación de la base de datos', ADMIN_EMAIL); guardar();
    descargar('master-ia-jro-copia-' + hoyIso() + '.json', JSON.stringify(db, null, 2));
  },
  'reset-db': () => abrirModal('<h2 class="text-xl font-extrabold">Restablecer datos</h2><p class="text-sm mt-2">Se eliminará el alumnado, las entregas, los códigos y los registros de títulos y certificados de este navegador.</p><div class="flex justify-end gap-2 mt-5"><button class="btn btn-ghost" data-act="cerrar-modal">Cancelar</button><button class="btn btn-danger" data-act="confirmar-reset">Restablecer</button></div>'),
  'confirmar-reset': () => {
    const admin = db.users[ADMIN_EMAIL];
    db = normalizarDB({ users: { [ADMIN_EMAIL]: admin } });
    registrarAuditoria('Restablecimiento de datos', ADMIN_EMAIL);
    guardar(); cerrarModal(); toast('Datos restablecidos.'); render();
  }
};

function cambiarEstado(email, estado) {
  const a = db.users[email];
  if (!a) return;
  if (estado === 'admitido' && alumnos().filter(x => x.estado === 'admitido').length >= EDICION.plazas) {
    toast('Se ha alcanzado el máximo de ' + EDICION.plazas + ' plazas del grupo.', 'bad'); return;
  }
  a.estado = estado;
  a.fechaResolucion = new Date().toISOString();
  registrarAuditoria('Matrícula: ' + estado, email);
  guardar(); render();
  toast(a.nombre + ': ' + (estado === 'admitido' ? 'matriculado/a' : 'solicitud rechazada'));
}

function copiarTexto(texto, el) {
  const ok = () => { const prev = el.textContent; el.textContent = '¡Copiado!'; setTimeout(() => { el.textContent = prev; }, 1400); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(texto).then(ok, () => copiarFallback(texto) && ok());
  } else if (copiarFallback(texto)) ok();
}
function copiarFallback(texto) {
  const ta = document.createElement('textarea');
  ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  if (!ok) toast('No se pudo copiar automáticamente.', 'bad');
  return ok;
}

function notaCampo(valor) {
  if (valor === '' || valor == null) return { ok: true, v: null };
  const v = Number(valor);
  return isNaN(v) || v < 0 || v > 10 ? { ok: false } : { ok: true, v };
}

const formularios = {
  login: f => onLogin(f),
  setup: f => onSetup(f),
  registro: f => onRegistro(f),
  entrega: f => onEntrega(f),
  pfm: f => onPFM(f),
  verificar: f => ir('verificar/' + encodeURIComponent(f.codigo.value.trim().toUpperCase())),
  rectificar: f => {
    const u = usuarioActual();
    if (!u.titulo) {
      const nombre = f.nombre.value.trim();
      if (nombre.length < 5) { toast('El nombre es demasiado corto.', 'bad'); return; }
      u.nombre = nombre;
    }
    if (f.promocion) u.promocion = f.promocion.value;
    registrarAuditoria('Derecho de rectificación', u.email);
    guardar(); toast('Datos rectificados.'); render();
  },
  suprimir: f => {
    const u = usuarioActual();
    if (f.email.value.trim().toLowerCase() !== u.email) { $('#sup-err').textContent = 'El correo no coincide.'; return; }
    db.titulos.forEach(t => { if (t.email === u.email) { t.suprimido = new Date().toISOString(); t.email = null; } });
    db.certificados.forEach(t => { if (t.email === u.email) { t.suprimido = new Date().toISOString(); t.email = null; } });
    db.entregas = db.entregas.filter(e => e.email !== u.email);
    db.audit.forEach(a => { if (a.email === u.email) a.email = '[suprimido]'; });
    db.codigos.forEach(x => { if (x.usadoPor === u.email) x.usadoPor = '[suprimido]'; });
    delete db.users[u.email];
    registrarAuditoria('Derecho de supresión ejercido por un alumno', null);
    guardar(); cerrarModal(); setSesionEmail(null); location.hash = '';
    toast('Tu cuenta y tus datos se han suprimido.'); render();
  },
  codigo: f => {
    const parte = () => uid().slice(0, 4).toUpperCase();
    let codigo;
    do { codigo = 'MIA-' + parte() + '-' + parte(); } while (db.codigos.some(x => x.codigo === codigo));
    db.codigos.push({ codigo, creado: new Date().toISOString(), nota: f.nota.value.trim(), usadoPor: null, revocado: null });
    registrarAuditoria('Emisión del código de admisión ' + codigo, ADMIN_EMAIL);
    guardar(); render(); toast('Código ' + codigo + ' generado.');
  },
  calificar: f => {
    const e = db.entregas.find(x => x.id === f.dataset.id);
    if (e.tipo !== 'pfm') {
      const n = notaCampo(f.nota.value);
      if (!n.ok || n.v == null) { toast('La nota debe estar entre 0 y 10.', 'bad'); return; }
      e.nota = n.v;
    }
    e.feedback = f.feedback.value.trim(); e.estado = 'evaluada'; e.fechaEvaluacion = new Date().toISOString();
    registrarAuditoria('Corrección de la entrega de la sesión ' + e.sesion + (e.nota != null ? ' (' + fmtNota(e.nota) + ')' : ''), e.email);
    guardar(); render(); toast('Entrega corregida.');
  },
  acta: f => {
    const a = db.users[f.dataset.email];
    const mods = a.evaluacion.modulos = a.evaluacion.modulos || {};
    for (const m of MODULOS_EVALUABLES) {
      const ex = notaCampo(f['examen_' + m.id].value);
      const rec = notaCampo(f['recuperacion_' + m.id].value);
      if (!ex.ok || !rec.ok) { toast('Las notas deben estar entre 0 y 10 (' + m.cod + ').', 'bad'); return; }
      mods[m.id] = { examen: ex.v, recuperacion: rec.v };
    }
    registrarAuditoria('Acta de módulos actualizada', a.email);
    guardar(); render(); toast('Acta guardada.');
  },
  asistencia: f => {
    const a = db.users[f.dataset.email];
    const campo = name => document.querySelector('[form="' + f.id + '"][name="' + name + '"]');
    a.evaluacion.jornadas = {};
    JORNADAS.forEach(j => { a.evaluacion.jornadas[j.id] = campo('j' + j.id).checked; });
    a.evaluacion.seminarios = {};
    SEMINARIOS.forEach(s => { a.evaluacion.seminarios[s.id] = campo('s' + s.id).value || null; });
    registrarAuditoria('Asistencia a jornadas y seminarios actualizada', a.email);
    guardar(); render(); toast('Asistencia guardada.');
  },
  tribunal: f => {
    const a = db.users[f.dataset.email];
    const t = a.evaluacion.tribunal || {};
    for (const [clave] of EVALUACION.tribunalPFM) {
      const n = notaCampo(f[clave].value);
      if (!n.ok) { toast('Las notas del tribunal deben estar entre 0 y 10.', 'bad'); return; }
      t[clave] = n.v;
    }
    t.miembros = [0, 1, 2].map(i => f['miembro' + i].value.trim());
    t.observaciones = f.observaciones.value.trim();
    t.acta = f.acta.value;
    a.evaluacion.tribunal = t;
    const nota = notaPFM(a);
    if (t.acta === 'apto' && (nota == null || nota < 5)) { toast('Un acta APTO requiere las cinco notas y una calificación ≥ 5.', 'bad'); return; }
    if (t.acta === 'apto' && t.miembros.some(m => !m)) { toast('Indica los tres miembros del tribunal.', 'bad'); return; }
    registrarAuditoria('Acta del tribunal del Proyecto Final: ' + t.acta.toUpperCase(), a.email);
    guardar(); render(); toast('Acta del tribunal guardada.');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = acciones[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target;
  const fn = formularios[f.dataset.form];
  if (!fn) return;
  e.preventDefault();
  fn(f, e.submitter);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.actChange === 'importar-db' && el.files && el.files[0]) {
    const lector = new FileReader();
    lector.onload = () => {
      try {
        const datos = JSON.parse(lector.result);
        if (!datos || typeof datos !== 'object' || !datos.users) throw new Error('formato');
        const adminActual = db.users[ADMIN_EMAIL];
        db = normalizarDB(datos);
        if (!db.users[ADMIN_EMAIL].hash && adminActual.hash) db.users[ADMIN_EMAIL] = adminActual;
        registrarAuditoria('Importación de copia de seguridad', ADMIN_EMAIL);
        guardar(); toast('Copia importada.'); render();
      } catch (err) { toast('El archivo no es una copia válida de la plataforma.', 'bad'); }
    };
    lector.readAsText(el.files[0]);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) cerrarModal(); });
window.addEventListener('hashchange', () => {
  ui.sideAbierta = false;
  const r = ruta();
  if (r[0] === 'sesion') {
    const num = parseInt(r[1], 10);
    const m = moduloDe(isNaN(num) ? 0 : num);
    if (m) ui.modsCerrados.delete(m.id);
  }
  render();
  window.scrollTo({ top: 0 });
});
window.addEventListener('storage', e => { if (e.key === DB_KEY) { db = cargarDB(); render(); } });

(function arrancar() {
  render();
  window.addEventListener('load', resaltar);       // highlight.js llega con defer desde el CDN
  const img = new Image();
  img.onload = () => { LOGO_PNG = true; render(); };
  img.src = 'logo-jrotero.png';
})();

</script>
