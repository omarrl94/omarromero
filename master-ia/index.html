import torch


def mejor_dispositivo() -> torch.device:
    """Devuelve cuda > mps > cpu según disponibilidad."""
    if torch.cuda.is_available():
        return torch.device("cuda")
    if torch.backends.mps.is_available():
        return torch.device("mps")
    return torch.device("cpu")

import time
import numpy as np

rng = np.random.default_rng(42)
docs = rng.standard_normal((50_000, 384), dtype=np.float32)   # 50k embeddings
consulta = rng.standard_normal(384, dtype=np.float32)


def coseno_bucle(docs, q):
    res = []
    for d in docs:                                   # estilo "Java clásico"
        num = sum(a * b for a, b in zip(d, q))
        den = (sum(a * a for a in d) ** 0.5) * (sum(b * b for b in q) ** 0.5)
        res.append(num / den)
    return res


def coseno_vectorizado(docs, q):
    docs_n = docs / np.linalg.norm(docs, axis=1, keepdims=True)  # broadcasting
    q_n = q / np.linalg.norm(q)
    return docs_n @ q_n                               # un único matmul

import torch
from torch import nn
from torch.utils.data import DataLoader, random_split
from torch.utils.tensorboard import SummaryWriter
from torchvision import datasets, transforms
from modelo import ClasificadorMLP

torch.manual_seed(42)
device = "cuda" if torch.cuda.is_available() else "mps" if torch.backends.mps.is_available() else "cpu"

tf = transforms.Compose([transforms.ToTensor(), transforms.Normalize((0.1307,), (0.3081,))])
completo = datasets.MNIST("data", train=True, download=True, transform=tf)
train_ds, val_ds = random_split(completo, [54_000, 6_000])
train_dl = DataLoader(train_ds, batch_size=128, shuffle=True, num_workers=2)
val_dl = DataLoader(val_ds, batch_size=512)

modelo = ClasificadorMLP().to(device)
criterio = nn.CrossEntropyLoss(label_smoothing=0.05)
opt = torch.optim.AdamW(modelo.parameters(), lr=3e-3, weight_decay=0.01)
EPOCAS, WARMUP = 15, 200
total_pasos = EPOCAS * len(train_dl)
sched = torch.optim.lr_scheduler.LambdaLR(opt, lambda p: min(1.0, (p + 1) / WARMUP)
                                          * 0.5 * (1 + math.cos(math.pi * p / total_pasos)))
log = SummaryWriter("runs/mlp")
mejor, paciencia = float("inf"), 0

for epoca in range(EPOCAS):
    modelo.train()
    for xb, yb in train_dl:
        xb, yb = xb.to(device), yb.to(device)
        loss = criterio(modelo(xb), yb)
        opt.zero_grad(set_to_none=True)
        loss.backward()
        torch.nn.utils.clip_grad_norm_(modelo.parameters(), 1.0)

import math
import torch
from torch import nn
import torch.nn.functional as F


class AtencionCausal(nn.Module):
    def __init__(self, d_model: int, n_heads: int, max_len: int = 512, p_drop: float = 0.1):
        super().__init__()
        assert d_model % n_heads == 0
        self.h, self.dk = n_heads, d_model // n_heads
        self.qkv = nn.Linear(d_model, 3 * d_model, bias=False)
        self.proj = nn.Linear(d_model, d_model, bias=False)
        self.drop = nn.Dropout(p_drop)
        self.register_buffer("mask", torch.tril(torch.ones(max_len, max_len)).bool())

    def forward(self, x: torch.Tensor) -> torch.Tensor:
        B, T, C = x.shape                                           # (B, T, C)
        q, k, v = self.qkv(x).split(C, dim=2)
        q, k, v = (t.view(B, T, self.h, self.dk).transpose(1, 2) for t in (q, k, v))  # (B, h, T, dk)
        att = (q @ k.transpose(-2, -1)) / math.sqrt(self.dk)       # (B, h, T, T)
        att = att.masked_fill(~self.mask[:T, :T], float("-inf"))
        att = self.drop(F.softmax(att, dim=-1))
        y = (att @ v).transpose(1, 2).contiguous().view(B, T, C)
        return self.proj(y)

import torch
from torch import nn
from atencion import AtencionCausal


class Bloque(nn.Module):
    def __init__(self, d: int, h: int):
        super().__init__()
        self.n1, self.n2 = nn.RMSNorm(d), nn.RMSNorm(d)
        self.att = AtencionCausal(d, h)
        self.mlp = nn.Sequential(nn.Linear(d, 4 * d), nn.GELU(), nn.Linear(4 * d, d))

    def forward(self, x):
        x = x + self.att(self.n1(x))      # pre-norm + residual
        return x + self.mlp(self.n2(x))


class MiniGPT(nn.Module):
    def __init__(self, vocab: int, d: int = 256, h: int = 8, capas: int = 6, max_len: int = 256):
        super().__init__()
        self.tok = nn.Embedding(vocab, d)
        self.pos = nn.Embedding(max_len, d)
        self.bloques = nn.Sequential(*[Bloque(d, h) for _ in range(capas)])
        self.norm = nn.RMSNorm(d)
        self.cabeza = nn.Linear(d, vocab, bias=False)
        self.cabeza.weight = self.tok.weight          # weight tying
        self.max_len = max_len

    def forward(self, ids):
        pos = torch.arange(ids.shape[1], device=ids.device)
        x = self.tok(ids) + self.pos(pos)
        return self.cabeza(self.norm(self.bloques(x)))    # (B, T, vocab)

    @torch.inference_mode()
    def generar(self, ids, nuevos: int, temperatura: float = 0.8, top_k: int = 40):
        for _ in range(nuevos):
            logits = self(ids[:, -self.max_len:])[:, -1, :] / temperatura
            v, _ = torch.topk(logits, top_k)
            logits[logits < v[:, [-1]]] = float("-inf")
            sig = torch.multinomial(torch.softmax(logits, dim=-1), 1)
            ids = torch.cat([ids, sig], dim=1)
        return ids` },

      { t: 'Pasarela FastAPI con streaming SSE asíncrono', lang: 'python', file: 'src/pasarela.py', code: c`
import json
import anthropic
from fastapi import FastAPI
from pydantic import BaseModel
from sse_starlette.sse import EventSourceResponse

app = FastAPI(title="Pasarela LLM · Máster IA JRO")
claude = anthropic.AsyncAnthropic()


class Peticion(BaseModel):
    mensajes: list[dict]
    esfuerzo: str = "low"


@app.post("/chat")
async def chat(p: Peticion):
    async def eventos():
        async with claude.messages.stream(
            model="claude-opus-5-5",
            max_tokens=64000,
            system="Eres el asistente del Máster de IA del CFP José Ramón Otero.",
            output_config={"effort": p.esfuerzo},
            messages=p.mensajes,
        ) as stream:
            async for texto in stream.text_stream:
                yield {"event": "delta", "data": json.dumps({"t": texto})}
            final = await stream.get_final_message()
            yield {"event": "fin", "data": json.dumps({
                "stop_reason": final.stop_reason,
                "entrada": final.usage.input_tokens, "salida": final.usage.output_tokens})}

    return EventSourceResponse(eventos())` },

async function preguntar(texto, onDelta) {
  const resp = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mensajes: [{ role: "user", content: texto }] })
  });
  const lector = resp.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = "";
  for (;;) {
    const { value, done } = await lector.read();
    if (done) break;
    buffer += value;
    const eventos = buffer.split("\r\n\r\n");
    buffer = eventos.pop();
    for (const ev of eventos) {
      const data = ev.split("\n").find(l => l.startsWith("data:"));
      if (ev.includes("event: delta") && data) onDelta(JSON.parse(data.slice(5)).t);
    }
  }
}` }

      { t: 'Servicio de tutoría con memoria conversacional', lang: 'java', file: 'TutorService.java', code: c`
package es.jrotero.tutoria;

import org.springframework.ai.chat.client.ChatClient;
import org.springframework.ai.chat.client.advisor.MessageChatMemoryAdvisor;
import org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor;
import org.springframework.ai.chat.memory.ChatMemory;
import org.springframework.ai.chat.memory.MessageWindowChatMemory;
import org.springframework.stereotype.Service;
import reactor.core.publisher.Flux;

@Service
public class TutorService {

    private final ChatClient chat;

    public TutorService(ChatClient.Builder builder) {
        ChatMemory memoria = MessageWindowChatMemory.builder().maxMessages(20).build();
        this.chat = builder
                .defaultSystem("""
                        Eres el tutor del Máster de IA del CFP José Ramón Otero.
                        El alumnado son titulados DAM. Responde en español con ejemplos en Java 21.
                        """)
                .defaultAdvisors(MessageChatMemoryAdvisor.builder(memoria).build(), new SimpleLoggerAdvisor())
                .build();
    }

    public String preguntar(String conversacionId, String pregunta) {
        return chat.prompt()
                .user(pregunta)
                .advisors(a -> a.param(ChatMemory.CONVERSATION_ID, conversacionId))
                .call()
                .content();
    }

    public Flux<String> preguntarStream(String conversacionId, String pregunta) {
        return chat.prompt()
                .user(pregunta)
                .advisors(a -> a.param(ChatMemory.CONVERSATION_ID, conversacionId))
                .stream()
                .content();
    }
}` },

package es.jrotero.tutoria;

import jakarta.validation.constraints.NotBlank;
import jakarta.validation.constraints.Size;
import org.springframework.http.MediaType;
import org.springframework.security.core.annotation.AuthenticationPrincipal;
import org.springframework.web.bind.annotation.*;
import reactor.core.publisher.Flux;

@RestController
@RequestMapping("/api/tutor")
public class TutorController {

    record Pregunta(@NotBlank @Size(max = 4000) String texto) {}
    record Respuesta(String texto) {}

    private final TutorService tutor;

    TutorController(TutorService tutor) { this.tutor = tutor; }

    @PostMapping
    Respuesta preguntar(@RequestHeader("X-Alumno-Id") String alumnoId, @RequestBody @jakarta.validation.Valid Pregunta p) {
        return new Respuesta(tutor.preguntar("alumno-" + alumnoId, p.texto()));
    }

    @PostMapping(value = "/stream", produces = MediaType.TEXT_EVENT_STREAM_VALUE)
    Flux<String> stream(@RequestHeader("X-Alumno-Id") String alumnoId, @RequestBody @jakarta.validation.Valid Pregunta p) {
        return tutor.preguntarStream("alumno-" + alumnoId, p.texto());
    }
}

import dev.langchain4j.memory.chat.MessageWindowChatMemory;
import dev.langchain4j.model.anthropic.AnthropicChatModel;
import dev.langchain4j.service.AiServices;
import dev.langchain4j.service.MemoryId;
import dev.langchain4j.service.SystemMessage;
import dev.langchain4j.service.UserMessage;

public class AsistenteFct {

    record EvaluacionPractica(String empresa, int puntuacion, java.util.List<String> fortalezas, java.util.List<String> mejoras) {}

    interface Asistente {
        @SystemMessage("Eres coordinador de prácticas FCT. Responde siempre en español.")
        String chat(@MemoryId String alumno, @UserMessage String mensaje);

        @SystemMessage("Extrae la evaluación de la memoria de prácticas. Puntuación de 0 a 10.")
        EvaluacionPractica evaluar(@UserMessage String memoria);
    }

    public static void main(String[] args) {
        var modelo = AnthropicChatModel.builder()
                .apiKey(System.getenv("ANTHROPIC_API_KEY"))
                .modelName("claude-sonnet-5-5")
                .maxTokens(4000)
                .build();

        Asistente asistente = AiServices.builder(Asistente.class)
                .chatModel(modelo)
                .chatMemoryProvider(id -> MessageWindowChatMemory.withMaxMessages(20))
                .build();

        System.out.println(asistente.chat("ana", "Empiezo la FCT el lunes en una consultora. ¿Qué debo preparar?"));
        System.out.println(asistente.evaluar("Durante las prácticas en Indra desarrollé una API REST..."));
    }
}` },

    return [{"codigo": c, "nombre": n, "horas": h} for c, n, h in filas]

import json
import anthropic
from pydantic import ValidationError
from herramientas import TOOLS, EJECUTORES

client = anthropic.Anthropic()


def responder(pregunta: str, max_iter: int = 6) -> str:
    mensajes = [{"role": "user", "content": pregunta}]
    for _ in range(max_iter):
        r = client.messages.create(model="claude-opus-5-5", max_tokens=8000, tools=TOOLS,
                                   system="Responde usando solo datos obtenidos con las herramientas.",
                                   messages=mensajes)
        mensajes.append({"role": "assistant", "content": r.content})
        if r.stop_reason != "tool_use":
            return "".join(b.text for b in r.content if b.type == "text")

        resultados = []
        for b in r.content:
            if b.type != "tool_use":
                continue
            Modelo, funcion = EJECUTORES[b.name]
            try:
                salida = funcion(Modelo.model_validate(b.input))
                resultados.append({"type": "tool_result", "tool_use_id": b.id,
                                   "content": json.dumps(salida, ensure_ascii=False)})
            except (ValidationError, Exception) as e:   # el modelo verá el error y podrá corregir
                resultados.append({"type": "tool_result", "tool_use_id": b.id,
                                   "content": f"Error: {e}", "is_error": True})
        mensajes.append({"role": "user", "content": resultados})   # todos los resultados en un único mensaje
    return "No se pudo completar la consulta en el número máximo de pasos."

import hashlib
import re
from dataclasses import dataclass
from docling.document_converter import DocumentConverter
import tiktoken

enc = tiktoken.get_encoding("o200k_base")


@dataclass
class Fragmento:
    doc: str
    seccion: str
    texto: str
    hash: str


def a_markdown(ruta: str) -> str:
    return DocumentConverter().convert(ruta).document.export_to_markdown()


def trocear(md: str, doc: str, max_tokens: int = 400, solape: int = 50) -> list[Fragmento]:
    fragmentos, seccion = [], "Introducción"
    for bloque in re.split(r"\n(?=#{1,3} )", md):              # 1.º por títulos
        titulo = re.match(r"#{1,3} (.+)", bloque)
        if titulo:
            seccion = titulo.group(1).strip()
        tokens = enc.encode(bloque)
        paso = max_tokens - solape
        for i in range(0, max(len(tokens), 1), paso):          # 2.º ventana con solape
            texto = enc.decode(tokens[i:i + max_tokens]).strip()
            if len(texto) > 40:
                h = hashlib.sha256(texto.encode()).hexdigest()[:16]
                fragmentos.append(Fragmento(doc, seccion, f"[{seccion}] {texto}", h))
    return fragmentos` },

    t = unicodedata.normalize("NFKD", t.lower()).encode("ascii", "ignore").decode()
    return [w for w in re.findall(r"[a-z0-9/.-]+", t) if w not in STOP]


class Hibrido:
    def __init__(self, fragmentos: list[dict]):
        self.frags = fragmentos
        self.bm25 = BM25Okapi([normalizar(f["texto"]) for f in fragmentos])
        self.emb = SentenceTransformer("BAAI/bge-m3")
        self.mat = self.emb.encode([f["texto"] for f in fragmentos], normalize_embeddings=True)

    def bm25_top(self, q: str, k: int = 50) -> list[int]:
        return list(np.argsort(-self.bm25.get_scores(normalizar(q)))[:k])

    def denso_top(self, q: str, k: int = 50) -> list[int]:
        return list(np.argsort(-(self.mat @ self.emb.encode(q, normalize_embeddings=True)))[:k])

    @staticmethod
    def rrf(*rankings: list[int], k: int = 60) -> list[int]:
        puntos: dict[int, float] = {}
        for ranking in rankings:
            for rango, idx in enumerate(ranking):
                puntos[idx] = puntos.get(idx, 0) + 1 / (k + rango + 1)
        return sorted(puntos, key=puntos.get, reverse=True)

    def buscar(self, q: str, k: int = 50) -> list[int]:
        return self.rrf(self.bm25_top(q, k), self.denso_top(q, k))[:k]` },

import re
import anthropic
from neo4j import GraphDatabase, READ_ACCESS

client = anthropic.Anthropic()
driver = GraphDatabase.driver("bolt://localhost:7687", auth=("neo4j", "master-ia-2026"))
PROHIBIDO = re.compile(r"\b(CREATE|MERGE|DELETE|DETACH|SET|REMOVE|DROP|LOAD|CALL\s+dbms|CALL\s+apoc)\b", re.I)


def esquema() -> str:
    with driver.session(default_access_mode=READ_ACCESS) as s:
        rels = s.run("MATCH (a)-[r]->(b) RETURN DISTINCT labels(a)[0] AS o, type(r) AS t, labels(b)[0] AS d").data()
    return "\n".join(f"(:{r['o']})-[:{r['t']}]->(:{r['d']})" for r in rels)

import json
import sqlite3
import numpy as np
from sentence_transformers import SentenceTransformer

_emb = SentenceTransformer("intfloat/multilingual-e5-small")


class MemoriaLargoPlazo:
    def __init__(self, ruta: str = "memoria.db"):
        self.db = sqlite3.connect(ruta)
        self.db.execute("CREATE TABLE IF NOT EXISTS recuerdos (id INTEGER PRIMARY KEY, usuario TEXT, texto TEXT, vec TEXT, creado TEXT DEFAULT CURRENT_TIMESTAMP)")

    def guardar(self, usuario: str, texto: str) -> str:
        v = _emb.encode("passage: " + texto, normalize_embeddings=True).tolist()
        self.db.execute("INSERT INTO recuerdos (usuario, texto, vec) VALUES (?, ?, ?)", (usuario, texto, json.dumps(v)))
        self.db.commit()
        return "Guardado."

    def buscar(self, usuario: str, consulta: str, k: int = 3) -> list[str]:
        filas = self.db.execute("SELECT texto, vec FROM recuerdos WHERE usuario = ?", (usuario,)).fetchall()
        if not filas:
            return []
        q = _emb.encode("query: " + consulta, normalize_embeddings=True)
        sims = np.array([json.loads(v) for _, v in filas]) @ q
        return [filas[i][0] for i in np.argsort(-sims)[:k] if sims[i] > 0.75]

    def olvidar_usuario(self, usuario: str):          # derecho de supresión
        self.db.execute("DELETE FROM recuerdos WHERE usuario = ?", (usuario,)); self.db.commit()` },

import subprocess
import anthropic

client = anthropic.Anthropic()


def generar(enunciado: str, reflexiones: list[str]) -> str:
    previas = "\n".join(f"- {r}" for r in reflexiones) or "ninguna"
    r = client.messages.create(
        model="claude-opus-5-5", max_tokens=6000,
        system="Devuelve SOLO el contenido del fichero solucion.py, sin explicaciones ni vallas de código.",
        messages=[{"role": "user", "content": f"{enunciado}\n\nLecciones de intentos anteriores:\n{previas}"}])
    return r.content[0].text


def reflexionar(codigo: str, salida_tests: str) -> str:
    r = client.messages.create(
        model="claude-sonnet-5-5", max_tokens=1000,
        messages=[{"role": "user", "content": f"Código:\n{codigo}\n\nSalida de pytest:\n{salida_tests[-3000:]}\n\n"
                   "En 2 frases: causa raíz del fallo y qué cambiar en el próximo intento."}])
    return r.content[0].text


def resolver(enunciado: str, intentos: int = 4) -> bool:
    reflexiones: list[str] = []
    for i in range(intentos):
        codigo = generar(enunciado, reflexiones)
        open("solucion.py", "w", encoding="utf-8").write(codigo)
        t = subprocess.run(["pytest", "-q", "tests/test_solucion.py"], capture_output=True, text=True, timeout=60)

            print(f"Resuelto en el intento {i + 1}"); return True
        reflexiones.append(reflexionar(codigo, t.stdout + t.stderr))

      { t: 'Herramientas de navegador basadas en accesibilidad', lang: 'python', file: 'src/navegador.py', code: c`
from playwright.sync_api import sync_playwright

DOMINIOS_PERMITIDOS = ("localhost", "demo.jrotero.local")


class Navegador:
    def __init__(self):
        self.pw = sync_playwright().start()
        self.browser = self.pw.chromium.launch(headless=True)
        self.page = self.browser.new_page()
        self.acciones: list[str] = []

    def navegar(self, url: str) -> str:
        if not any(d in url for d in DOMINIOS_PERMITIDOS):
            return f"Error: dominio no permitido. Permitidos: {DOMINIOS_PERMITIDOS}"
        self.page.goto(url); self.acciones.append(f'page.goto("{url}")')
        return self.instantanea()

    def instantanea(self) -> str:
        return self.page.locator("body").aria_snapshot()[:6000]       # árbol de accesibilidad en YAML

    def clic(self, rol: str, nombre: str) -> str:
        self.page.get_by_role(rol, name=nombre).click()
        self.acciones.append(f'page.get_by_role("{rol}", name="{nombre}").click()')
        return self.instantanea()

    def rellenar(self, etiqueta: str, valor: str) -> str:
        self.page.get_by_label(etiqueta).fill(valor)
        self.acciones.append(f'page.get_by_label("{etiqueta}").fill("{valor}")')
        return "OK"

    def cerrar(self):
        self.browser.close(); self.pw.stop()` },

import hashlib
import anthropic

client = anthropic.Anthropic()

import torch
import torch.nn.functional as F
from transformers import AutoModelForCausalLM, AutoTokenizer

tok = AutoTokenizer.from_pretrained("Qwen/Qwen2.5-0.5B-Instruct")
teacher = AutoModelForCausalLM.from_pretrained("Qwen/Qwen2.5-7B-Instruct", torch_dtype=torch.bfloat16, device_map="auto").eval()
student = AutoModelForCausalLM.from_pretrained("Qwen/Qwen2.5-0.5B-Instruct", torch_dtype=torch.bfloat16).cuda()
opt = torch.optim.AdamW(student.parameters(), lr=1e-5)
T, ALFA = 2.0, 0.5


def paso(textos: list[str]) -> float:
    b = tok(textos, return_tensors="pt", padding=True, truncation=True, max_length=512).to("cuda")
    with torch.no_grad():
        z_t = teacher(**b).logits
    salida = student(**b, labels=b["input_ids"])
    z_s = salida.logits
    mascara = b["attention_mask"].unsqueeze(-1)
    kd = F.kl_div(F.log_softmax(z_s / T, -1), F.softmax(z_t / T, -1), reduction="none")
    kd = (kd * mascara).sum() / mascara.sum() * T * T
    loss = ALFA * kd + (1 - ALFA) * salida.loss       # imitar al Teacher + aprender los datos
    opt.zero_grad(); loss.backward(); opt.step()
    return loss.item()` },

import ai.onnxruntime.OnnxTensor
import ai.onnxruntime.OrtEnvironment
import ai.onnxruntime.OrtSession
import android.content.Context
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.withContext
import java.nio.LongBuffer

class ClasificadorDudas(context: Context, private val tokenizer: WordPieceTokenizer) : AutoCloseable {
    private val env = OrtEnvironment.getEnvironment()
    private val sesion: OrtSession = env.createSession(
        context.assets.open("model_int8.onnx").readBytes(),
        OrtSession.SessionOptions().apply { addNnapi() }      // aceleración si está disponible
    )
    private val etiquetas = listOf("Acceso a Datos", "PMDM", "PSP", "Interfaces", "Otros")

    suspend fun clasificar(texto: String): Pair<String, Float> = withContext(Dispatchers.Default) {
        val ids = tokenizer.encode(texto, maxLen = 128)          // LongArray con [CLS] ... [SEP] + padding
        val mascara = LongArray(ids.size) { if (ids[it] != 0L) 1L else 0L }
        val forma = longArrayOf(1, ids.size.toLong())
        OnnxTensor.createTensor(env, LongBuffer.wrap(ids), forma).use { tIds ->
            OnnxTensor.createTensor(env, LongBuffer.wrap(mascara), forma).use { tMask ->
                sesion.run(mapOf("input_ids" to tIds, "attention_mask" to tMask)).use { r ->
                    @Suppress("UNCHECKED_CAST")
                    val logits = (r[0].value as Array<FloatArray>)[0]
                    val exp = logits.map { kotlin.math.exp(it.toDouble()) }
                    val i = logits.indices.maxBy { logits[it] }
                    etiquetas[i] to (exp[i] / exp.sum()).toFloat()
                }
            }
        }
    }

    override fun close() { sesion.close() }
}` },

import asyncio
import json
import re
import tempfile
import anthropic
from fastapi import FastAPI, WebSocket, WebSocketDisconnect
from voz import sintetizar, transcribir

app = FastAPI()
claude = anthropic.AsyncAnthropic()
FIN_FRASE = re.compile(r"(?<=[.!?¿¡:;])\s+")
SISTEMA = ("Eres el asistente de voz del CFP José Ramón Otero. Respuestas habladas: frases cortas, "
           "sin listas ni código, máximo 4 frases. Recuerda que eres una IA si te lo preguntan.")


@app.websocket("/voz")
async def voz(ws: WebSocket):
    await ws.accept()
    historial: list[dict] = []
    try:
        while True:
            audio = await ws.receive_bytes()                     # un turno completo (push-to-talk)
            with tempfile.NamedTemporaryFile(suffix=".webm", delete=False) as f:
                f.write(audio)
            texto = await asyncio.to_thread(transcribir, f.name)
            await ws.send_text(json.dumps({"tipo": "transcripcion", "texto": texto}))
            historial.append({"role": "user", "content": texto})

            pendiente, respuesta = "", ""
            async with claude.messages.stream(model="claude-haiku-5-5", max_tokens=600, system=SISTEMA,
                                              output_config={"effort": "low"}, messages=historial) as s:
                async for delta in s.text_stream:
                    pendiente += delta; respuesta += delta
                    *frases, pendiente = FIN_FRASE.split(pendiente)
                    for frase in frases:                         # habla en cuanto hay una frase completa
                        await ws.send_text(json.dumps({"tipo": "texto", "texto": frase}))
                        await ws.send_bytes(await asyncio.to_thread(sintetizar, frase))
            if pendiente.strip():
                await ws.send_bytes(await asyncio.to_thread(sintetizar, pendiente))
            historial.append({"role": "assistant", "content": respuesta})
            await ws.send_text(json.dumps({"tipo": "fin"}))
    except WebSocketDisconnect:
        pass                                                     # no se conserva el audio del usuario` },

import hashlib
from langfuse import get_client, observe
from recuperadores import Hibrido
from rerank import reordenar
from responder import client, SISTEMA

langfuse = get_client()


def seudonimo(usuario: str) -> str:
    return hashlib.sha256(("sal-jro-" + usuario).encode()).hexdigest()[:12]


@observe(name="recuperacion")
def recuperar(h: Hibrido, pregunta: str):
    return reordenar(pregunta, [h.frags[i] for i in h.buscar(pregunta, 40)], top=6)


@observe(name="generacion", as_type="generation")
def generar(pregunta: str, contexto: list[dict]) -> str:
    bloques = "\n\n".join(f"[{i+1}] {c['texto']}" for i, c in enumerate(contexto))
    r = client.messages.create(model="claude-opus-5-5", max_tokens=3000, system=SISTEMA,
                               messages=[{"role": "user", "content": f"<fragmentos>{bloques}</fragmentos>\n{pregunta}"}])
    langfuse.update_current_generation(model="claude-opus-5-5",
        usage_details={"input": r.usage.input_tokens, "output": r.usage.output_tokens})
    return r.content[0].text


@observe(name="consulta-normativa")
def consultar(h: Hibrido, pregunta: str, usuario: str) -> str:
    langfuse.update_current_trace(user_id=seudonimo(usuario), tags=["rag", "v2.3"])
    return generar(pregunta, recuperar(h, pregunta))` },

LETRAS = "TRWAGMYFPDXBNJZSQVHLCKE"


class DniNieRecognizer(PatternRecognizer):
    def __init__(self):
        super().__init__(supported_entity="ES_DNI_NIE", supported_language="es",

    def validate_result(self, texto: str) -> bool:
        num = texto[:-1].replace("X", "0").replace("Y", "1").replace("Z", "2")

def clasificar_entrada(texto: str) -> Clasificacion:

import java.util.regex.Matcher;
import java.util.regex.Pattern;
import org.springframework.stereotype.Component;

@Component
public class EnmascaradorPii {
    private static final Pattern DNI = Pattern.compile("\\b([XYZ]?\\d{7,8})([A-Z])\\b");
    private static final Pattern EMAIL = Pattern.compile("[\\w.+-]+@[\\w-]+\\.[\\w.]+");
    private static final String LETRAS = "TRWAGMYFPDXBNJZSQVHLCKE";

    public String enmascarar(String texto) {
        Matcher m = DNI.matcher(texto);
        StringBuilder sb = new StringBuilder();
        while (m.find()) {
            String num = m.group(1).replace('X', '0').replace('Y', '1').replace('Z', '2');
            boolean valido = LETRAS.charAt((int) (Long.parseLong(num) % 23)) == m.group(2).charAt(0);
            m.appendReplacement(sb, valido ? "<DNI>" : m.group());
        }
        m.appendTail(sb);
        return EMAIL.matcher(sb.toString()).replaceAll("<EMAIL>");
    }
}

async function onLogin(f) {
  const email = f.email.value.trim().toLowerCase();
  const pw = f.password.value;
  const err = $('#login-err');
  err.textContent = '';
  const u = db.users[email];
  if (!u) { err.textContent = 'No existe ninguna cuenta con ese correo. Si eres titulado DAM, regístrate.'; return; }
  if (esDirector(u) && !u.hash) { ui.authVista = 'setup'; render(); return; }
  if (!pw) { err.textContent = 'Introduce tu contraseña.'; return; }
  try {
    const { hash } = await derivarHash(pw, u.salt);
    if (hash !== u.hash) { err.textContent = 'Contraseña incorrecta.'; return; }
  } catch (e) { err.textContent = e.message; return; }
  if (u.estado === 'rechazado') { err.textContent = 'Tu solicitud de admisión no ha sido aceptada. Contacta con ' + ADMIN_EMAIL + '.'; return; }
  setSesionEmail(email);
  registrarAuditoria('Inicio de sesión', email);
  guardar();
  if (!location.hash || location.hash === '#/') ir('inicio'); else render();
}

async function onSetup(f) {
  const err = $('#setup-err');
  const pw = f.password.value, pw2 = f.password2.value;
  if (!passwordValida(pw)) { err.textContent = 'La contraseña no cumple la política de seguridad.'; return; }
  if (pw !== pw2) { err.textContent = 'Las contraseñas no coinciden.'; return; }
  const admin = db.users[ADMIN_EMAIL];
  if (admin.hash) { err.textContent = 'La contraseña del Director ya está configurada.'; return; }
  try { Object.assign(admin, await derivarHash(pw)); } catch (e) { err.textContent = e.message; return; }
  registrarAuditoria('Configuración inicial de la cuenta del Director', ADMIN_EMAIL);
  setSesionEmail(ADMIN_EMAIL);
  guardar();
  ui.authVista = 'login';
  toast('Bienvenido, ' + ADMIN_NAME + '. Panel de Dirección activado.');
  ir('direccion/admisiones');
}

async function onRegistro(f) {
  const err = $('#reg-err');
  const fallo = m => { err.textContent = m; err.scrollIntoView({ block: 'center', behavior: 'smooth' }); };
  const nombre = f.nombre.value.trim();
  const email = f.email.value.trim().toLowerCase();
  const codigo = f.codigo.value.trim().toUpperCase();
  const promocion = f.promocion.value;
  const nacimiento = f.nacimiento.value;
  const pw = f.password.value;

  if (nombre.length < 5 || nombre.split(/\s+/).length < 2) return fallo('Indica nombre y al menos un apellido.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return fallo('El correo electrónico no es válido.');
  if (db.users[email]) return fallo('Ya existe una cuenta con ese correo.');
  const dominioCentro = email.endsWith('@jrotero.es');
  let codigoObj = null;
  if (!dominioCentro) {
    if (!codigo) return fallo('Tu correo no es @jrotero.es: necesitas un código de admisión de posgrado emitido por la Dirección.');
    codigoObj = db.codigos.find(x => x.codigo === codigo && !x.usadoPor && !x.revocado);
    if (!codigoObj) return fallo('El código de admisión no es válido, ya se ha usado o ha sido revocado.');
  }
  if (!promocion) return fallo('Selecciona tu promoción de graduación en DAM.');
  if (!nacimiento) return fallo('Indica tu fecha de nacimiento.');
  if (edad(nacimiento) < 18) return fallo('Debes ser mayor de edad para matricularte en el Máster.');
  if (!f.mayor.checked) return fallo('Debes declarar tu mayoría de edad y titulación DAM.');
  if (!passwordValida(pw)) return fallo('La contraseña debe tener al menos 10 caracteres, una mayúscula, una minúscula y un número.');
  if (pw !== f.password2.value) return fallo('Las contraseñas no coinciden.');
  if (!f.consentDatos.checked) return fallo('Necesitamos tu consentimiento para tratar tus datos académicos.');
  if (!f.consentEtica.checked) return fallo('Debes aceptar el compromiso ético de Gobernanza de IA y EU AI Act.');

  let cred;
  try { cred = await derivarHash(pw); } catch (e) { return fallo(e.message); }
  const ahora = new Date().toISOString();
  db.users[email] = {
    email, nombre, rol: 'alumno', promocion, centro: f.centro.value.trim(), nacimiento,
    salt: cred.salt, hash: cred.hash, creado: ahora,
    estado: codigoObj ? 'admitido' : 'pendiente',
    via: codigoObj ? 'codigo:' + codigoObj.codigo : 'dominio',
    consentimientos: {
      datos: { aceptado: true, fecha: ahora, version: 'RGPD-1.0' },
      etica: { aceptado: true, fecha: ahora, version: 'IA-ETICA-1.0' }
    },
    oposicion: null, limitacion: null, progreso: {}, tfm: null, tribunal: null, titulo: null
  };
  if (codigoObj) { codigoObj.usadoPor = email; codigoObj.fechaUso = ahora; }
  registrarAuditoria('Alta de alumno (' + (codigoObj ? 'código de admisión' : 'dominio @jrotero.es') + ')', email);
  setSesionEmail(email);
  guardar();
  toast(codigoObj ? 'Admisión confirmada con código de posgrado. ¡Bienvenido/a!' : 'Solicitud registrada. Mientras la Dirección la valida, tienes acceso al Módulo 0.');
  ir('inicio');
}

      }

  return html;
}

/* ---------------------------------------------------------------------
 *  Vista de sesión con la barra de 5 pestañas
 * ------------------------------------------------------------------- */
function vistaSesion(u, n, tab) {
  const s = sesion(n);
  if (!s) return '<div class="p-8">Sesión no encontrada.</div>';
  const m = moduloDe(n);
  if (!puedeAcceder(u, n)) {
    return '<div class="max-w-3xl mx-auto p-8"><div class="card p-8 text-center"><div class="text-4xl">🔒</div><h1 class="text-xl font-extrabold mt-3">Sesión ' + n + ' bloqueada</h1><p class="text-gray-600 mt-2">Tu admisión está pendiente de validación por la Dirección del Máster. Mientras tanto puedes cursar el Módulo 0 (Sesiones 1 a 4).</p><a class="btn btn-primary mt-5" href="#/sesion/1/teoria">Ir a la Sesión 1</a></div></div>';
  }
  if (!TABS.some(t => t[0] === tab)) tab = 'teoria';
  const hecho = u.progreso && u.progreso[n];
  const prev = n > 1 ? '<a class="btn btn-ghost btn-sm" href="#/sesion/' + (n - 1) + '/' + tab + '">← Sesión ' + (n - 1) + '</a>' : '';
  const next = n < TOTAL_SESIONES ? '<a class="btn btn-ghost btn-sm" href="#/sesion/' + (n + 1) + '/' + tab + '">Sesión ' + (n + 1) + ' →</a>' : '';

  let cuerpo = '';
  if (tab === 'teoria') cuerpo = tabTeoria(s);
  else if (tab === 'taller') cuerpo = tabTaller(s);
  else if (tab === 'prompts') cuerpo = tabPrompts(s);
  else if (tab === 'actividad') cuerpo = tabActividad(u, s);
  else cuerpo = tabFaq(s);

  return '<div class="max-w-5xl mx-auto p-4 sm:p-8">' +
    '<div class="card overflow-hidden"><div style="height:8px;background:' + colorMod(m) + '"></div><div class="p-5 sm:p-7">' +
    '<div class="flex flex-wrap items-center gap-2"><span class="chip ' + (m.color === 'sage' ? 'chip-sage' : 'chip-terra') + '">Módulo ' + m.id + ' · ' + esc(m.corto) + '</span><span class="chip chip-gold">Sesión ' + n + ' de 28</span>' +
    (s.duracion ? '<span class="chip">' + esc(s.duracion) + '</span>' : '') + '</div>' +
    '<h1 class="text-2xl sm:text-[1.7rem] font-extrabold leading-tight mt-3">Sesión ' + n + ' | ' + esc(s.titulo) + '</h1>' +

    '<div class="flex flex-wrap items-center gap-2 mt-5">' +

    '</div>' +
    '<div class="px-3 sm:px-5"><div class="tabs" role="tablist" aria-label="Secciones de la sesión">' +
    TABS.map(t => '<a class="tab no-underline" role="tab" aria-selected="' + (t[0] === tab) + '" href="#/sesion/' + n + '/' + t[0] + '">' + t[1] + '</a>').join('') +
    '</div></div></div>' +
    '<section class="mt-5" role="tabpanel">' + cuerpo + '</section></div>';
}

}

function expedienteDe(email) {
  const u = db.users[email];
  const copia = Object.assign({}, u);
  delete copia.hash; delete copia.salt;
  return {
    responsable: 'CFP José Ramón Otero', contacto: ADMIN_EMAIL, exportado: new Date().toISOString(),
    formato: 'JSON (art. 20 RGPD - portabilidad)', titulacion: TITULO_MASTER,
    alumno: copia,
    entregas: db.entregas.filter(e => e.email === email),
    titulo: db.titulos.filter(t => t.email === email),
    auditoria: db.audit.filter(a => a.email === email)
  };
}

function onTFM(f, submitter) {
  const u = usuarioActual();
  const err = $('#tfm-err');
  const accion = submitter && submitter.value === 'depositar' ? 'depositar' : 'borrador';
  const titulo = f.titulo.value.trim();
  const repo = f.repo.value.trim();
  if (titulo.length < 8) { err.textContent = 'El título del TFM es demasiado corto.'; return; }
  if (repo && !isHttpsUrl(repo)) { err.textContent = 'El repositorio debe ser una URL https://.'; return; }
  if (accion === 'depositar') {
    if (!repo) { err.textContent = 'Para depositar necesitas indicar el repositorio.'; return; }
    if (f.resumen.value.trim().length < 80) { err.textContent = 'El resumen debe tener al menos 80 caracteres.'; return; }
    if (!f.original.checked) { err.textContent = 'Debes declarar la autoría original del TFM.'; return; }
  }
  const previo = u.tfm || {};
  u.tfm = {
    titulo, repo, resumen: f.resumen.value.trim(), original: f.original.checked,
    estado: accion === 'depositar' ? 'depositado' : (previo.estado === 'depositado' ? 'depositado' : 'borrador'),
    fecha: accion === 'depositar' ? new Date().toISOString() : previo.fecha || null
  };
  registrarAuditoria(accion === 'depositar' ? 'Depósito del TFM' : 'Borrador del TFM', u.email);
  guardar();
  toast(accion === 'depositar' ? 'TFM depositado. El Tribunal será notificado.' : 'Borrador guardado.');
  render();
}

];

function vistaDireccion(u, sub) {
  if (!esDirector(u)) return '<div class="p-8">Acceso restringido a la Dirección del Máster.</div>';
  if (!SUBDIR.some(s => s[0] === sub)) sub = 'admisiones';
  const pendientesAdm = alumnos().filter(a => a.estado === 'pendiente').length;
  const pendientesEnt = db.entregas.filter(e => e.estado === 'pendiente').length;
  const tfmDep = alumnos().filter(a => a.tfm && a.tfm.estado === 'depositado' && !a.titulo).length;
  const contador = { admisiones: pendientesAdm, calificaciones: pendientesEnt, tribunal: tfmDep };
  let cuerpo = '';
  if (sub === 'admisiones') cuerpo = dirAdmisiones();
  else if (sub === 'seguimiento') cuerpo = dirSeguimiento();
  else if (sub === 'calificaciones') cuerpo = dirCalificaciones();
  else if (sub === 'tribunal') cuerpo = dirTribunal();
  else if (sub === 'titulos') cuerpo = dirTitulos();
  else cuerpo = dirDatos();

    '<td><span class="chip ' + (a.estado === 'admitido' ? 'chip-sage' : a.estado === 'pendiente' ? 'chip-gold' : 'chip-terra') + '">' + esc(a.estado) + '</span></td>' +

  const codigos = db.codigos.slice().reverse().map(x => '<tr><td class="font-mono font-bold">' + esc(x.codigo) + '</td><td>' + fmtFecha(x.creado) + '</td><td>' + (x.nota ? esc(x.nota) : '—') + '</td>' +
    '<td>' + (x.usadoPor ? 'Usado por ' + esc(x.usadoPor) : x.revocado ? 'Revocado' : '<span class="chip chip-sage">Disponible</span>') + '</td>' +
    '<td>' + (!x.usadoPor && !x.revocado ? '<button class="btn btn-ghost btn-sm" data-act="copiar-texto" data-texto="' + esc(x.codigo) + '">Copiar</button> <button class="btn btn-danger btn-sm" data-act="revocar-codigo" data-codigo="' + esc(x.codigo) + '">Revocar</button>' : '') + '</td></tr>').join('');
  return '<div class="grid gap-5"><div class="card p-5"><h2 class="font-extrabold text-lg mb-3">Solicitudes de admisión de titulados DAM</h2>' +
    (filas ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Alumno/a</th><th>Titulación</th><th>Vía</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>' + filas + '</tbody></table></div>' : '<p class="text-sm text-gray-500">Todavía no hay solicitudes.</p>') + '</div>' +

    (codigos ? '<div class="tbl-wrap mt-4"><table class="tbl"><thead><tr><th>Código</th><th>Emitido</th><th>Referencia</th><th>Estado</th><th></th></tr></thead><tbody>' + codigos + '</tbody></table></div>' : '') + '</div></div>';
}

function dirSeguimiento() {
  const lista = alumnos();
  if (!lista.length) return '<div class="card p-5 text-sm text-gray-500">No hay alumnado registrado.</div>';
  const filas = lista.map(a => {
    const p = progresoDe(a);
    const ent = db.entregas.filter(e => e.email === a.email);
    const ev = ent.filter(e => e.estado === 'evaluada');
    const media = ev.length ? ev.reduce((s, e) => s + e.nota, 0) / ev.length : null;
    let celdas = '';
    for (let n = 1; n <= TOTAL_SESIONES; n++) {
      const m = moduloDe(n);

function notaFinalTFM(t) {
  if (!t) return null;
  let total = 0;
  for (const r of RUBRICA_TFM) {
    const v = Number(t[r[0]]);
    if (t[r[0]] === '' || t[r[0]] == null || isNaN(v)) return null;
    total += v * r[2];
  }
  return Math.round(total * 100) / 100;
}

async function emitirTitulo(email) {
  const a = db.users[email];
  const t = a && a.tribunal;
  const final = notaFinalTFM(t);
  if (!a || a.titulo || !a.tfm || a.tfm.estado !== 'depositado' || !t || t.acta !== 'apto' || final == null || final < 5) {
    toast('No se cumplen los requisitos para emitir el título.', 'bad'); return;
  }
  const año = new Date().getFullYear();
  const secuencia = db.titulos.filter(x => x.numero.indexOf('MIA-JRO-' + año) === 0).length + 1;
  const numero = 'MIA-JRO-' + año + '-' + String(secuencia).padStart(4, '0');
  const fecha = new Date().toISOString();
  const verificacion = (await sha256Hex([numero, email, final, fecha].join('|'))).slice(0, 16).toUpperCase().match(/.{4}/g).join('-');
  a.titulo = { numero, fecha, nota: final, verificacion };
  db.titulos.push({ numero, email, nombre: a.nombre, promocion: a.promocion, fecha, nota: final, verificacion, tfm: a.tfm.titulo });
  registrarAuditoria('Emisión del Título Propio de Máster ' + numero, email);
  guardar();
  toast('Título ' + numero + ' expedido.');
  ir('diploma/' + encodeURIComponent(email));
}

function abrirModal(html) {
  $('#modal-root').innerHTML = '<div class="modal-back" data-act="cerrar-modal-fondo"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
  const primero = $('#modal-root input, #modal-root button');
  if (primero) primero.focus();
}
function cerrarModal() { $('#modal-root').innerHTML = ''; }

/* ---------------------------------------------------------------------
 *  Render principal
 * ------------------------------------------------------------------- */
function render() {
  const u = usuarioActual();
  const app = $('#app');
  if (!u) {
    if (ui.authVista === 'setup' && db.users[ADMIN_EMAIL].hash) ui.authVista = 'login';
    app.innerHTML = vistaAuth();
    return;
  }
  const r = ruta();
  let actual = r[0] || 'inicio';
  let contenido = '';
  if (actual === 'sesion') {
    const n = Math.min(TOTAL_SESIONES, Math.max(1, parseInt(r[1], 10) || 1));
    contenido = vistaSesion(u, n, r[2] || 'teoria');
    actual = 's' + n;
  } else if (actual === 'perfil') contenido = vistaPerfil(u);
  else if (actual === 'programa') contenido = vistaPrograma();
  else if (actual === 'direccion') contenido = vistaDireccion(u, r[1]);
  else if (actual === 'diploma') contenido = vistaDiploma(u, r[1]);
  else { actual = 'inicio'; contenido = vistaInicio(u); }

  app.innerHTML = cabecera(u) + '<div class="layout">' + barraLateral(u, actual) + '<main id="main" class="min-w-0">' + contenido +
    '<footer class="max-w-5xl mx-auto px-4 sm:px-8 pb-10 pt-4 text-xs text-gray-500 flex flex-wrap gap-x-4 gap-y-1"><span>© ' + new Date().getFullYear() + ' ' + CENTRO + '</span>' +
    '<button class="underline" data-act="segunda-capa">Protección de datos</button><span>Contacto: ' + ADMIN_EMAIL + '</span></footer></main></div>';
  resaltar();
}

function cambiarEstado(email, estado) {
  const a = db.users[email];
  if (!a) return;
  a.estado = estado;
  a.fechaResolucion = new Date().toISOString();
  registrarAuditoria('Admisión: ' + estado, email);
  guardar(); render();
  toast(a.nombre + ': ' + (estado === 'admitido' ? 'admitido/a en el Máster' : 'solicitud rechazada'));
}

function copiarTexto(texto, el) {
  const ok = () => { const prev = el.textContent; el.textContent = '¡Copiado!'; setTimeout(() => { el.textContent = prev; }, 1400); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(texto).then(ok, () => copiarFallback(texto) && ok());
  } else if (copiarFallback(texto)) ok();
}
function copiarFallback(texto) {
  const ta = document.createElement('textarea');
  ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  if (!ok) toast('No se pudo copiar automáticamente.', 'bad');
  return ok;
}

const formularios = {
  login: f => onLogin(f),
  setup: f => onSetup(f),
  registro: f => onRegistro(f),
  entrega: f => onEntrega(f),
  tfm: (f, sub) => onTFM(f, sub),
  rectificar: f => {
    const u = usuarioActual();
    const nombre = f.nombre.value.trim();
    if (nombre.length < 5) { toast('El nombre es demasiado corto.', 'bad'); return; }
    u.nombre = nombre;
    if (f.promocion) u.promocion = f.promocion.value;
    registrarAuditoria('Derecho de rectificación', u.email);
    guardar(); toast('Datos rectificados.'); render();
  },
  suprimir: f => {
    const u = usuarioActual();
    if (f.email.value.trim().toLowerCase() !== u.email) { $('#sup-err').textContent = 'El correo no coincide.'; return; }
    db.titulos.forEach(t => { if (t.email === u.email) { t.suprimido = new Date().toISOString(); t.email = null; delete t.promocion; } });
    db.entregas = db.entregas.filter(e => e.email !== u.email);
    db.audit.forEach(a => { if (a.email === u.email) a.email = '[suprimido]'; });
    if (u.via && u.via.indexOf('codigo:') === 0) {
      const cod = db.codigos.find(x => x.usadoPor === u.email);
      if (cod) cod.usadoPor = '[suprimido]';
    }
    delete db.users[u.email];
    registrarAuditoria('Derecho de supresión ejercido por un alumno', null);
    guardar(); cerrarModal(); setSesionEmail(null); location.hash = '';
    toast('Tu cuenta y tus datos se han suprimido.'); render();
  },
  codigo: f => {
    const parte = () => uid().slice(0, 4).toUpperCase();
    let codigo;
    do { codigo = 'MIA-' + parte() + '-' + parte(); } while (db.codigos.some(x => x.codigo === codigo));
    db.codigos.push({ codigo, creado: new Date().toISOString(), nota: f.nota.value.trim(), usadoPor: null, revocado: null });
    registrarAuditoria('Emisión de código de admisión ' + codigo, ADMIN_EMAIL);
    guardar(); render(); toast('Código ' + codigo + ' generado.');
  },
  calificar: f => {
    const e = db.entregas.find(x => x.id === f.dataset.id);
    const nota = Number(f.nota.value);
    if (f.nota.value === '' || isNaN(nota) || nota < 0 || nota > 10) { toast('La nota debe estar entre 0 y 10.', 'bad'); return; }
    e.nota = nota; e.feedback = f.feedback.value.trim(); e.estado = 'evaluada'; e.fechaEvaluacion = new Date().toISOString();
    registrarAuditoria('Calificación de la entrega de la Sesión ' + e.sesion + ' (' + fmtNota(nota) + ')', e.email);
    guardar(); render(); toast('Entrega calificada con ' + fmtNota(nota) + '.');
  },
  tribunal: f => {
    const a = db.users[f.dataset.email];
    const t = a.tribunal || {};
    for (const r of RUBRICA_TFM) {
      const raw = f[r[0]].value;
      if (raw === '') { t[r[0]] = null; continue; }
      const v = Number(raw);
      if (isNaN(v) || v < 0 || v > 10) { toast('Las notas del Tribunal deben estar entre 0 y 10.', 'bad'); return; }
      t[r[0]] = v;
    }
    t.observaciones = f.observaciones.value.trim();
    t.acta = f.acta.value;
    t.final = notaFinalTFM(t);
    if (t.acta === 'apto' && (t.final == null || t.final < 5)) { toast('Un acta APTO requiere las 4 notas y una calificación ≥ 5.', 'bad'); return; }
    a.tribunal = t;
    registrarAuditoria('Acta del Tribunal de TFM: ' + t.acta.toUpperCase(), a.email);
    guardar(); render(); toast('Acta guardada.');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = acciones[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target;
  const fn = formularios[f.dataset.form];
  if (!fn) return;
  e.preventDefault();
  fn(f, e.submitter);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.actChange === 'importar-db' && el.files && el.files[0]) {
    const lector = new FileReader();
    lector.onload = () => {
      try {
        const datos = JSON.parse(lector.result);
        if (!datos || typeof datos !== 'object' || !datos.users) throw new Error('formato');
        const adminActual = db.users[ADMIN_EMAIL];
        db = normalizarDB(datos);
        if (!db.users[ADMIN_EMAIL].hash && adminActual.hash) db.users[ADMIN_EMAIL] = adminActual;
        registrarAuditoria('Importación de copia de seguridad', ADMIN_EMAIL);
        guardar(); toast('Copia importada.'); render();
      } catch (err) { toast('El archivo no es una copia válida de la plataforma.', 'bad'); }
    };
    lector.readAsText(el.files[0]);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) cerrarModal(); });
window.addEventListener('hashchange', () => {
  ui.sideAbierta = false;
  const r = ruta();
  if (r[0] === 'sesion') {
    const m = moduloDe(parseInt(r[1], 10) || 1);
    if (m) ui.modsCerrados.delete(m.id);
  }
  render();
  const main = $('#main');
  if (main) window.scrollTo({ top: 0 });
});
window.addEventListener('storage', e => { if (e.key === DB_KEY) { db = cargarDB(); render(); } });

/* ---------------------------------------------------------------------
 *  Arranque
 * ------------------------------------------------------------------- */
(function arrancar() {
  render();
  window.addEventListener('load', resaltar);       // highlight.js llega con defer desde el CDN
  const img = new Image();
  img.onload = () => { LOGO_PNG = true; render(); };
  img.src = 'logo-jrotero.png';
})();

</script>
